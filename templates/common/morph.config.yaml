# The project's Morph config (MorphV2 docs/ORCHESTRATOR_REFERENCE.md §8): read by every morph command from the root.
# Every key is optional; an absent key keeps its built-in value (the commented lines show them).
version: 1
scout:
  grepSkip: [".morph/", "decks/"]   # path prefixes; a GREP that names one (-- decks) lifts it
