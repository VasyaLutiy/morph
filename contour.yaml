            - {given: 'patchAcceptance of ["a.py", "b.md", "c.py"], ["notes.md", "x.ts", "y.py"], ["notes.md"]; patchCard with question "  Do it.\n\n" and targetBytes 30000, 100, 24000, 24001, 24002', when: called, then: '"python3 -m py_compile a.py c.py && python3 -m pytest -q --tb=short"; the TypeScript line; null; instruction "Do it.\n\n" + PATCH_CONTRACT, maxTokens 20000, 16000, 16000, 16002, 16002'}
      dataObjects:
        - name: Scout Session
          description: What one session reads (Run Scout's first parameter) and its deps.
          schema: "{ question, tree: Scout Tree, fs: ScoutFs, seedText, budgets: Scout Budgets, caps: Tool Caps, maxTokens: number | null } + deps { config: ProcessorConfig, transport: Transport, now(): number }"
        - name: Scout Outcome
          description: What Run Scout resolves to.
          schema: "{ status: 'ok' | 'no_answer' | 'invalid_answer', answer: { targets, context_slice, reasoning } | null, stopReason, spent: { calls, reads, chars, rounds }, elapsedMs, usage: { requests, inputTokens, outputTokens, cost: number | null }, journal: { round, turn: 'action' | 'answer' | 'malformed' | 'failed', action: Scout Action | null, chars, error: string | null, inputTokens, outputTokens, cost: number | null }[], messages: Message[] }"
