          schema: "{ schema: 1, scoutId, createdAt, root, ref: string | null, question, questionSha256, protocolSha256, processor, model, seed: { source: 'primer' | 'file', path: string | null, files: string[], chars }, budgets, caps, status, answer, stopReason, spent, elapsedMs, usage, journal }"
