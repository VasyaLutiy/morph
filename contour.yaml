          schema: "{ scoutId, scout, ref: string | null, cards: Card[], dropped: string[], out: string | null }"

    # ---------------------------------------------------------------- P14a
    - name: reviewer
      description: >
        `morph review <base> <head>` checks a diff against the record, git's ownership (the primer's table), a scout report
        and the new tests; deterministic, no model call. P14a (src/reviewer/*.ts): the pure pieces — the obligations of the
        Functions the range touches (their examples named by tests at head), the envelope (files no Morph card of the range
        wrote) and the scope (a scout session's targets), the guardrails Tests Kept and No New Skips, the mutants of a code
        file, and the findings document (EXPECTED/GOT, a source tag, numbers, markdown). No file, no clock, no environment,
        no child process, no Node module in P14a; the git reads, the scout.json read, the mutant runs and `morph review` are
        Component review-session (P14b).
      language: typescript
      requirements: [Deterministic Core]
      functions:
        - name: Find Obligations
          description: The Functions of the record a range touches, each with the examples its tests at head must name.
          behavior: >
            findObligations({record, map, changed: paths changed in the range, cards: the Morph-Card values of the range's
            commits, titles: the test titles at head}) → {obligations, findings}. Components in record order, Functions in
            Component order; profile = language Resolve Profile(component.language, map.language), a failure skips the
            Component. unitName = the name of the first map group (map order) naming the Function, else the Function's
            name; unit = slugName(unitName); cut = language cutTargets(profile, component.name, unitName). codePaths = the
            targets of the map card whose id is unit when they are not null, else [cut code, cut test]; judgePaths = those of
            the map card unit + "-judge", else [cut judge]. touchedBy: first "card <id>" for each card (in the given order)
            whose id without a final ".r<digits>" (cardUnit) is unit or unit + "-judge", then "file <path>" for each changed
            path (given order) in codePaths or judgePaths; each once. Not touched → no obligation. exampleTitle(profile, name,
            n) = "<name> example <n>" (typescript; any profile but python) or "test_<snake name>_example_<n>" (python);
            hasTitle(titles, wanted, profile): a title equal to wanted or starting with wanted + ":" (python: "_"). Each
            example n (1-based) without a title → missing n and the finding {kind "obligation", source "record: <Component> ·
            <Function> · example <n>", path judgePaths[0] or null, expected 'a test named "<wanted>"', got "no test title at
            head starts with it"}. Obligation = {component, function, unit, touchedBy, examples (the count), judge
            (judgePaths[0] or null), missing}; findings in obligation order.
          steps: [{uses: language}, {reads: Contour Record}, {reads: Contour Map}, {produces: Obligation}]
          examples:
            - {given: 'tests/fixtures/reviewer/record.yaml and map.json (Load Spec); changed ["src/shop/addTax.ts", "README.md"], cards [], titles ["Add Tax example 1: the tax", "Add Tax example 3: negative", "Add Tax example 10: other"]', ref: "tests/fixtures/reviewer/record.yaml (Components shop typescript, Ledger Tools python, legacy cobol), tests/fixtures/reviewer/map.json (group price-text, round-price targets)", when: findObligations, then: 'one obligation {shop, "Add Tax", "add-tax", ["file src/shop/addTax.ts"], 3, "tests/shop/addTax.examples.test.ts", [2]}; one finding {obligation, "record: shop · Add Tax · example 2", "tests/shop/addTax.examples.test.ts", "a test named \"Add Tax example 2\"", "no test title at head starts with it"}'}
            - {given: 'changed ["tests/shop/round.examples.test.ts"], cards ["round-price.r2", "price-text-judge", "round-price-judge"], titles ["Round Price example 1: half up", "Round Price example 2", "Format Price example 1: dollars", "Parse Price example 1: dollars", "Parse Price example 2x"]', when: findObligations, then: 'Round Price {unit "round-price", touchedBy ["card round-price", "card round-price-judge", "file tests/shop/round.examples.test.ts"], judge "tests/shop/round.examples.test.ts", missing []}; Format Price and Parse Price {unit "price-text", ["card price-text-judge"], judge "tests/shop/priceText.examples.test.ts"}, missing [] and [2]; one finding, Parse Price example 2'}
            - {given: 'changed ["ledger_tools/sum_rows.py"], titles ["test_sum_rows_example_1", "test_sum_rows_example_2_empty", "Sum Rows example 1: no"]; then titles ["test_sum_rows_example_12"]', when: findObligations, then: '{"Ledger Tools", "Sum Rows", "sum-rows", ["file ledger_tools/sum_rows.py"], 2, "tests/test_sum_rows_examples.py", []}, no finding; then missing [1, 2] and two findings expecting "test_sum_rows_example_1" and "…_2"'}
            - {given: 'cards ["old-total", "add-tax-judge.r11"], changed ["legacy/oldTotal.ts", "tests/shop/addTax.test.ts"]; then changed [] and cards []; exampleTitle, hasTitle, cardUnit called alone', when: findObligations, then: 'legacy (cobol) skipped; Add Tax touched by ["card add-tax-judge", "file tests/shop/addTax.test.ts"]; then {[], []}; "Add Tax example 1", "test_add_tax_example_3"; hasTitle(["Add Tax example 1"], "Add Tax example 1") true, (["Add Tax example 12"], …) false; cardUnit("a.r3") "a", ("a.rx") "a.rx"'}
        - name: Check Envelope
          description: The range's changed files against the cards that wrote them (the envelope) and a scout session's targets (the scope).
          behavior: >
            readDiff(nameStatus, numstat) reads `git diff --name-status -z --no-renames` and `git diff --numstat -z
            --no-renames` of one range: nameStatus split on "\0" into (letter, path) pairs, an empty letter ends; A → "added",
            D → "deleted", any other → "modified"; numstat records "<added>\t<deleted>\t<path>" ("-" → null, a binary file);
            → [{path, status, added, deleted}] in nameStatus order, null counts for a path numstat lacks. MORPH_DIR =
            ".morph/". checkEnvelope({changed, commits: the range's Morph commits {card, model, run, paths} newest first,
            ownership: git's Read Ownership of the whole history, scout: {scoutId, targets, contextSlice} | null}) →
            {applies: commits not empty, rows, findings}. Row per changed file, in order: {path, status, added, deleted,
            writers: the cards (as given) of the commits whose paths hold it, distinct, commit order; owner: ownership's
            newest write of the path "<card> (<model or — when "">, run <run or —>)" or null; scope: null without a scout or
            under MORPH_DIR, else "target" | "context" | "outside" by the scout's lists}. A path under MORPH_DIR gives no
            finding. Per row: applies and no writer → {kind "envelope", source "primer: ownership", path, expected "written
            by a Morph card of the range", got "changed outside every card's targets; " + ("last Morph write <owner>" or "no
            Morph card ever wrote it")}; then, with a scout, scope not "target" → {kind "scope", source "scout <scoutId>",
            path, expected "a target of the scout session (<targets ", "-joined>)", got "changed, though the scout named it as
            context" | "changed, though the scout did not name it"}. Last, each scout target no changed path equals →
            {scope, same source, the target, expected "changed: the scout named it as a target", got "unchanged in the
            range"}.
          steps: [{uses: git}, {reads: Ownership}, {reads: Scout Record}, {produces: Envelope Row}]
          examples:
            - {given: 'nameStatus "M\0a.ts\0M\0bin.dat\0D\0old.ts\0A\0src/sp ace.ts\0", numstat "2\t1\ta.ts\0-\t-\tbin.dat\0" + "0\t1\told.ts\0" + "1\t0\tsrc/sp ace.ts\0" (a real git 2.x pair); then "T\0link\0A\0new.ts\0" with "12\t0\tnew.ts\0"; then "", ""', when: readDiff, then: '[{a.ts, modified, 2, 1}, {bin.dat, modified, null, null}, {old.ts, deleted, 0, 1}, {"src/sp ace.ts", added, 1, 0}]; [{link, modified, null, null}, {new.ts, added, 12, 0}]; []'}
            - {given: 'history (newest first) a-judge (m/x, run r2: tests/a.examples.test.ts), a.r1 (m/x, r2: src/a.ts), b (model "", run null: src/b.ts, src/a.ts); ownership = Read Ownership(history); commits = its first two; changed src/a.ts M +3 -1, src/b.ts M +1 -1, README.md A +2 -0, .morph/runs/r2/report.json A +40 -0, tests/a.examples.test.ts A +30 -0; scout null', when: checkEnvelope, then: 'applies true; writers ["a.r1"], [], [], [], ["a-judge"]; owners "a.r1 (m/x, run r2)", "b (—, run —)", null, null, "a-judge (m/x, run r2)"; scope null; findings envelope src/b.ts "changed outside every card''s targets; last Morph write b (—, run —)", README.md "…; no Morph card ever wrote it"'}
            - {given: 'the same with commits []', when: checkEnvelope, then: 'applies false; every writers []; the same owners; no finding'}
            - {given: 'the first four changed files, commits as in 2, scout {scoutId "20261008-225320-74e423b1", targets ["src/a.ts", "src/c.ts"], contextSlice ["src/b.ts"]}', when: checkEnvelope, then: 'scopes target, context, outside, null; findings in order: envelope src/b.ts, scope src/b.ts "changed, though the scout named it as context", envelope README.md, scope README.md "changed, though the scout did not name it", scope src/c.ts "unchanged in the range", each scope expected "a target of the scout session (src/a.ts, src/c.ts)" but the last "changed: the scout named it as a target"'}
        - name: Check Guardrails
          description: The reviewer's two guardrails on the test files of a range — no test title lost, no new skipped or focused test.
          behavior: >
            The profile of a file is language profileForPath(path)'s id; a file without one is skipped. testTitles(text,
            profile): typescript (and nothing for other ids but python) — every match of /(?<![\w$.])(?:test|it)\(\s*(["'`])(.*?)\1/g,
            group 2 (a test.skip or it.only call is no title); python — every /^[ \t]*(?:async[ \t]+)?def[ \t]+(test\w*)[ \t]*\(/gm,
            group 1; in text order. skipCount(text, profile): typescript /(?<![\w$.])(?:test|it|describe)\.(?:only|skip|todo)\(/g,
            python /@(?:pytest\.mark\.(?:skipif|skip|xfail)|unittest\.skip)\b/g, else 0. GUARDRAILS = ["Tests Kept", "No New
            Skips"]. checkGuardrails({base: test files at base, head: test files at head, each {path, text}}) → {rows,
            findings}. Tests Kept: each base file (base order) with a profile; its distinct titles in order; a title the head
            file of the same path lacks (or no head file) → {kind "guardrail", source "guardrail Tests Kept", path, expected
            'the test "<title>" kept', got "no test of that name at head" | "the test file is gone at head"}. No New Skips: each
            head file with a profile; was = skipCount of the base file of that path (0 without one), now = of the head file;
            now > was → {guardrail, "guardrail No New Skips", path, expected "at most <was> skipped or focused tests, as at
            base", got "<now> at head"}. rows = [{name "Tests Kept", files: base files with a profile, findings}, {name "No
            New Skips", files: head files with a profile, findings}]; findings Tests Kept's first.
          steps: [{uses: language}, {produces: Guardrail Row}]
          examples:
            - {given: 'a TypeScript text with test("A: one"), it(''B''), test(`C ${1}`), foo.test("no"), mytest("no2"), test.skip("D"), describe.only("E"), "  test( \"F\" , …"; a Python text with def test_a, an indented async def test_b, def helper, def testing_c, @pytest.mark.skip, def test_d, @pytest.mark.skipif(…), @unittest.skip(…), @pytest.mark.xfail', ref: "docs/TASK_P14_reviewer.md §2.1 (the two texts, verbatim)", when: 'testTitles and skipCount; then with profile "go"', then: '["A: one", "B", "C ${1}", "F"]; ["test_a", "test_b", "testing_c", "test_d"]; 2 and 4; 0 and []'}
            - {given: 'base tests/a.test.ts (A, B, B), tests/gone.test.ts (G), README.md, tests/test_x.py (def test_one); head tests/a.test.ts (A, C), tests/test_x.py (@pytest.mark.skip over def test_one), tests/new.test.ts (it.only N, test.skip M)', when: checkGuardrails, then: 'rows [{Tests Kept, 3, 2}, {No New Skips, 3, 2}]; findings: tests/a.test.ts ''the test "B" kept'' "no test of that name at head"; tests/gone.test.ts "the test file is gone at head"; tests/test_x.py "at most 0 skipped or focused tests, as at base" "1 at head"; tests/new.test.ts "… 0 …" "2 at head"'}
            - {given: 'base and head []; then base and head the same three files with one skip each', when: checkGuardrails, then: 'rows [{Tests Kept, 0, 0}, {No New Skips, 0, 0}], no finding; then files 3 and 3, no finding'}
        - name: Plan Mutants
          description: Single-point mutants of one code file, spread over it when they exceed the limit.
          behavior: >
            MUTATION_RULES, in this order (from → to; the operators with their spaces): "===" → "!==", "!==" → "===", " <= "
            → " < ", " >= " → " > ", " < " → " <= ", " > " → " >= ", " + " → " - ", " - " → " + ", "&&" → "||", "||" → "&&",
            "true" → "false" and "false" → "true" (these two as whole words: no [A-Za-z0-9_$] on either side). quotedMask(line)
            → one boolean per char, true inside a "…", '…' or `…` string (the quotes included, a backslash escapes the next
            char). planMutants(path, text, limit) → Mutant[]: lines = text split on "\n"; a line whose start matches
            /^\s*(?:\/\/|\/\*|\*|#|import\b|export\s+(?:type\s+)?\{)/ is skipped; on the others the code ends at the first
            "//" outside a string. Every occurrence of every rule wholly before that end and starting outside a string is a
            mutant, sorted by the occurrence's index, then rule order; mutant {path, line (1-based), column (1-based, of the
            operator's first non-space char), rule "<from trimmed> → <to trimmed>", text: the whole text with that one
            occurrence replaced}. Lines in order. limit ≤ 0 → []; total ≤ limit → all; else the mutants at indices floor(i ×
            total / limit) for i = 0 … limit − 1.
          steps: [{produces: Mutant}]
          examples:
            - {given: 'src/f.ts = an import line, a comment "// a < b in a comment", "export function f(a: number, b: number): boolean {", "  if (a === b && a > 0) return true;", ''  return a + b >= 10 || s === "a < b"; // b - a'', "}" and a final newline; limit 50', ref: "docs/TASK_P14_reviewer.md §2.1 (the text verbatim)", when: planMutants, then: '8 mutants [line, column, rule]: [4, 9, "=== → !=="], [4, 15, "&& → ||"], [4, 20, "> → >="], [4, 32, "true → false"], [5, 12, "+ → -"], [5, 16, ">= → >"], [5, 22, "|| → &&"], [5, 27, "=== → !=="]; the first text has "a !== b" and is otherwise the source'}
            - {given: 'the same with limit 3, 0 and 9', when: planMutants, then: 'the mutants 0, 2, 5: [4, 9], [4, 20], [5, 16]; []; all 8'}
            - {given: 'quotedMask of say("a\"b", ''c'') + 1 (20 chars); src/t.ts "const truey = trueish && untrue;\nconst t = true;\nconst u = !false;\n", limit 10', when: 'quotedMask; planMutants', then: '"00001111110011100000"; [1, 23, "&& → ||"], [2, 11, "true → false"], [3, 12, "false → true"]'}
        - name: Render Findings
          description: The review document — numbered findings with EXPECTED/GOT and a source tag, the counts, the verdict and a markdown page.
          behavior: >
            KIND_ORDER = ["obligation", "envelope", "scope", "guardrail", "mutation"]. orderFindings(findings): stable sort by
            the kind's index (a kind not in KIND_ORDER after them all), then numbered {id "F<n>" from 1, kind, source, path,
            expected, got}. renderFindings({base, head, changed: {path, status, added, deleted, writers, scope}[],
            obligations: {component, function, touchedBy, examples, missing}[], guardrails: {name, files, findings}[], mutants:
            {path, line, rule, killed}[] | null, findings}) → {range "<base>..<head>", verdict "clean" when no finding else
            "findings", counts {files, obligations, examples (sum), missing (sum of lengths), mutants (count or null), killed
            (count or null), findings, byKind: the five kinds at 0 then the counts, an unknown kind added after them},
            findings (ordered), markdown}. markdown = these lines "\n"-joined: "# Review <range>", "", "Clean: no findings." or
            "<n> findings: <kind> <count>, … (byKind order)."; "", "## Changed files (<n>)", "", "| file | status | lines |
            written by | scope |", "|---|---|---|---|---|", a row per file "| <path> | <status> | +<added> -<deleted> (binary
            when either is null) | <writers ", "> or — | <scope or —> |"; "", "## Obligations (<n> Functions, <e> examples,
            <m> missing)", "", and when any: "| Function | touched by | examples | missing |", "|---|---|---|---|", "|
            <component> · <function> | <touchedBy ", "> | <examples> | <missing ", "> or — |", ""; "## Guardrails", "", "|
            guardrail | files | findings |", "|---|---|---|", a row each, ""; with mutants: "## Mutants (<killed> of <n>
            killed)", "", and when any "| at | rule | result |", "|---|---|---|", "| <path>:<line> | <rule> | killed or survived
            |", ""; "## Findings", "", ("None.", "" when none); per finding "### <id> · <kind> · <source>", "", "- path:
            <path or —>", "- EXPECTED: <expected>", "- GOT: <got>", "". Every "|" inside a table cell is written "\|".
          steps: [{reads: Finding}, {produces: Review}]
          examples:
            - {given: 'base "v1", head "HEAD", every list empty, mutants null', when: renderFindings, then: 'range "v1..HEAD", clean, counts {0, 0, 0, 0, null, null, 0, byKind all five 0}, findings [], markdown "# Review v1..HEAD\n\nClean: no findings.\n\n## Changed files (0)\n\n| file | status | lines | written by | scope |\n|---|---|---|---|---|\n\n## Obligations (0 Functions, 0 examples, 0 missing)\n\n## Guardrails\n\n| guardrail | files | findings |\n|---|---|---|\n\n## Findings\n\nNone.\n"'}
            - {given: 'tests/fixtures/reviewer/review.input.json', ref: "tests/fixtures/reviewer/review.input.json (one RenderInput: 2 files, one a|b path, 1 obligation, 2 guardrails, 2 mutants, 5 findings in the order mutation, scope, obligation, guardrail, envelope), tests/fixtures/reviewer/review.md (its markdown)", when: renderFindings, then: 'range "4f2a9c1..morph/20261009-101500", findings, counts {2, 1, 3, 1, 2, 1, 5, byKind 1 each}, ids F1…F5 for obligation, envelope, scope, guardrail, mutation; markdown = review.md exactly'}
            - {given: 'findings [{kind "other", …}, {kind "mutation", …}]; then renderFindings with base "a", head "b", mutants [] and the one "other" finding', when: 'orderFindings; renderFindings', then: 'F1 the mutation, F2 the other; byKind the five at 0 then other 1, mutants 0, killed 0, "1 findings: obligation 0, envelope 0, scope 0, guardrail 0, mutation 0, other 1.", "## Mutants (0 of 0 killed)" followed by "## Findings", "### F1 · other · s" with "- path: —"'}
      dataObjects:
        - name: Obligation
          description: One touched Function and what its tests at head miss.
          schema: "{ component, function, unit, touchedBy: string[], examples: number, judge: string | null, missing: number[] }"
        - name: Envelope Row
          description: One changed file of the range with its writers, last owner and scope.
          schema: "{ path, status: 'added' | 'modified' | 'deleted', added: number | null, deleted: number | null, writers: string[], owner: string | null, scope: 'target' | 'context' | 'outside' | null }"
        - name: Guardrail Row
          description: One guardrail's files checked and findings.
          schema: "{ name, files: number, findings: number }"
        - name: Mutant
          description: One single-point mutant of a code file.
          schema: "{ path, line, column, rule, text }"
        - name: Finding
          description: One finding of the review.
          schema: "{ kind: 'obligation' | 'envelope' | 'scope' | 'guardrail' | 'mutation', source, path: string | null, expected, got }"
        - name: Review
          description: What Render Findings returns.
          schema: "{ range, verdict: 'clean' | 'findings', counts: { files, obligations, examples, missing, mutants: number | null, killed: number | null, findings, byKind }, findings: (Finding & { id })[], markdown }"

    # ---------------------------------------------------------------- P14b
    - name: review-session
      description: >
        The reviewer's second Component (src/reviewer/, layer reviewer; the 30 000-byte rule): the mutant runs of P14a's
        planned mutants through acceptance's runner and snapshot, and `morph review <base> <head>` — git's refs, diff, log
        and file texts, the record and the map, a scout session's scope and the five P14a checks joined into one Review
        document. No model call. reviewCommand.ts is the layer's one node:fs file; runMutants.ts spawns only through Run
        Acceptance and writes only through Restore Snapshot.
      language: typescript
      requirements: [Deterministic Core, One Document Out]
      functions:
        - name: Run Mutants
          description: Each planned mutant written over its file, the test command run under a timeout, the file restored; a green baseline first.
          behavior: >
            runMutants({root, command, mutants: Plan Mutants' Mutant[], timeoutMs, env}) → Promise of {baseline {exit,
            timedOut}, results, findings}. Every run is acceptance's runAcceptance(command, root, {env, timeoutMs}) (its
            env rule: the processor's and secret keys never reach the command). The baseline runs first, on the tree as it
            is; exit not 0 (a timeout is exit null) → results [], findings [baselineFinding(command, baseline, timeoutMs)]
            = {kind "mutation", source BASELINE_SOURCE "mutation baseline", path null, expected "the test command passes
            before any mutant: <command>", got "timed out after <timeoutMs> ms" when timedOut, else "exit <exit>"}, and no
            mutant runs. Else per mutant in order: snapshot = acceptance's snapshotTargets(root, [path]); the mutant's text
            written over the path by restoreSnapshot({root, entries [{path, bytes: its UTF-8 bytes}]}); the run; in
            finally restoreSnapshot(snapshot) (an absent file is absent again). result {path, line, column, rule, killed:
            exit !== 0 (a timeout kills), exit, timedOut}; a survivor gives survivorFinding(result) = {kind "mutation",
            source "mutation <path>:<line>", path, expected "a test fails on <rule> at line <line>", got "every test
            passed"}. DEFAULT_MUTANT_TIMEOUT_MS = 120000 (the operator's 120 s rule).
          steps: [{uses: acceptance}, {reads: Mutant}, {produces: Mutant Run}]
          examples:
            - {given: 'a tmpRoot holding src/f.ts = F = "export function f(a: number, b: number): boolean {\n  return a === b && a > 0;\n}\n"; mutants = planMutants("src/f.ts", F, 10); command grep -q "a === b" src/f.ts, timeoutMs 5000, env {PATH}', when: runMutants, then: 'baseline {0, false}; results [src/f.ts 2 12 "=== → !==" killed exit 1], [2 18 "&& → ||" survived exit 0], [2 23 "> → >=" survived exit 0], timedOut false each; findings the two survivors, "mutation src/f.ts:2" expecting "a test fails on && → || at line 2" and "… > → >= …", got "every test passed"; src/f.ts is F again'}
            - {given: 'the same root and mutants; command echo run >> ran.txt; exit 3', when: runMutants, then: 'baseline {3, false}; results []; findings [{mutation, "mutation baseline", null, "the test command passes before any mutant: echo run >> ran.txt; exit 3", "exit 3"}]; ran.txt "run\n" (only the baseline ran); src/f.ts is F'}
            - {given: 'lib/g.ts = F, mutants planMutants("lib/g.ts", F, 10); command if grep -q "a !== b" lib/g.ts; then sleep 5; fi with timeoutMs 400; then command sleep 5 with timeoutMs 300', when: runMutants, then: 'results [=== → !== killed, exit null, timedOut true], [&& → || survived], [> → >= survived], two findings "mutation lib/g.ts:2"; lib/g.ts is F; then baseline {null, true}, results [], the finding got "timed out after 300 ms"'}
            - {given: 'command test "$MARK" = m1 && test -z "$OPENAI_API_KEY", env {PATH, MARK m1, OPENAI_API_KEY k}, mutants []; then MARK m2; then command true with one mutant {gen/new.ts, 1, 1, "true → false", "x\n"} on a root without gen/new.ts', when: runMutants, then: 'baseline {0, false}, results [], findings []; then baseline {1, false} and the finding got "exit 1"; then one survivor and gen/new.ts absent after the run'}
        - name: Review Command
          description: "`morph review <base> <head>`: the range's diff, Morph commits, test titles and texts, the record, a scout scope and the mutants, checked into one Review document."
          behavior: >
            reviewCommand(root, args {base, head, spec, map, scout, mutants, mutantTimeoutSeconds, test, write}, deps {env})
            → Promise of {code, document}. git through git's gitOk/runGit with deps.env. 1. gitOk rev-parse --git-dir (a
            throw propagates: exit 3 by main). 2. Each refusal is {code 4, document {error {code 4, kind "UsageError",
            message}}}, in order, before any diff: a ref whose runGit rev-parse --verify -q <ref>^{commit} is not exit 0 →
            "not a commit: <ref>" (base, then head); merge-base --is-ancestor <head sha> HEAD not exit 0 → "head <head> is
            not in the history of HEAD"; spec given: path.resolve(root, spec) not a regular file → "spec file not found:
            <spec>", contour's loadContour error → that error; map likewise ("map file not found: <map>", loadMap's
            error; no map → EMPTY_MAP {version 1, package null, language null, docs [], groups [], cards [], extraCards
            []}); scout given: the session under SCOUT_SESSIONS as Plan From Scout picks it ("latest" = the last name in
            code-unit order holding a regular scout.json) — "no scout session under .morph/scout", "scout session not
            found: <id>", "<at> does not parse", "<at>: schema <JSON or null>, expected 1", "scout session <id> has no
            answer (<status>): <stopReason>" — scope {scoutId id, targets answer.targets, contextSlice
            answer.context_slice}; mutants given: rev-parse HEAD not the head sha → "--mutants needs the head to be the
            checkout HEAD (<HEAD sha's first 8>)"; git status --porcelain --untracked-files=all paths (" -> " takes the new
            name) outside MORPH_DIR → "--mutants needs a clean tree: dirty outside .morph/: <sorted, ", "-joined>". 3. range
            = the shas of rev-list <base sha>..<head sha>; log = git's readMorphLog(root, env); commits = its entries in
            range, {card, model, run, paths}, log order; ownership = readOwnership(log); changed = readDiff(diff
            --name-status -z --no-renames <b> <h>, diff --numstat -z --no-renames <b> <h>); Check Envelope({changed,
            commits, ownership, scout}). A test file is a path with profileForPath(p) and language's isTest(profile, p);
            headTests = the test files of ls-tree -r -z --name-only <h>, titles = Check Guardrails' testTitles(git show
            <h>:<p>, profile id) of each, in order. Check Guardrails({base: changed test files not added, text at <b>;
            head: those not deleted, at <h>}). With a record: Find Obligations({record, map, changed paths, cards of
            commits, titles}), else none. With mutants n: code = changed files not deleted, not under MORPH_DIR, with a
            profile, not a test; planned = spreadMutants(each file's Plan Mutants(path, its working-tree text, n) joined,
            n) (all when ≤ n, else index floor(i × total / n)); test = args.test, else the first code file's profile
            fullRunLine; planned not empty and test not null → Run Mutants({root, command test, mutants planned, timeoutMs
            mutantTimeoutSeconds × 1000, env}), rows {path, line, rule, killed}; else rows []. 4. Render Findings({base:
            args.base, head: args.head, changed: the envelope rows, obligations, guardrails rows, mutants: null without
            mutants, findings: obligation, envelope and scope, guardrail, mutation}). document = {range, verdict, base: the
            base sha, head: the head sha, counts, findings, envelope: applies, scout: scoutId or null, commits: range size,
            morphCommits, testFiles: headTests' count, test (null without mutants), baseline (Run Mutants' or null),
            written, markdown}. write → written = REVIEW_DIR ".morph/review" + "/" + reviewId(b, h) (the two shas' first 8,
            "-"-joined), review.json = JSON.stringify(document, null, 2) + "\n" and review.md = markdown in it; else null.
            → {code 0 when verdict clean, else 1, document}.
          steps: [{calls: Run Mutants}, {uses: reviewer}, {uses: git}, {uses: contour}, {uses: language}, {uses: scout-session}, {produces: Review Document}]
          examples:
            - {given: 'the §2.1 tmpRepo of docs/TASK_P14b_reviewer.md (contour.yaml and morph-map.json = the reviewer fixtures, README.md, tests/shop/old.test.ts at tag b0; commits Morph-Card add-tax (src/shop/addTax.ts) and add-tax-judge.r1 (tests/shop/addTax.examples.test.ts naming examples 1 and 3), the archive commit Morph-Run r7 (.morph/runs/r7/report.json) at tag h1; a hand commit of README.md and tests/shop/old.test.ts at HEAD); args b0, h1, spec contour.yaml, map morph-map.json', ref: "tests/fixtures/reviewer/record.yaml, tests/fixtures/reviewer/map.json", when: reviewCommand, then: 'code 1; range "b0..h1", the two shas, counts {3, 1, 3, 1, null, null, 1, obligation 1}, F1 obligation "record: shop · Add Tax · example 2"; envelope true, scout null, commits 3, morphCommits 2, testFiles 2, test null, baseline null, written null; the rows in diff order with writers [] (.morph/runs/r7/report.json), ["add-tax"], ["add-tax-judge.r1"]'}
            - {given: 'b0, HEAD, the spec and map, scout latest = .morph/scout/20261009-101500-0badc0de/scout.json (targets [src/shop/addTax.ts], context_slice [README.md]), mutants 5, mutantTimeoutSeconds 30, test grep -q "price > 0" src/shop/addTax.ts, write', ref: "tests/fixtures/reviewer/review.tiny.md (its markdown)", when: reviewCommand, then: 'code 1; 9 findings F1…F9: obligation; envelope README.md, tests/shop/old.test.ts "…; no Morph card ever wrote it"; scope README.md (context), tests/shop/addTax.examples.test.ts and tests/shop/old.test.ts (not named); Tests Kept "gone"; No New Skips "1 at head"; mutation "mutation src/shop/addTax.ts:2" on "+ → -"; mutants 2, killed 1; baseline {0, false}; written ".morph/review/<b8>-<h8>" holding review.json (the document) and review.md = review.tiny.md exactly'}
            - {given: 'base nope; head v9; spec none.yaml; map none.json; scout zz; mutants 3 with head h1; mutants 3 with an untracked notes.txt; head side (a branch off b0, not merged); then a root outside git', when: reviewCommand, then: '4 "not a commit: nope"; "not a commit: v9"; "spec file not found: none.yaml"; "map file not found: none.json"; "scout session not found: zz"; "--mutants needs the head to be the checkout HEAD (<HEAD8>)"; "--mutants needs a clean tree: dirty outside .morph/: notes.txt"; "head side is not in the history of HEAD"; then a rejection "git rev-parse failed (exit 128): …"'}
            - {given: 'b0, h1 without spec; then b0, HEAD with mutants 2 and no test; then h1, HEAD with mutants 3 and test exit 9', when: reviewCommand, then: 'code 0, clean, markdown beginning "# Review b0..h1\n\nClean: no findings.\n"; then code 1, test "node_modules/.bin/vitest run --reporter=dot", baseline {127, false}, the finding "mutation baseline" got "exit 127", "## Mutants (0 of 0 killed)"; then envelope false, no code file changed: baseline null, mutants 0, test "exit 9", 2 guardrail findings'}
            - {given: 'reviewId("4f2a9c1e0b", "8a663b37ff"); spreadMutants of 8 mutants with limits 3, 0 and 9; REVIEW_DIR; EMPTY_MAP', when: called, then: '"4f2a9c1e-8a663b37"; the mutants 0, 2, 5; []; all 8; ".morph/review"; the empty map'}
      dataObjects:
        - name: Mutant Run
          description: What Run Mutants resolves to.
          schema: "{ baseline: { exit: number | null, timedOut: boolean }, results: { path, line, column, rule, killed: boolean, exit: number | null, timedOut: boolean }[], findings: Finding[] }"
        - name: Review Document
          description: stdout of morph review, and review.json with --write.
          schema: "{ range, verdict: 'clean' | 'findings', base, head, counts, findings: (Finding & { id })[], envelope: boolean, scout: string | null, commits, morphCommits, testFiles, test: string | null, baseline: { exit, timedOut } | null, written: string | null, markdown }"

    # ---------------------------------------------------------------- P17 (issue #8)
    - name: debt
      description: >
        Paying a debt on a V2 deck without the operator (issue #8): `morph card` gives one card of a deck file as its
        executor saw it plus the last run's verdict on it (the debt brief), `morph accept` runs that card's acceptance on
        the current tree exactly as the runner runs it and, with --commit, commits only the card's targets with the Morph
        trailers and Morph-Debt: true. src/debt/*.ts, layer debt (cards, acceptance, git). No model call, no clock; the
        environment is a parameter; it spawns only through acceptance's Run Acceptance and git's Run Git.
      language: typescript
      requirements: [Deterministic Core, One Document Out]
      functions:
        - name: Card Brief
          description: "`morph card --deck <deck> --id <card> [--md]`: the card, its targets and slice as they read now, the last run's outcome of it; with --md the same as markdown."
          behavior: >
            cardBrief(root, args {deck, id, md}) → {code, document}. findCard(root, deck, id) (exported; Accept Card's
            first step too), in order: path.resolve(root, deck) not a regular file → {code 4, document {error {code 4, kind
            "UsageError", message "deck file not found: <deck as given>"}}}; cards' Load Deck on its UTF-8 text with faults
            → 2 DeckError "invalid deck: " + each "<key>: <message>", "; "-joined; no card with customId id → 4 UsageError
            "no card '<id>' in <deck> (have: <the deck's ids in deck order, ", "-joined>)"; else {ok: true, card}, a failure
            {ok: false, result}. The document, keys in this order: deck (as given), card (customId), intent, targets (in
            targets order) and slice (the contextSlice sorted by code unit, as the compiler sends it), each entry {path,
            text: the file's UTF-8 text under root, null when it is not a regular file}; instruction, acceptance, maxTokens,
            model, dependsOn (the card's, as loaded); lastRun = readLastRun(root, id) (exported); markdown =
            renderBrief(document) (exported, pure) only when md, else no such key. code 0. readLastRun: the names under
            RUNS_DIR ".morph/runs" (none, or no directory → null) in descending code-unit order (a minted run id is UTC
            "YYYYMMDD-HHMMSS", so the newest first; completedAt is not read); the first whose report.json is a regular file
            that JSON.parse reads into an object with an outcomes array holding an outcome with customId id (anything else
            is skipped silently) gives {runId: the name, processor: the report's string or null, status, reason (string or
            null), attempts (number or 0), earlierFailures: the length of its earlierFailures array (0 when absent),
            acceptanceLog (string or ""), answers: the files of <run>/answers/ whose name matches ^<id, regex-escaped>(\.r[0-9]+)?\.v[0-9]+\.answer\.txt$,
            code-unit sorted, each as ".morph/runs/<run>/answers/<name>"}; none → null. renderBrief(doc) = blocks joined by
            "\n\n" plus a final "\n": "# Debt brief: <card>"; "Write only: <each target path in backticks, ", "-joined>.
            Change no other file.\nThen: `morph accept --deck <deck> --id <card> --model <your model> --commit`."; the six
            lines "- deck: <deck>", "- intent: <intent>", "- maxTokens: <n or none>", "- model: <model or none>", "-
            dependsOn: <ids ", "-joined, or none>", "- last run: <runId>, processor <processor or none>, <status>, attempts
            <n>, reason <reason or none>" (or "- last run: none"), "\n"-joined; "## Instruction\n\n" + the instruction with
            its trailing white space trimmed; "## Acceptance\n\n" + ("none" for null, else "<acceptance>\n" + text +
            "</acceptance>"); only with a last run "## Last run\n\n<acceptance_log>\n" + log + "</acceptance_log>\n\nAnswers:
            " + the answers in backticks ", "-joined (or "none"); "## Targets now\n\n" + per target '<file path="<path>">\n'
            + text + "</file>" or "Target <path> does not exist yet.", "\n\n"-joined; "## Context slice\n\n" + per slice entry
            the same file block or "File <path> is missing.", "\n\n"-joined, or "none" for an empty slice. Every text put
            between tags gets a "\n" appended when it is not empty and does not end in one.
          steps: [{reads: Deck File}, {reads: Run Report}, {produces: Card Brief Document}]
          examples:
            - {given: 'a tmpRoot (no git) holding d.json = debt/deck.json (cards base, fmt.x, solo), src/x.ts "export const x = 1;\n", docs/a.md "# A\n", docs/b.md "B" (no final newline), no src/y.ts, no docs/gone.md; the archive debt/archive.json written under .morph/runs/ (reports 20261101-090000 ds, 20261102-100000 glm53, 20261103-110000 ds, junk = "{\n"; answer files "A\n")', ref: "tests/fixtures/debt/deck.json, tests/fixtures/debt/archive.json", when: 'cardBrief(root, {deck: "d.json", id: "fmt.x", md: false})', then: 'code 0; document {deck "d.json", card "fmt.x", intent "patch", targets [{src/x.ts, "export const x = 1;\n"}, {src/y.ts, null}], slice [{docs/a.md, "# A\n"}, {docs/b.md, "B"}, {docs/gone.md, null}], instruction "Fix x and write y.\n", acceptance "grep -q fixed src/x.ts", maxTokens 9000, model null, dependsOn ["base"], lastRun {runId "20261102-100000", processor "glm53", status "failed", reason "acceptance failed", attempts 2, earlierFailures 1, acceptanceLog "== probe\nAssertionError: expected 2 to be 1\n", answers [".morph/runs/20261102-100000/answers/fmt.x.r1.v1.answer.txt", ".morph/runs/20261102-100000/answers/fmt.x.v1.answer.txt"]}} and no markdown key — junk does not parse, 20261103-110000 holds no fmt.x, 20261101-090000 is older though its completedAt is larger; fmt.x-judge and fmtzx answers are not the card''s'}
            - {given: 'the same root; ids fmt.x and solo with md true; then base with md false', ref: "tests/fixtures/debt/brief.fmt.x.md, tests/fixtures/debt/brief.solo.md", when: cardBrief, then: 'markdown exactly brief.fmt.x.md (880 bytes) and brief.solo.md (lastRun null: "- last run: none", "## Acceptance\n\nnone", no "## Last run", "Target lib/solo.ts does not exist yet.", "## Context slice\n\nnone"), each document''s other keys as without md; base: lastRun {runId "20261103-110000", processor "ds", status "written", reason null, attempts 1, earlierFailures 0, acceptanceLog "== tsc\n== probe\n", answers []}, targets [{src/base.ts, null}], slice []'}
            - {given: 'the same root; deck "nope.json"; c.json = the cycle fixture; id "zz"; then a tmpRoot holding only d.json, src/x.ts and the docs (no .morph)', ref: "tests/fixtures/decks/cycle.json", when: cardBrief, then: '{code: 4, document: {error: {code: 4, kind: "UsageError", message: "deck file not found: nope.json"}}}; code 2 DeckError "invalid deck: dependsOn: dependsOn cycle a -> b -> a"; code 4 UsageError "no card ''zz'' in d.json (have: base, fmt.x, solo)"; then fmt.x with lastRun null'}
        - name: Accept Card
          description: "`morph accept --deck <deck> --id <card> --model <name> [--commit]`: the card's acceptance on the tree as it is; with --commit and green, one commit of only its targets with the debt trailers."
          behavior: >
            acceptCard(root, args {deck, id, model, commit}, deps {env, timeoutMs?}) → Promise of {code, document}. 1.
            Card Brief's findCard (its failure is the result). 2. acceptance null or blank after trim → {code 2, document
            {error {code 2, kind "RefusalError", message "card <id> has no acceptance"}}}. 3. With commit only: outside =
            changedOutside(root, targets, env) (exported): git's gitOk status --porcelain --untracked-files=all (outside a
            repository it throws: the promise rejects, exit 3 by main); per line the path after the two status letters
            and a space (a rename: the path after " -> "); a path under ".morph/" or equal to a target is dropped; the
            rest distinct, code-unit sorted. Taken BEFORE the acceptance: the tree the payer left. Without commit outside
            is null and no git runs. 4. result = acceptance's runAcceptance(acceptance, root, {env: deps.env, timeoutMs:
            deps.timeoutMs or DEFAULT_TIMEOUT_MS 300000}) — the runner's call: /bin/sh -c from root, its own process
            group killed on the timeout, the secret keys stripped, the log clipped. Nothing is written or rolled back: a
            red tree stays as the payer left it. green = exit 0. 5. reasons, in order: not green → "acceptance failed
            (exit <exit, or null>)"; outside not empty → "changed outside the targets: <outside ", "-joined>". With commit
            and no reason: git's commitPaths(root, targets, "morph <id>: <targets ", "-joined>", trailers [Morph-Card <id>,
            Morph-Model <model>, Morph-Acceptance-Exit 0, Morph-Debt true], env, force true) (Commit Card's subject and
            force; no Morph-Variant); null (the targets equal HEAD) → reason "nothing to commit: the targets equal HEAD".
            document {deck, card, model, exit, timedOut, green, log, outside, commit: the sha or null, diffstat or null,
            reason: the reasons "; "-joined, or null}, keys in that order; code 0 when green and (not commit, or a commit
            made), else 1.
          steps: [{calls: Card Brief}, {uses: acceptance}, {uses: git}, {produces: Accept Document}]
          examples:
            - {given: 'a tmpRepo t, one commit "base" of d.json = debt/accept.deck.json (fix-a, fix-two, slow, none, blank), src/a.ts "broken\n", README.md "r\n"; then src/a.ts written "fixed\n" and .morph/runs/x/report.json "{}\n" (untracked); env {PATH}', ref: "tests/fixtures/debt/accept.deck.json", when: 'acceptCard(t, {deck: "d.json", id: "fix-a", model: "claude-fable-5-1", commit: true}, {env}), then the same call again', then: 'code 0, document {deck "d.json", card "fix-a", model "claude-fable-5-1", exit 0, timedOut false, green true, log "", outside [], commit HEAD (40 hex), diffstat {files 1, insertions 1, deletions 1}, reason null}; the HEAD message "morph fix-a: src/a.ts\n\nMorph-Card: fix-a\nMorph-Model: claude-fable-5-1\nMorph-Acceptance-Exit: 0\nMorph-Debt: true", `git show --name-only --format= HEAD` "src/a.ts"; then code 1, green true, commit null, diffstat null, reason "nothing to commit: the targets equal HEAD", HEAD unchanged'}
            - {given: 'the same base; src/a.ts written "still broken\n"', when: 'acceptCard with commit true', then: 'code 1, exit 1, timedOut false, green false, log "FAIL: src/a.ts not fixed\n", outside [], commit null, reason "acceptance failed (exit 1)"; HEAD is "base"; src/a.ts still reads "still broken\n" (nothing rolled back)'}
            - {given: 'the same base; src/a.ts "fixed again\n", README.md "r2\n", notes/n.txt "n\n" (untracked); then src/a.ts "broken!\n"', when: 'acceptCard with commit true, twice', then: 'code 1, green true, outside ["README.md", "notes/n.txt"], commit null, reason "changed outside the targets: README.md, notes/n.txt"; then code 1, exit 1, reason "acceptance failed (exit 1); changed outside the targets: README.md, notes/n.txt"; HEAD is "base" after both'}
            - {given: 'a tmpRoot r (no git) holding d.json, src/b.ts "b\n", out/g.ts "g\n"; id fix-two, commit false, env {PATH, MARK "k7", GH_TOKEN "t"}; then MARK "k8"; then id slow with deps.timeoutMs 300', when: acceptCard, then: 'code 0, exit 0, green true, log "", outside null, commit null, diffstat null, reason null (GH_TOKEN never reaches the shell); then code 1, exit 1, reason "acceptance failed (exit 1)"; then code 1, exit null, timedOut true, log "started\nacceptance timed out after 300 ms\n", reason "acceptance failed (exit null)"'}
            - {given: 'a tmpRepo g, one commit "base" of d.json and .gitignore "out/\n"; src/b.ts "b\n" and out/g.ts "g\n" written; id fix-two, model "acme/m:free", commit true, env {PATH, MARK "k7"}; then ids none, blank, zz and deck "x.json" on g; then fix-a with commit true on the tmpRoot r of example 4', when: acceptCard, then: 'code 0, outside [], diffstat {files 2, insertions 2, deletions 0}, HEAD message "morph fix-two: src/b.ts, out/g.ts\n\nMorph-Card: fix-two\nMorph-Model: acme/m:free\nMorph-Acceptance-Exit: 0\nMorph-Debt: true", `git show --name-only --format= HEAD` "out/g.ts\nsrc/b.ts" (the ignored target committed); then 2 RefusalError "card none has no acceptance", "card blank has no acceptance", 4 UsageError "no card ''zz'' in d.json (have: fix-a, fix-two, slow, none, blank)", "deck file not found: x.json"; then the promise rejects with an Error beginning "git status failed (exit 128): "'}
      dataObjects:
        - name: Card Brief Document
          description: stdout of morph card.
          schema: "{ deck: string, card: string, intent: Intent, targets: { path, text: string | null }[], slice: { path, text: string | null }[], instruction: string, acceptance: string | null, maxTokens: number | null, model: string | null, dependsOn: string[], lastRun: { runId, processor: string | null, status, reason: string | null, attempts, earlierFailures, acceptanceLog, answers: string[] } | null, markdown?: string }"
        - name: Accept Document
          description: stdout of morph accept.
          schema: "{ deck, card, model, exit: number | null, timedOut: boolean, green: boolean, log: string, outside: string[] | null, commit: string | null, diffstat: { files, insertions, deletions } | null, reason: string | null }"

    - name: scaffold
      description: >
        A new project from the template (issue #9): `morph init` copies the template folders of Morph's own templates/
        (common/ and the language's folder) into an empty directory and fills three placeholders. src/scaffold/*.ts, layer
        scaffold: no other layer; of the Node modules node:fs, node:path and node:url only; no clock, no environment, no
        spawn, no network. The template is data in templates/ beside dist/ (the package root); the code knows no file of it.
      language: typescript
      requirements: [Deterministic Core, One Document Out]
      functions:
        - name: Init Project
          description: "`morph init --root <dir> --name <name> --language typescript|python|go [--module <path>] [--templates <dir>]`: the template written into an empty directory, the files listed."
          behavior: >
            initProject(root, args {project, language, module, templates}, cwd) → {code, document}; root is absolute. In
            order: 1. templates = defaultTemplatesDir() when args.templates is null, else path.resolve(cwd, args.templates);
            defaultTemplatesDir() (exported) = path.resolve(<the directory of this module's file, from import.meta.url>, "..",
            "..", "templates"): src/scaffold/ and dist/scaffold/ both sit two levels under the package root. 2. root exists
            and is not a directory → {code 2, document {error {code 2, kind "RefusalError", message "target is not a
            directory"}}}; root is a directory holding any entry (a dot entry too) → 2 RefusalError "target directory is not
            empty (first entry: <the first entry name in code-unit order>)". 3. For folder "common" (COMMON_DIR, exported),
            then folder <language>: <templates>/<folder> not a directory → 2 RefusalError "template folder not found:
            <folder>". Nothing is written by a refusal. 4. The files: listTemplateFiles(<templates>/common), then
            listTemplateFiles(<templates>/<language>), keyed by relative path; a language file replaces the common file of
            the same path; files = the distinct paths in code-unit order. listTemplateFiles(dir) (exported) = every regular
            file under dir, recursively, as a "/"-joined path relative to dir, in code-unit order; a symbolic link or other
            kind is skipped; dir not a directory → []. 5. values {name: project, module: module or project when null,
            language}; root created with its parents; per file: its parent directories created, the text fillTemplate(the
            source's UTF-8 text, values) written, the mode set to the source's mode & 0o777. fillTemplate(text, values)
            (exported, pure) replaces every "{{name}}", "{{module}}" and "{{language}}" in one left-to-right pass (a value
            holding a placeholder is not replaced again); any other brace text ("{{ name }}", "{{other}}", "${{ x }}",
            "{{join .Imports}}") stays. 6. {code 0, document {name: project, language, module: the value used, files}}, keys
            in that order. A failure of the file system under way throws (main: exit 3).
          steps: [{reads: Template Folder}, {produces: Init Document}]
          examples:
            - {given: 'a tmpRoot t; root t/acme (absent); templates = the fixture tree tests/fixtures/scaffold/tpl (common: .gitignore, README.md, docs/notes.md, tools/hello.sh executable; go: README.md, go.mod, internal/keep.txt; python: pyproject.toml; no typescript)', ref: "tests/fixtures/scaffold/tpl/", when: 'initProject(t/acme, {project: "acme", language: "go", module: "example.com/acme", templates: <the fixture tree, absolute>}, "/")', then: 'code 0, document {name "acme", language "go", module "example.com/acme", files [".gitignore", "README.md", "docs/notes.md", "go.mod", "internal/keep.txt", "tools/hello.sh"]}; README.md "# acme (Go)\n" (go replaces common); go.mod "module example.com/acme\n\ngo 1.22\n"; internal/keep.txt "example.com/acme/internal go\n"; every file''s mode & 0o777 equals its source''s, tools/hello.sh executable'}
            - {given: 'root = t itself (an empty directory); cwd = the directory tests/fixtures/scaffold; templates "tpl" (relative)', ref: "tests/fixtures/scaffold/tpl/", when: 'initProject(t, {project: "beta_svc", language: "python", module: null, templates: "tpl"}, cwd)', then: 'code 0, document {name "beta_svc", language "python", module "beta_svc", files [".gitignore", "README.md", "docs/notes.md", "pyproject.toml", "tools/hello.sh"]}; README.md "# beta_svc\n\nA python project, module beta_svc.\n"; pyproject.toml "[project]\nname = \"beta_svc\"\n"; docs/notes.md "Keep {{ name }}, {{other}}, ${{ env.HOME }} and {{join .Imports}} as they are; beta_svcbeta_svc.\n"'}
            - {given: 'fillTemplate on "{{name}}:{{module}}:{{language}}" with {name: "{{module}}", module: "x/y", language: "go"}; then on "{name} {{Name}} {{name}" with {name: "n", module: "m", language: "l"}', when: fillTemplate, then: '"{{module}}:x/y:go" (one pass); then "{name} {{Name}} {{name}" unchanged'}
            - {given: 'a root holding b.txt and .a; a root that is a file f.txt; an absent root with language typescript on the fixture tree; an absent root with templates "nope" (cwd t)', when: initProject, then: 'code 2 RefusalError "target directory is not empty (first entry: .a)", the root still holds only .a and b.txt; "target is not a directory"; "template folder not found: typescript"; "template folder not found: common"; the absent roots still absent'}
            - {given: 'templates null; root t/gx (absent)', ref: "templates/", when: 'defaultTemplatesDir(); initProject(t/gx, {project: "gx", language: "go", module: "example.com/gx", templates: null}, "/"); listTemplateFiles on the fixture tree''s common and on t/none', then: 'path.resolve(<the repository root>, "templates"); code 0 with files = the distinct paths of listTemplateFiles(templates/common) and (templates/go) in code-unit order, among them "CLAUDE.md", "docs/AUTONOMY.md", "go.mod", "internal/testhelp/testhelp.go", "decks/tools/guard.mjs", "tools/tg.sh"; go.mod begins "module example.com/gx\n"; no written file holds "{{name}}", "{{module}}" or "{{language}}"; tools/tg.sh executable; [".gitignore", "README.md", "docs/notes.md", "tools/hello.sh"]; []'}
      dataObjects:
        - name: Template Folder
          description: Morph's templates/<common|typescript|python|go>/, data; text files with the placeholders {{name}}, {{module}}, {{language}}.
          schema: "a directory tree of UTF-8 text files"
        - name: Init Document
          description: stdout of morph init.
          schema: "{ name: string, language: 'typescript' | 'python' | 'go', module: string, files: string[] }"

  dependencies:
    - {name: yaml, version: "2.9.1", language: typescript, doc: docs/deps/yaml.md}
Actor:
  - name: Operator
    description: A human or an agent session driving Morph from a shell.
    uses: [morph CLI]

Requirement:
  - name: Strict TypeScript
    description: tsconfig strict, ESM, no `any`; every module compiles with tsc --noEmit.
  - name: One Document Out
    description: Every command prints exactly one JSON document on stdout and nothing else; the human log goes to stderr.
  - name: Deterministic Core
    description: >
      cards and compiler give byte-identical results for the same inputs: no clock, no
      randomness, no environment reads. acceptance is bound only in its pure parts (Snapshot
      Targets, Build Attempt Diff): Run Acceptance spawns a shell and its only timer is the
      child's timeout; env and the timeout are parameters, never process.env (06.10, P3).
      processor reads the environment only in Read Registry; Assemble Request, Read Response,
      Stub Answer, Assemble Batch and Read Batch are pure of clock and network; the transport
      and its sleep are parameters of Send Generation and Send Batch (P4, P11).
      git spawns only in Run Git, synchronously, with the child's environment given whole as
      a parameter; it reads no process.env and no clock of its own (P6).
      cli touches the process only in its entry src/cli.ts: the environment, the working
      directory, the clock and the output streams reach main() as parameters, and the
      environment reaches the processor only through Read Registry (P7).
      language is pure data and pure functions: no clock, no environment, no file system,
      no child process; node:path is its only Node module; its shell lines are text (P8).
      contour reads no file, no clock and no environment: it parses the text it is given;
      the package yaml is imported in Parse Document alone (P9).
      planner reads no file, no clock and no environment: the cli reads the record and the
      map and passes which files exist as a function; node:path is its only Node module (P10a).
      builder reads no file, no clock and no environment: the caller passes the checks, the cards,
      the profile and the texts of the guard, the locator and the probes; node:path is its only Node
      module (P10b).
      primer reads files and spawns git (git's gitOk, the environment a parameter) only in Primer
      Command, the clock only there through deps.now; Read Runs, Read Story and Render Primer are pure
      functions of what they are given, no network anywhere (P12a).
      scout reads no clock, no environment and no network and spawns nothing: Parse Turn, Spend Budget and
      Seed From Ownership are pure; Cage Path and Run Tool reach the file system only through the ScoutFs
      parameter (realpath, readFile); elapsed time is a parameter; node:path is its only Node module (P13a).
      scout-session reaches the model only through the processor's Send Generation and the clock only through deps.now;
      Run Scout reads the tree through the ScoutFs parameter; Scout Command and Plan From Scout are the scout layer's two
      node:fs files (git through gitOk and runGit, node:crypto for the sha256 in Scout Command), the environment a
      parameter (P13b).
      reviewer's checks (Find Obligations, Check Envelope, Check Guardrails, Plan Mutants, Render Findings) are pure
      functions of the record, git's outputs and the texts they are given: no file, no clock, no environment, no child
      process, no Node module (P14a).
      review-session spawns only through acceptance's Run Acceptance (the mutant runs, each under its timeout) and git's
      Run Git; Run Mutants writes only through acceptance's Restore Snapshot; Review Command is the reviewer layer's one
      node:fs file (the record, the map and scout.json read, the review written), the environment a parameter, no clock
      and no model call (P14b).
      debt spawns only through acceptance's Run Acceptance and git's Run Git, reads the deck file, the card's files and
      the run archive through node:fs, no clock and no model call; the environment is a parameter (P17).
      scaffold reads the template folders and writes the new project through node:fs (node:url only to find the package
      root from its own module file), spawns nothing, reads no clock and no environment (P18).
  - name: Node Only
    description: >
      Runtime dependencies: Node 20 built-ins and the package `yaml` (the record reader), nothing
      else; dev dependencies pinned exactly, no ^ or ~.

Guardrail:
  - name: No Network In Tests
    description: tests/setup.ts makes fetch, XMLHttpRequest, WebSocket and net.connect throw "network blocked in tests"; only the processor's own transport is mocked.
  - name: No Shell Outside Acceptance
    description: child processes are spawned only by Run Acceptance, the git module (in Run Git alone, P6) and the processor's none; everything else is pure.
  - name: Frozen Tree During Run
    description: while a run is in flight no file outside the cards' targets and .morph/ changes; a changed declared input discards the answer unread.
