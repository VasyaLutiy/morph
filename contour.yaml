          behavior: >
            planFromScout(root, args {fromScout, out}) → {code, document}. The session: "latest" = the last name in
            code-unit order of the entries of <root>/.morph/scout (SCOUT_SESSIONS) holding a regular scout.json, none or no
            directory → 4 UsageError "no scout session under .morph/scout"; a named id without one → 4 UsageError "scout
            session not found: <id>". <at> = ".morph/scout/<id>/scout.json". JSON.parse throws → 2 DeckError "<at> does not
            parse"; schema not 1 → 2 DeckError "<at>: schema <JSON of it, null when absent>, expected 1"; status not "ok" or
            answer null → 2 RefusalError "scout session <id> has no answer (<status>): <stopReason>"; no targets or a blank
            question → 2 DeckError "<at>: the answer has no targets or the session no question". The answer's paths are
            checked now through Cage Path (file) on the tree {root, files: targets then context_slice} with a node fs (a
            path as given: no "./", no directory): a target refused → 2 RefusalError "target refused: <its error>", a target
