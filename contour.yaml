version: 1
System:
  name: MorphV2
  description: >
    Headless orchestrator of batch code generation. An operator or an agent writes a
    Contour record and a map; `morph plan` cuts them into a deck of cards; `morph run`
    compiles each card into one request per variant, sends the generation to a
    processor, judges every answer with the card's acceptance command, commits what
    passes with trailers, regenerates what fails with the diagnosis, and archives the
    run. `morph primer` digests the project and its archive for a fresh session,
    `morph scout` localises a change with a cheap model, `morph review` checks a diff
    against the record, the primer and a scout report. One JSON document on stdout,
    the human log on stderr, exit codes 0/1/2/3/4. No REPL.
  requirements: [Strict TypeScript, One Document Out, Deterministic Core, Node Only]
  guardrails: [No Network In Tests, No Shell Outside Acceptance, Frozen Tree During Run]
  groups:

    # ---------------------------------------------------------------- P1
    - name: cards
      description: >
        The card and deck model: src/cards/*.ts. Validates a card, loads a deck,
        layers it into generations by depends_on, finds ownership hazards and weighs
        slices. Pure: no filesystem beyond reading the files a slice names, no git.
      language: typescript
      requirements: [Deterministic Core]
      functions:
        - name: Validate Card
          description: Turns an untrusted object into a Card or a list of faults.
          behavior: >
            Required: customId matching ^[A-Za-z0-9._-]+$, intent generate|patch,
            targets a non-empty list of distinct repo-relative paths, instruction a
            non-empty string. Optional with defaults: contextSlice [] (empty means
            "no context, instruction only" — never the whole project), acceptance
            null, model null, maxTokens null, reasoning null, variants 1, dependsOn [].
            Unknown keys are faults, never ignored. Every fault names the key and the
            rule in one line; all faults are reported at once.
          steps:
            - produces: Card
          examples:
            - given: '{"customId":"a","intent":"generate","targets":["src/a.ts"],"instruction":"x"}'
              when: "validated"
              then: "a Card with contextSlice [], variants 1, dependsOn [], acceptance null"
            - given: '{"customId":"bad id","intent":"generate","targets":["src/a.ts"],"instruction":"x"}'
              when: "validated"
              then: "one fault: customId 'bad id' does not match ^[A-Za-z0-9._-]+$"
            - given: '{"customId":"a","intent":"todo","targets":[],"instruction":""}'
              when: "validated"
              then: "exactly three faults, in key order: intent, targets, instruction"
            - given: '{"customId":"a","intent":"generate","targets":["src/a.ts","./src/a.ts"],"instruction":"x"}'
              when: "validated"
              then: "one fault: targets repeat src/a.ts after normalisation"
        - name: Load Deck
          description: Reads a deck file (a JSON array of cards) into a Deck.
          behavior: >
            Every element is validated with Validate Card; duplicate customIds and a
            dependsOn cycle are deck faults; a dependsOn naming a card outside the deck
            is external and allowed. The Deck keeps file order.
          steps:
            - calls: Validate Card
            - reads: Deck File
            - produces: Deck
          examples:
            - given: "a file with cards a, b, b"
              when: "loaded"
              then: "one deck fault: duplicate customId b"
            - given: "cards a (dependsOn [b]) and b (dependsOn [a])"
              when: "loaded"
              then: "one deck fault naming the cycle a -> b -> a"
            - given: "card a with dependsOn [zzz] and no card zzz"
              when: "loaded"
              then: "no fault; externalDependsOn of the Deck is ['zzz']"
        - name: Layer Generations
          description: Orders a Deck into generations by the longest dependsOn path.
          behavior: >
            Generation of a card = 1 + max generation of its in-deck dependencies, 0
            for none; external dependencies do not count. Within a generation, deck
            order is kept. Returns a list of lists of customIds.
          steps:
            - calls: Load Deck
          examples:
            - given: "cards a, b (dependsOn [a]), c (dependsOn [a]), d (dependsOn [b, c])"
              when: "layered"
              then: "[['a'], ['b', 'c'], ['d']]"
            - given: "cards a (dependsOn ['ext']), b"
              when: "layered"
              then: "[['a', 'b']]"
        - name: Find Hazards
          description: Reports ownership conflicts between the cards of one deck.
          behavior: >
            write-write (two cards of one generation share a target) is an error;
            read-write (a card's contextSlice names a sibling's target in the same
            generation) is an error with a repair — add dependsOn from reader to
            writer; implicit-read (empty contextSlice) and unordered-read (a slice
            names a target of a card in a later generation with no dependsOn path)
            are warnings. Each hazard: kind, severity error|warning, cards, path,
            repair or null.
          steps:
            - calls: Layer Generations
            - produces: Hazard
          examples:
            - given: "a and b in generation 0, both with target src/x.ts"
              when: "hazards are found"
              then: "one hazard {kind: 'write-write', severity: 'error', cards: ['a','b'], path: 'src/x.ts', repair: null}"
            - given: "a writes src/x.ts, b reads src/x.ts in its slice, both generation 0"
              when: "hazards are found"
              then: "one hazard {kind: 'read-write', severity: 'error', cards: ['b','a'], path: 'src/x.ts', repair: {addDependsOn: {card: 'b', on: 'a'}}}"
        - name: Weigh Slices
          description: Sums the bytes of each card's contextSlice plus targets on disk.
          behavior: >
            Missing files count 0 and are listed. A card over the cap (default
            500000 bytes) gets an oversized-slice warning carrying the bytes and the
            cap.
          steps:
            - calls: Load Deck
            - produces: Hazard
          examples:
            - given: "a card whose slice files total 600001 bytes and the default cap"
              when: "weighed"
              then: "one hazard {kind: 'oversized-slice', severity: 'warning', bytes: 600001, cap: 500000}"
      dataObjects:
        - name: Card
          description: One unit of work for an executor; what morph run compiles into a request.
          schema:
            customId: "string, ^[A-Za-z0-9._-]+$"
            intent: "'generate' | 'patch'"
            targets: "string[] non-empty, repo-relative, distinct after normalisation"
            contextSlice: "string[] default []"
            instruction: "string non-empty"
            acceptance: "string | null — a shell command run from the repo root"
            model: "string | null"
            maxTokens: "number | null"
            reasoning: "{ maxTokens: number } | { effort: 'low'|'medium'|'high' } | null"
            variants: "number >= 1, default 1"
            dependsOn: "string[] default []"
        - name: Deck
          description: The loaded backlog.
          schema:
            cards: "Card[] in file order"
            externalDependsOn: "string[] — dependsOn names not in the deck"
        - name: Deck File
          description: "decks/<name>.json or .morph/deck.json — a JSON array of Card objects (flat form only)."
          schema: "Card[]"
        - name: Hazard
          description: One ownership or size finding.
          schema:
            kind: "'write-write' | 'read-write' | 'implicit-read' | 'unordered-read' | 'oversized-slice'"
            severity: "'error' | 'warning'"
            cards: "string[]"
            path: "string | null"
            repair: "{ addDependsOn: { card: string, on: string } } | null"
            bytes: "number | undefined"
            cap: "number | undefined"

    # ---------------------------------------------------------------- P2
    - name: compiler
      description: >
        Turns a Card and the files it names into provider-neutral requests, one per
        variant, and parses an answer back into target files: src/compiler/*.ts.
        Reads the slice and target files; never the network, never git.
      language: typescript
      requirements: [Deterministic Core]
      functions:
        - name: Compile Card
          description: Builds the conversation for one card.
          behavior: >
            generate: one user message per slice file, in sorted path order, each
            "Contents of file <path>:" followed by the file in a fenced block; then a
            user message with the instruction and the output directive. patch: the
            same, but each existing target is first given as "Original file <path>:"
            with its content; a target that does not exist yet is announced as "new
            file". Variants: N requests with customId <id>.v1..vN and identical
            messages. A slice file that does not exist is a compile fault, not a
            silent skip.
          steps:
            - reads: Card
            - calls: Capture Inputs
            - produces: Request
          examples:
            - given: "card a, intent generate, slice [docs/B.md, docs/A.md], variants 2"
              when: "compiled"
              then: "two Requests a.v1 and a.v2; messages[0] is docs/A.md, messages[1] docs/B.md, messages[2] the instruction + directive"
            - given: "card p, intent patch, targets [src/x.ts] which exists with 3 lines"
              when: "compiled"
              then: "the first message is 'Original file src/x.ts:' with those 3 lines fenced"
            - given: "a slice naming docs/missing.md"
              when: "compiled"
              then: "a compile fault naming docs/missing.md; no Request"
        - name: Output Directive
          description: The fixed tail of every instruction that tells the model how to answer, with the format rules Parse Answer applies.
          behavior: |
            outputDirective(targets) throws an Error whose message starts "outputDirective" on
            an empty list. The fence lines it shows are bare (three backticks, no language tag:
            the text names no language). One target <p> gives, with \n line breaks:
              Return the complete content of <p> as ONE fenced block, and nothing else:
              (empty line)
              ```
              <the complete content of <p>>
              ```
              (empty line)
              The opening fence may name the file's language. Only the FIRST fenced block of the answer becomes the file: a second block (a diff, an edit summary, an example) is dropped, and every line outside the fence is discarded. An answer with no fence at all is written to the file verbatim, prose and all. An answer whose fences do not pair up is discarded unread as cut off, so no line of the file may begin with three backticks. No preamble, no closing commentary, no diff, no elision: the whole file.
            Several targets (n of them) give:
              This card writes <n> files. Return each one as a line `FILE: <path>` followed by ONE fenced block holding its complete content:
              (empty line)
              FILE: <path>
              ```
              <the complete content of that file>
              ```
              (empty line)
              One such pair per file, every file exactly once, in this order:
              <each target on its own line, in the given order>
              (empty line)
              Use exactly these paths, each file whole: no diff, no elision. An answer that misses a file, gives one twice or names a file not in this list is discarded whole. Only the first fenced block after a FILE: line is that file's content: a second block (a diff, an edit summary, an example) is dropped. Lines outside the fenced blocks are ignored, but no other line may begin with FILE:. An answer whose fences do not pair up is discarded unread as cut off, so no line of a file may begin with three backticks.
            Every rule the text states is what Parse Answer does; no trailing newline.
          examples:
            - given: "targets [src/a.ts, tests/a.test.ts]"
              when: "the directive is rendered"
              then: "it begins 'This card writes 2 files. Return each one as a line `FILE: <path>`', holds the line block 'in this order:\\nsrc/a.ts\\ntests/a.test.ts\\n\\n' (the two paths in that order), and ends 'so no line of a file may begin with three backticks.'"
            - given: "targets [src/a.ts]"
              when: "the directive is rendered"
              then: "exactly 'Return the complete content of src/a.ts as ONE fenced block, and nothing else:\\n\\n```\\n<the complete content of src/a.ts>\\n```\\n\\nThe opening fence may name the file's language. Only the FIRST fenced block of the answer becomes the file: a second block (a diff, an edit summary, an example) is dropped, and every line outside the fence is discarded. An answer with no fence at all is written to the file verbatim, prose and all. An answer whose fences do not pair up is discarded unread as cut off, so no line of the file may begin with three backticks. No preamble, no closing commentary, no diff, no elision: the whole file.'"
            - given: "targets [docs/B.md, src/b.ts, tests/b.test.ts]"
              when: "the directive is rendered"
              then: "it begins 'This card writes 3 files.'; every fence line in it is exactly '```' (no language tag); it holds 'docs/B.md\\nsrc/b.ts\\ntests/b.test.ts\\n' in that order"
            - given: "targets []"
              when: "the directive is rendered"
              then: "throws an Error whose message starts 'outputDirective'"
        - name: Capture Inputs
          description: Digests the declared inputs of a card so a run can detect a change under its feet.
          behavior: >
            For every path in contextSlice and targets: sha256 hex of the bytes, the
            first 16 hex chars, or 'absent'. Sorted by path. Comparing two captures
            yields the list of changed paths.
          steps:
            - produces: Input Digest
          examples:
            - given: "src/x.ts with bytes 'a\\n' and an absent tests/x.test.ts"
              when: "captured"
              then: "{'src/x.ts': '87428fc522803d31', 'tests/x.test.ts': 'absent'}"
            - given: "a capture, then src/x.ts rewritten"
              when: "compared"
              then: "changed is ['src/x.ts']"
        - name: Parse Answer
          description: Splits a model answer into target contents.
          behavior: >
            Single target: the content is the first fenced block if any, else the
            whole text. Several targets: sections introduced by `FILE: <path>`; the set
            of paths must equal the targets exactly, otherwise the answer is corrupt
            and says which path is missing or extra. An odd number of fence lines
            means truncated. A leading line that is only `---` is dropped for any
            extension. Result: {files: {path: content}} or {corrupt: reason} or
            {truncated: true}.
          examples:
            - given: "targets [src/a.ts]; answer '```ts\\nexport const a = 1;\\n```'"
              when: "parsed"
              then: "files {'src/a.ts': 'export const a = 1;\\n'}"
            - given: "targets [src/a.ts, tests/a.test.ts]; answer with FILE: src/a.ts only"
              when: "parsed"
              then: "corrupt: 'missing section for tests/a.test.ts'"
            - given: "an answer with three fence lines"
              when: "parsed"
              then: "truncated: true"
      dataObjects:
        - name: Request
          description: One provider-neutral chat request.
          schema:
            customId: "string — '<cardId>.v<n>'"
            model: "string | null"
            maxTokens: "number | null"
            reasoning: "Card.reasoning"
            messages: "{ role: 'system'|'user'|'assistant', content: string }[]"
        - name: Input Digest
          description: Declared inputs of a card at compile time.
          schema: "{ [path: string]: string } — 16 hex chars or 'absent', keys sorted"
        - name: Parsed Answer
          description: The outcome of Parse Answer.
          schema: "{ files: { [path: string]: string } } | { corrupt: string } | { truncated: true }"

    # ---------------------------------------------------------------- P3
    - name: acceptance
      description: >
        Judges one card's answers: src/acceptance/*.ts. Snapshots the targets' bytes,
        writes a variant, runs the acceptance command with a timeout, keeps the first
        green variant, rolls everything back otherwise, and builds the diagnosis the
        retry carries. The environment of the child is a parameter, never read here.
      language: typescript
      guardrails: [No Shell Outside Acceptance]
      functions:
        - name: Snapshot Targets
          description: Remembers the bytes (or absence) of every target before writing.
          behavior: >
            snapshotTargets(root, targets) reads each target under root, in targets
            order: a regular file gives its bytes (any bytes, never decoded), anything
            else gives null (absent). In memory, never through git. restoreSnapshot
            puts every entry back: bytes are written again (parent directories
            created), null deletes the file if it exists. Restoring twice is the same
            as restoring once.
          steps:
            - produces: Target Snapshot
          examples:
            - given: 'root with src/a.ts = "old\n" and no src/b.ts; snapshot of targets [src/a.ts, src/b.ts]; then src/a.ts written "new\n" and src/b.ts written "x\n"'
              when: "the snapshot is restored"
              then: 'entries are [src/a.ts with 4 bytes "old\n", src/b.ts with bytes null]; after restore src/a.ts reads "old\n" and src/b.ts does not exist'
            - given: 'root with src/deep/a.ts = "old\n"; snapshot of [src/deep/a.ts]; then the directory src/deep removed'
              when: "the snapshot is restored, then restored again"
              then: 'src/deep/a.ts reads "old\n" after each restore (the parent directory is recreated)'
            - given: 'root with bin.dat holding the 4 bytes ff 00 fe 0a (not UTF-8); snapshot of [bin.dat]; then bin.dat written "text\n"'
              when: "the snapshot is restored"
              then: 'bin.dat holds exactly the bytes ff 00 fe 0a (hex "ff00fe0a")'
        - name: Run Acceptance
          description: Executes the card's acceptance command from the repo root.
          behavior: >
            runAcceptance(command, root, {env, timeoutMs}) spawns /bin/sh -c with cwd =
            root, env = the given env with NO_COLOR=1 and CI=1 laid over it (nothing
            else; the caller passes what it wants inherited), detached in its own
            process group; stdout and stderr merged in write order. timeoutMs
            defaults to 300000: on expiry the whole process group is killed, so no
            child outlives the call, and the result is exit null, timedOut true, the
            output so far kept with the line "acceptance timed out after <ms> ms"
            appended. The log is clipped by clipLog: over 4000 chars it keeps the
            first 1500 and the last 1500 chars and, between them, a marker and every
            middle line that looks like a diagnosis (FAIL, Error, assert, expected),
            within 800 chars. Returns Acceptance Result.
          steps:
            - produces: Acceptance Result
          examples:
            - given: 'command `echo out; echo err >&2; exit 3`, env {PATH: "/usr/bin:/bin"}'
              when: "run"
              then: '{exit: 3, log: "out\nerr\n", timedOut: false}'
            - given: 'root holding marker.txt = "here\n"; env {PATH: "/usr/bin:/bin", FOO: "bar", NO_COLOR: "0"}; command `echo "$NO_COLOR $CI $FOO ${HOME-unset}"; cat marker.txt`'
              when: "run"
              then: '{exit: 0, log: "1 1 bar unset\nhere\n", timedOut: false} — NO_COLOR and CI forced, the given env passed, nothing of the parent environment (HOME) leaks, cwd is root'
            - given: 'command `echo started; sleep 30 & echo $! > sleep.pid; wait`, env {PATH: "/usr/bin:/bin"}, timeoutMs 200'
              when: "run"
              then: '{exit: null, timedOut: true, log: "started\nacceptance timed out after 200 ms\n"}, returned in under 2000 ms; the sleep whose pid is in root/sleep.pid is gone (no /proc/<pid>, or its state is Z): the process group was killed, no orphan'
            - given: 'command `cat <absolute path of the fixture>`, env {PATH: "/usr/bin:/bin"}; the fixture is 6403 chars, 200 lines, with three diagnosis lines in the middle'
              when: "run"
              then: 'exit 0, timedOut false, log exactly the 3154 chars of the clipped fixture: first 1500 chars, "\n[... 3403 chars clipped; diagnosis lines kept:]\n", the three lines " FAIL  tests/a.test.ts > adds..", "AssertionError: expected 3 to be 4", "Error: boom at src/a.ts:7......", "[...]\n", last 1500 chars'
              ref: "tests/fixtures/acceptance/longLog.txt (input) and tests/fixtures/acceptance/longLogClipped.txt (the log)"
        - name: Verify Card
          description: Best-of-N over the parsed variants.
          behavior: >
            verifyCard({root, targets, command, variants, env, timeoutMs}) snapshots the
            targets once, then for each variant in order: a corrupt answer gives the
            stand-in result {exit null, log "answer corrupt: <reason>", diff null} and a
            truncated one {exit null, log "answer truncated", diff null}, nothing
            written; otherwise every file of the answer is written under root and the
            acceptance is run; exit 0 → that variant is accepted, its files stay, its
            result has diff null and no later variant is tried; any other exit → the
            result carries the Build Attempt Diff of the written files against the
            snapshot, the snapshot is restored, and the next variant is tried. Returns
            Verify Outcome; with no green variant accepted is null and the tree equals
            the snapshot.
          steps:
            - reads: Parsed Answer
            - calls: Snapshot Targets
            - calls: Run Acceptance
            - calls: Build Attempt Diff
            - produces: Verify Outcome
          examples:
            - given: 'root with src/a.ts = "old\n"; targets [src/a.ts]; command `grep good src/a.ts || { echo "FAIL: no good in src/a.ts"; exit 1; }`; variants c.v1 {corrupt: "missing section for src/a.ts"}, c.v2 {files: {src/a.ts: "bad\n"}}, c.v3 {files: {src/a.ts: "good\n"}}'
              when: "verified"
              then: 'accepted {variant: "c.v3"}; results [{c.v1, exit null, log "answer corrupt: missing section for src/a.ts", diff null}, {c.v2, exit 1, log "FAIL: no good in src/a.ts\n", diff "--- a/src/a.ts\n+++ b/src/a.ts\n@@ -1,1 +1,1 @@\n-old\n+bad\n"}, {c.v3, exit 0, log "good\n", diff null}]; src/a.ts reads "good\n"'
            - given: 'the same root and command; targets [src/a.ts, src/b.ts], src/b.ts absent; variants c.v1 {truncated: true}, c.v2 {files: {src/a.ts: "bad\n", src/b.ts: "x\n"}}'
              when: "verified"
              then: 'accepted null; results [{c.v1, exit null, log "answer truncated", diff null}, {c.v2, exit 1, log "FAIL: no good in src/a.ts\n", diff "--- a/src/a.ts\n+++ b/src/a.ts\n@@ -1,1 +1,1 @@\n-old\n+bad\n--- /dev/null\n+++ b/src/b.ts\n@@ -0,0 +1,1 @@\n+x\n"}]; src/a.ts reads "old\n" and src/b.ts does not exist'
            - given: 'the same root, command and targets [src/a.ts]; variants c.v1 {files: {src/a.ts: "good\n"}}, c.v2 {files: {src/a.ts: "good\n"}}'
              when: "verified"
              then: 'accepted {variant: "c.v1"}; results has exactly one entry, c.v1 with exit 0: c.v2 is never run'
        - name: Build Attempt Diff
          description: A unified diff of the failed variant against the snapshot, each file's section capped at 6000 chars, its head and tail kept.
          behavior: >
            buildAttemptDiff(before, after): for each path of after in its key order
            whose lines differ from before (a missing or null before is an absent
            file), "--- a/<p>" (or "--- /dev/null" when absent) and "+++ b/<p>", then
            hunks of a minimal line diff with 3 lines of context, "@@ -l,n +l,n @@"
            with both counts always printed; changes 6 or fewer unchanged lines apart
            share one hunk. Lines are split on \n, a final \n ends the last line. No
            change at all gives "". Each file's section (its two header lines and its
            hunks) is clipped on its own, and the sections are concatenated in key
            order: a section over 6000 chars keeps whole lines from its start while
            they fit in 3000 - u chars and whole lines from its end (never one of the
            head's) while they fit in 3000 - u chars, u being the length of "... [<the
            section's length> characters elided] ..."; between them the line "... [<n>
            characters elided] ...\n", n = the section's length minus the kept head
            and tail.
          examples:
            - given: 'before {src/a.ts: "line 1\n" … "line 10\n" (10 lines)}; after the same with line 5 = "LINE 5"'
              when: "diffed"
              then: '"--- a/src/a.ts\n+++ b/src/a.ts\n@@ -2,7 +2,7 @@\n line 2\n line 3\n line 4\n-line 5\n+LINE 5\n line 6\n line 7\n line 8\n"'
            - given: 'before {src/a.ts: "a\nb\n", src/b.ts: null}; after {src/a.ts: "a\nb\n", src/b.ts: "x\n"}'
              when: "diffed"
              then: '"--- /dev/null\n+++ b/src/b.ts\n@@ -0,0 +1,1 @@\n+x\n" — the unchanged src/a.ts is not mentioned'
            - given: 'before {t: "line 1\n" … "line 20\n"}; after the same with line 2 = "LINE 2" and line 18 = "LINE 18"'
              when: "diffed"
              then: 'two hunks: "@@ -1,5 +1,5 @@" (line 1, -line 2, +LINE 2, lines 3-5) and "@@ -15,6 +15,6 @@" (lines 15-17, -line 18, +LINE 18, lines 19-20)'
            - given: 'before {src/big.ts: null}; after {src/big.ts: the 400 lines "export const v000 = 0;" … "export const v399 = 399;"} (9890 chars; its section is 10339 chars)'
              when: "diffed"
              then: 'exactly 5952 chars, 234 lines: the first 119 lines of the section ("--- /dev/null\n+++ b/src/big.ts\n@@ -0,0 +1,400 @@\n+export const v000 = 0;\n" … "+export const v115 = 115;\n"), then "... [4420 characters elided] ...\n", then its last 114 lines ("+export const v286 = 286;\n" … "+export const v399 = 399;\n")'
              ref: "tests/fixtures/acceptance/bigAfter.txt (the after content)"
            - given: 'before {src/a.ts: null, src/b.ts: null}; after {src/a.ts: the 400 lines of example 4, src/b.ts: the same 400 lines} (two sections of 10337 chars, 20674 together)'
              when: "diffed"
              then: 'exactly 11900 chars: two sections of 5950 chars, each clipped on its own; each holds its 3 header lines, "+export const v000 = 0;\n" … "+export const v115 = 115;\n", "... [4420 characters elided] ...\n" and "+export const v286 = 286;\n" … "+export const v399 = 399;\n"; the second starts at char 5950 with "--- /dev/null\n+++ b/src/b.ts\n" (the tail of src/a.ts is kept)'
              ref: "tests/fixtures/acceptance/bigAfter.txt (the after content of both)"
      dataObjects:
        - name: Target Snapshot
          description: The bytes of a card's targets before any variant is written.
          schema: "{ root: string, entries: { path: string, bytes: Uint8Array | null }[] } — entries in targets order, null = absent"
        - name: Acceptance Result
          description: What one acceptance command run returned.
          schema: "{ exit: number | null, log: string, timedOut: boolean }"
        - name: Verify Outcome
          description: The result of best-of-N verification of one card.
          schema: "{ accepted: { variant: string } | null, results: { variant: string, exit: number | null, log: string, diff: string | null }[] }"

    # ---------------------------------------------------------------- P4 (sync route; batch is P11)
    - name: processor
      description: >
        Talks to a model provider: src/processor/*.ts. Reads the registry from the
        environment, assembles the OpenRouter chat-completions request, sends one
        generation on the sync route (one request at a time per worker, at most
        `concurrency` workers), reads answers and usage back; a stub processor answers
        from files for runs without a provider. The transport (fetch and sleep) is a
        parameter: the processor's own transport is the only thing a test mocks. The
        batch route (/api/beta/batches, submit/collect) is P11.
      language: typescript
      requirements: [Deterministic Core]
      functions:
        - name: Read Registry
          description: MORPH_PROCESSOR_<id>_* env vars into Processor Configs; invalid ones are listed, not dropped silently.
          behavior: >
            readRegistry(env) takes the environment as a parameter (default: the process
            environment; the only environment read of the Component). A variable
            MORPH_PROCESSOR_<id>_<KEY> names processor <id> ([A-Za-z0-9-]+, no underscore)
            and one of the keys TYPE, MODEL, API_KEY, BASE_URL, ROUTE, CONCURRENCY,
            PROVIDER_ORDER, REASONING_MAX_TOKENS, REASONING_EFFORT, TIMEOUT_MS,
            MAX_RETRIES, ANSWERS_DIR; values are trimmed and an empty value is absent.
            TYPE openrouter|stub is required; openrouter requires MODEL and API_KEY,
            stub requires ANSWERS_DIR (model defaults to "stub"). Defaults: BASE_URL
            https://openrouter.ai/api/v1, ROUTE sync (sync|batch), CONCURRENCY 1,
            TIMEOUT_MS 600000, MAX_RETRIES 2, PROVIDER_ORDER null (else the comma list,
            trimmed), reasoning null (else {maxTokens} or {effort}, never both). Every
            fault is {key: the variable, message starting with it}; a processor with any
            fault yields no config. Configs sorted by id, faults by key.
          steps:
            - produces: Processor Config
          examples:
            - given: 'env {PATH: "/usr/bin:/bin", MORPH_PROCESSOR_glm53_TYPE: "openrouter", MORPH_PROCESSOR_glm53_MODEL: "z-ai/glm-5.3", MORPH_PROCESSOR_glm53_API_KEY: "sk-or-test", MORPH_PROCESSOR_glm53_CONCURRENCY: "4", MORPH_PROCESSOR_glm53_PROVIDER_ORDER: "Novita, Together", MORPH_PROCESSOR_glm53_REASONING_MAX_TOKENS: "2500"}'
              when: "read"
              then: 'faults []; configs exactly [the config of the fixture]: id glm53, route sync, concurrency 4, providerOrder ["Novita", "Together"], reasoning {maxTokens: 2500}, timeoutMs 600000, maxRetries 2, answersDir null'
              ref: "tests/fixtures/processor/glmConfig.json (the one config)"
            - given: 'env {MORPH_PROCESSOR_stub_TYPE: "stub", MORPH_PROCESSOR_stub_ANSWERS_DIR: " /tmp/answers "}'
              when: "read"
              then: 'faults []; one config {id: "stub", type: "stub", model: "stub", apiKey: null, baseUrl: "https://openrouter.ai/api/v1", route: "sync", concurrency: 1, providerOrder: null, reasoning: null, timeoutMs: 600000, maxRetries: 2, answersDir: "/tmp/answers"}'
            - given: 'env {MORPH_PROCESSOR_a_TYPE: "openrouter", MORPH_PROCESSOR_b_TYPE: "stub", MORPH_PROCESSOR_b_ANSWERS_DIR: "/x", MORPH_PROCESSOR_b_CONCURRENCY: "0", MORPH_PROCESSOR_c_TYPE: "openai", MORPH_PROCESSOR_d_TYPE: "stub", MORPH_PROCESSOR_d_ANSWERS_DIR: "/x"}'
              when: "read"
              then: 'configs: only d; faults exactly four, in this order: MORPH_PROCESSOR_a_API_KEY "MORPH_PROCESSOR_a_API_KEY is required", MORPH_PROCESSOR_a_MODEL "MORPH_PROCESSOR_a_MODEL is required", MORPH_PROCESSOR_b_CONCURRENCY "MORPH_PROCESSOR_b_CONCURRENCY must be a positive integer (got ''0'')", MORPH_PROCESSOR_c_TYPE "MORPH_PROCESSOR_c_TYPE must be one of openrouter, stub (got ''openai'')"'
            - given: 'env {MORPH_PROCESSOR_e_TYPE: "stub", MORPH_PROCESSOR_e_ANSWERS_DIR: "/x", MORPH_PROCESSOR_e_REASONING_EFFORT: "low", MORPH_PROCESSOR_e_REASONING_MAX_TOKENS: "100", MORPH_PROCESSOR_e_FOO: "1", MORPH_PROCESSOR_x_y_TYPE: "stub"}'
              when: "read"
              then: 'configs []; faults exactly four, in this order: "MORPH_PROCESSOR_e_FOO is not a known key", "MORPH_PROCESSOR_e_REASONING_EFFORT conflicts with MORPH_PROCESSOR_e_REASONING_MAX_TOKENS: set one", "MORPH_PROCESSOR_x_TYPE is required", "MORPH_PROCESSOR_x_y_TYPE is not a known key" (the id is x, its key y_TYPE)'
        - name: Assemble Request
          description: Request → provider JSON (OpenRouter chat completions) with provider.order + allow_fallbacks false when pinned, reasoning, usage.include; never tool_choice.
          behavior: >
            assembleRequest(request, config) is pure. url = baseUrl without trailing
            slashes + "/chat/completions"; headers Authorization "Bearer <apiKey>" (absent
            when apiKey is null) and Content-Type application/json. body: model = the
            request's model or the config's; messages copied as {role, content};
            max_tokens = the request's maxTokens, absent when null; reasoning = the
            request's or else the config's, {maxTokens: n} as {max_tokens: n}, {effort}
            as is, absent when both are null; provider {order, allow_fallbacks: false}
            only when providerOrder is not null; usage {include: true} always. No other
            key: never tool_choice, tools or stream.
          steps:
            - reads: Request
            - reads: Processor Config
          examples:
            - given: 'request {customId: "a.v1", model: null, maxTokens: 12000, reasoning: null, messages: [{role: "user", content: "hi"}]}; the config of tests/fixtures/processor/glmConfig.json'
              when: "assembled"
              then: 'url "https://openrouter.ai/api/v1/chat/completions"; headers Authorization "Bearer sk-or-test", Content-Type "application/json"; JSON.stringify(body) is exactly {"model":"z-ai/glm-5.3","messages":[{"role":"user","content":"hi"}],"max_tokens":12000,"reasoning":{"max_tokens":2500},"provider":{"order":["Novita","Together"],"allow_fallbacks":false},"usage":{"include":true}}'
            - given: 'request {customId: "b.v2", model: "x/y", maxTokens: null, reasoning: {effort: "low"}, messages: [{role: "system", content: "s"}, {role: "user", content: "u"}]}; the glm config with baseUrl "http://127.0.0.1:9/v1/" and providerOrder null'
              when: "assembled"
              then: 'url "http://127.0.0.1:9/v1/chat/completions"; JSON.stringify(body) is exactly {"model":"x/y","messages":[{"role":"system","content":"s"},{"role":"user","content":"u"}],"reasoning":{"effort":"low"},"usage":{"include":true}} — no max_tokens, no provider, no tool_choice'
        - name: Read Response
          description: One provider reply (HTTP status + body text) into an Answer and its Usage.
          behavior: >
            readResponse(customId, status, text) is pure and never throws. Usage is read
            from any JSON body: id → generationId, provider, usage.prompt_tokens →
            inputTokens and usage.completion_tokens → outputTokens (0 when absent),
            usage.cost (null when absent). Status outside 200..299 → error
            "http <status>: <error.message of the JSON body, else the first 200 chars of
            the text>". Status 2xx: a body that is not JSON → "unreadable response:
            <first 200 chars>"; a body with an error object → "provider error:
            <error.message>"; no choices → "provider error: no choices"; otherwise text =
            choices[0].message.content (null when not a string: a reasoning model that
            spent its budget answers finish_reason "length" with no content, which is a
            truncation, not an error) and finishReason = choices[0].finish_reason.
          steps:
            - produces: Answer
            - produces: Usage
          examples:
            - given: 'customId "a.v1", status 200, the text of the fixture (a recorded glm answer, cleaned)'
              when: "read"
              then: 'answer {customId: "a.v1", text: "```ts\nexport const a = 1;\n```", finishReason: "stop", error: null}; usage {customId: "a.v1", inputTokens: 11030, outputTokens: 571, cost: 0.00538632, provider: "Novita", generationId: "gen-0000000001-TESTtestTESTtestTEST"}'
              ref: "tests/fixtures/processor/okResponse.json"
            - given: 'customId "a.v2", status 200, the text of the fixture (content null, finish_reason "length")'
              when: "read"
              then: 'answer {text: null, finishReason: "length", error: null}; usage inputTokens 15550, outputTokens 12000, cost 0.0172'
              ref: "tests/fixtures/processor/lengthResponse.json"
            - given: 'customId "a.v1", status 402, the text of the fixture (an OpenRouter error body)'
              when: "read"
              then: 'answer {text: null, finishReason: null, error: "http 402: Insufficient credits. Add more using https://openrouter.ai/settings/credits"}; usage {inputTokens: 0, outputTokens: 0, cost: null, provider: null, generationId: null}'
              ref: "tests/fixtures/processor/errorResponse.json"
            - given: 'customId "a.v1", status 200, text "<html>bad gateway</html>"'
              when: "read"
              then: 'answer error "unreadable response: <html>bad gateway</html>", text null, finishReason null; usage tokens 0 and 0'
        - name: Stub Answer
          description: The stub processor's answer to one Request, read from a directory of answer files; no network.
          behavior: >
            stubAnswer(request, config) reads <answersDir>/<customId>.md, else
            <answersDir>/<customId without its final .v<n>>.md; found → text = the file
            (UTF-8, as is), finishReason "stop", error null; usage 0 and 0 tokens, cost 0,
            provider "stub", generationId "stub-<customId>". Neither file → text null,
            finishReason null, error "stub has no answer: <answersDir>/<customId>.md".
          steps:
            - reads: Request
            - produces: Answer
            - produces: Usage
          examples:
            - given: 'answersDir holding a.v1.md = "```ts\nexport const a = 1;\n```\n"; request a.v1'
              when: "answered"
              then: 'answer {customId: "a.v1", text: "```ts\nexport const a = 1;\n```\n", finishReason: "stop", error: null}; usage {inputTokens: 0, outputTokens: 0, cost: 0, provider: "stub", generationId: "stub-a.v1"}'
            - given: 'answersDir holding only a.md = "A\n"; request a.v2'
              when: "answered"
              then: 'text "A\n", finishReason "stop", generationId "stub-a.v2"'
            - given: 'an empty answersDir <d>; request b.v1'
              when: "answered"
              then: 'text null, finishReason null, error "stub has no answer: <d>/b.v1.md"'
        - name: Send Generation
          description: Sends every Request of a generation, returns Answers and Usage per customId; retries transport errors with backoff; a provider refusal is recorded, not retried.
          behavior: >
            sendGeneration(config, requests, transport) never rejects; answers and usage
            come back in the order of requests, one each. Route batch → every answer
            "route batch is not available on the sync sender", no call. Type stub →
            Stub Answer per request, no call. Type openrouter: at most concurrency
            requests in flight; each is Assemble Request, then transport.fetch(url,
            {method POST, headers, body JSON}) and Read Response. A thrown fetch
            ("transport: <message>") or status 408, 429 or 5xx is retried up to
            maxRetries times, sleeping transport.sleep(1000 * 2^k) before retry k+1; any
            other status, refusals included, is final at once. A request still failing
            after retries gets " (after <attempts> attempts)" appended to its error.
          steps:
            - calls: Assemble Request
            - calls: Read Response
            - calls: Stub Answer
            - produces: Answer
            - produces: Usage
          examples:
            - given: 'the glm config; requests a.v1 and a.v2 (messages [{role: "user", content: "hi"}]); a fakeFetch whose route https://openrouter.ai/api/v1/chat/completions answers status 200 with the text of tests/fixtures/processor/okResponse.json'
              when: "sent"
              then: 'two calls, both POST with header Authorization "Bearer sk-or-test" and a body whose usage is {include: true}; answers [a.v1, a.v2] both with finishReason "stop" and error null; usage both 11030 in, 571 out; no sleep'
            - given: 'the glm config (maxRetries 2); request a.v1; a fakeFetch with failAll(new Error("socket hang up"))'
              when: "sent"
              then: 'three calls; sleeps [1000, 2000]; answer error "transport: socket hang up (after 3 attempts)", text null; usage 0 in, 0 out, cost null'
            - given: 'the glm config; request a.v1; the route answers status 402 with the text of tests/fixtures/processor/errorResponse.json'
              when: "sent"
              then: 'one call, no sleep; answer error "http 402: Insufficient credits. Add more using https://openrouter.ai/settings/credits"'
            - given: 'the glm config; request a.v1; a transport whose first call answers status 503 with text "upstream down" and every later call status 200 with okResponse.json'
              when: "sent"
              then: 'two calls; sleeps [1000]; answer finishReason "stop", error null; usage 11030 in'
            - given: 'the glm config with concurrency 2; requests r1.v1, r2.v1, r3.v1; a transport that counts calls in flight and yields before answering status 200 with okResponse.json'
              when: "sent"
              then: 'at most 2 in flight, 3 calls; answers in the order r1.v1, r2.v1, r3.v1'
      dataObjects:
        - name: Processor Config
          description: One processor as read from the environment.
          schema: "{ id, type: 'openrouter'|'stub', model, apiKey: string | null, baseUrl, route: 'sync'|'batch', concurrency, providerOrder: string[] | null, reasoning: Card.reasoning, timeoutMs, maxRetries, answersDir: string | null }"
        - name: Answer
          description: One model answer to one Request, or its failure.
          schema: "{ customId, text: string | null, finishReason: string | null, error: string | null }"
        - name: Usage
          description: Tokens and cost of one Request as the provider reported them (0 tokens and null cost when it reported none).
          schema: "{ customId, inputTokens, outputTokens, cost: number | null, provider: string | null, generationId: string | null }"

    # ---------------------------------------------------------------- P5 (skeleton)
    - name: runloop
      description: >
        The run: src/runloop/*.ts. Resolves runnable cards per generation, compiles,
        sends, verifies, retries with the diagnosis, records outcomes and produces the
        run report. The git step (branch, commit, archive write) is P6: runloop fires an
        injected commit hook for each accepted card and returns the Run Report; it owns
        the Run Report schema and the archive layout but writes and commits nothing
        itself. The clock (now) and the processor transport (fetch, sleep) are injected
        parameters, so a test waits on no timer and opens no socket. The milestone is an
        end-to-end run of a deck on the stub processor inside vitest: no network, no git.
      language: typescript
      guardrails: [Frozen Tree During Run]
      functions:
        - name: Resolve Runnable
          description: A card whose dependency failed, was skipped or ran out of budget is skipped with the reason naming that dependency.
          behavior: >
            resolveRunnable(cards, done) takes the cards of one generation and `done`, a
            Record of the final status of every card processed so far (written | failed |
            skipped | budget-exceeded). A card is skipped when any id in its dependsOn has
            a status in `done` other than "written"; its reason is "dependency <id>
            <status>" for the FIRST such dependency in dependsOn order. A dependency absent
            from `done` (external, or satisfied outside the run) is ignored. Returns
            {runnable: Card[], skipped: CardOutcome[]} keeping the input order; a skipped
            card's outcome is {status: "skipped", reason, attempts 0, winningVariant null,
            acceptanceLog "", earlierFailures [], commit null, diffstat null}.
          steps:
            - reads: Card
            - produces: Card Outcome
          examples:
            - given: 'cards [a, b] (no dependsOn); done {}'
              when: "resolved"
              then: 'runnable [a, b]; skipped []'
            - given: 'cards [b] with dependsOn ["a"], and an external dep "ext"; done {a: "written"} (ext absent from done)'
              when: "resolved"
              then: 'runnable [b]; skipped [] (a is written, ext is ignored)'
            - given: 'cards [b] with dependsOn ["a"]; done {a: "failed"}'
              when: "resolved"
              then: 'runnable []; skipped [{customId: "b", status: "skipped", reason: "dependency a failed", attempts: 0, winningVariant: null, acceptanceLog: "", earlierFailures: [], commit: null, diffstat: null}]'
            - given: 'cards [c] with dependsOn ["x", "b"]; done {x: "written", b: "skipped"}'
              when: "resolved"
              then: 'runnable []; skipped [c] with reason "dependency b skipped" (the first non-written dependency in order)'
        - name: Process Generation
          description: compile → send → parse → verify per card; a compile fault or stale inputs discard the answer; accepted cards fire the commit hook.
          behavior: >
            processGeneration(cards, deps, root) compiles every card with compileCard,
            keeping each card's input digest; sends all variants of all cards in ONE
            sendGeneration(deps.config, requests, deps.transport) call (so deps.config's
            concurrency pools across the whole generation) and slices answers and usage
            back to each card by request index; then verifies each card in input order.
            Per card: a compile fault → {status: "failed", reason "compile: <first fault
            message>", acceptanceLog = the fault messages joined by "\n"}; else recompute
            the digest (captureInputs) and compareCaptures against the compile digest — a
            non-empty change → {status: "failed", reason "stale inputs", acceptanceLog
            "stale inputs: <changed paths, comma+space joined>"} and no acceptance is run;
            else build one VariantAnswer per variant (variant id "<customId>.v<n>"; a
            null-text answer becomes {corrupt: the answer's error ?? "no text returned"},
            else parseAnswer(text, targets)) and call verifyCard. Accepted → {status:
            "written", winningVariant = the accepted variant id, acceptanceLog = the
            winner's log, earlierFailures = the logs of the rejected variants tried before
            it, commit = the sha from deps.commit(customId, targets), diffstat from the
            hook}; no variant accepted → {status: "failed", reason "acceptance failed",
            acceptanceLog = the last variant's log, earlierFailures = the earlier variants'
            logs, commit null, diffstat null}. attempts is 1 for every outcome of one
            round. Returns {outcomes, usage, requests, retryContexts}: usage is the Usage
            of every request sent; requests is one Request Usage per request sent, in send
            order ({customId: the request id, model: the request's model ?? deps.config.model,
            provider, generationId, inputTokens, outputTokens, cost from its Usage,
            finishReason and error from its Answer}); retryContexts holds one Retry Context
            per FAILED outcome, keyed by its customId, in outcome order, and nothing for a
            written card. A compile fault or stale inputs → {acceptanceOutput: the outcome's
            acceptanceLog, previousDiff: null}. A rejected card → the LAST variant whose
            acceptance ran (its verify result has a diff that is not null) gives
            {acceptanceOutput: that variant's log, previousDiff: its diff, "" when the
            attempt changed nothing}; when no variant ran (every answer corrupt or
            truncated) → {acceptanceOutput: the last result's log, previousDiff: null}. The
            log and the diff of the retry always come from the same attempt, and
            previousDiff is null exactly when no acceptance ran.
          steps:
            - uses: compiler
            - uses: processor
            - uses: acceptance
            - produces: Card Outcome
            - produces: Request Usage
            - produces: Retry Context
          examples:
            - given: 'a stub config (answersDir a tmp root with a.v1.md and b.v1.md, each a fenced ts block); cards [a → out/a.ts, b → out/b.ts], each acceptance passes when its file holds the marker; a recording commit hook'
              when: "processed"
              then: 'outcomes a and b both status "written", winningVariant "a.v1"/"b.v1", attempts 1, commit set; the commit hook fired twice; usage length 2 (provider "stub" for each)'
            - given: 'a stub config; one card whose written file does NOT satisfy its acceptance (acceptance "exit 1")'
              when: "processed"
              then: 'one outcome status "failed", reason "acceptance failed", winningVariant null, commit null; the commit hook did not fire'
            - given: 'a stub config; cards [a → shared.ts, b] where b.contextSlice holds shared.ts and a (processed first) is accepted and writes shared.ts'
              when: "processed"
              then: 'a status "written"; b status "failed", reason "stale inputs", acceptanceLog beginning "stale inputs: shared.ts"; b''s acceptance was never run'
            - given: 'a stub config; out/a.ts holds ''export const x = "OLD";\n''; card a → out/a.ts, variants 2, acceptance ''grep -q PASS out/a.ts || { echo "red: $(cat out/a.ts)"; exit 1; }''; a.v1.md a fenced ts block holding ''export const x = "ONE";\n''; a.v2.md the text ''```ts\nexport const x = 2;\n'' (one fence line: truncated)'
              when: "processed"
              then: 'outcome a status "failed", reason "acceptance failed", acceptanceLog "answer truncated", earlierFailures [''red: export const x = "ONE";\n'']; retryContexts {a: {acceptanceOutput: ''red: export const x = "ONE";\n'', previousDiff: ''--- a/out/a.ts\n+++ b/out/a.ts\n@@ -1,1 +1,1 @@\n-export const x = "OLD";\n+export const x = "ONE";\n''}} (the variant that ran, not the last one); out/a.ts holds ''export const x = "OLD";\n'' again'
            - given: 'as example 4, but a.v2.md a fenced ts block holding ''export const x = "TWO";\n'''
              when: "processed"
              then: 'outcome a status "failed", acceptanceLog ''red: export const x = "TWO";\n'', earlierFailures [''red: export const x = "ONE";\n'']; retryContexts {a: {acceptanceOutput: ''red: export const x = "TWO";\n'', previousDiff: ''--- a/out/a.ts\n+++ b/out/a.ts\n@@ -1,1 +1,1 @@\n-export const x = "OLD";\n+export const x = "TWO";\n''}} (both ran: the last one)'
            - given: 'a stub config; cards [a → out/a.ts (a.v1.md fenced, its acceptance passes), b → out/b.ts (b.v1.md the text ''```ts\nexport const x = 2;\n''), c → out/c.ts with contextSlice [docs/missing.md], which does not exist], variants 1 each'
              when: "processed"
              then: 'a "written"; b and c "failed"; retryContexts exactly {b: {acceptanceOutput: "answer truncated", previousDiff: null}, c: {acceptanceOutput: "contextSlice ''docs/missing.md'' does not exist", previousDiff: null}} (no entry for a)'
            - given: 'a stub config (model "stub"); cards [a → out/a.ts with model null, b → out/b.ts with model "glm-x"], variants 1, both accepted'
              when: "processed"
              then: 'requests [{customId: "a.v1", model: "stub", provider: "stub", generationId: "stub-a.v1", inputTokens: 0, outputTokens: 0, cost: 0, finishReason: "stop", error: null}, {customId: "b.v1", model: "glm-x", provider: "stub", generationId: "stub-b.v1", inputTokens: 0, outputTokens: 0, cost: 0, finishReason: "stop", error: null}]; retryContexts {}'
            - given: 'a stub config; out/a.ts holds ''export const x = "ONE";\n''; card a → out/a.ts, variants 1, acceptance ''grep -q PASS out/a.ts || { echo "red: $(cat out/a.ts)"; exit 1; }''; a.v1.md a fenced ts block holding ''export const x = "ONE";\n'' (the file unchanged)'
              when: "processed"
              then: 'outcome a status "failed", acceptanceLog ''red: export const x = "ONE";\n''; retryContexts {a: {acceptanceOutput: ''red: export const x = "ONE";\n'', previousDiff: ""}} (the acceptance ran on an attempt that changed nothing: the empty diff, not null)'
        - name: Build Retry
          description: The retry card <base>.r<n> carrying the acceptance command, its output and the previous attempt diff, or the word that the answer was discarded unread; at most 2 retries per card; a run-wide cap on retry batches is enforced by Run Deck.
          behavior: >
            buildRetry(card, attempt, acceptanceOutput, previousDiff) returns a NEW Card.
            attempt must be 1 or 2, else it throws Error "buildRetry: attempt must be 1 or
            2". The base id is card.customId with a trailing ".r<digits>" removed; the new
            customId is "<base>.r<attempt>". intent, targets, contextSlice, acceptance,
            model, maxTokens, reasoning and variants are copied from `card`; dependsOn is
            []. previousDiff null means the acceptance never ran (the answer was discarded
            unread, the card did not compile or its inputs went stale); a string, ""
            included, means it ran. instruction = card.instruction + "\n\n<acceptance_output>\n"
            + header + "\n" + acceptanceOutput + "\n</acceptance_output>\n" + closing, where
            it ran → header "A previous attempt failed its acceptance check (`" +
            (card.acceptance ?? "") + "`):" and closing "Please fix the issues and produce the
            complete corrected file."; previousDiff null → header "A previous attempt was
            discarded before acceptance could run:" and closing "Produce the complete file
            again, from the context given above.". When previousDiff is a non-empty string,
            + "\n\n<previous_attempt_diff>\nYour previous attempt changed the file like this
            (unified diff):\n" + previousDiff + "\n</previous_attempt_diff>\nThe diff above is
            YOUR OWN previous edit, not a proposed change: correct it where it went wrong
            rather than rewriting the file from scratch."
          steps:
            - reads: Card
            - produces: Card
          examples:
            - given: 'card {customId: "c", instruction: "Write c.", acceptance: "grep -q MARK src/c.ts"}; attempt 1; acceptanceOutput "exit 1\n"; previousDiff "@@ -1,1 +1,1 @@\n-old\n+new"'
              when: "built"
              then: 'customId "c.r1"; dependsOn []; instruction contains "A previous attempt failed its acceptance check (`grep -q MARK src/c.ts`):\nexit 1\n" and "Your previous attempt changed the file like this (unified diff):\n@@ -1,1 +1,1 @@"; targets/contextSlice/acceptance/variants copied'
            - given: 'card {customId: "c.r1", instruction: "Write c."}; attempt 2; acceptanceOutput "still red"; previousDiff null'
              when: "built"
              then: 'customId "c.r2" (the trailing .r1 stripped from the base); instruction ends with "A previous attempt was discarded before acceptance could run:\nstill red\n</acceptance_output>\nProduce the complete file again, from the context given above." and has no "<previous_attempt_diff>" section'
            - given: 'any card; attempt 3'
              when: "built"
              then: 'throws Error "buildRetry: attempt must be 1 or 2"'
            - given: 'card {customId: "c", instruction: "Write c.", acceptance: "grep -q MARK src/c.ts"}; attempt 1; acceptanceOutput "red\n"; previousDiff "@@ -1,1 +1,1 @@\n-a\n+b\n"'
              when: "built"
              then: 'instruction is exactly "Write c.\n\n<acceptance_output>\nA previous attempt failed its acceptance check (`grep -q MARK src/c.ts`):\nred\n\n</acceptance_output>\nPlease fix the issues and produce the complete corrected file.\n\n<previous_attempt_diff>\nYour previous attempt changed the file like this (unified diff):\n@@ -1,1 +1,1 @@\n-a\n+b\n\n</previous_attempt_diff>\nThe diff above is YOUR OWN previous edit, not a proposed change: correct it where it went wrong rather than rewriting the file from scratch."'
            - given: 'the card of example 4; attempt 1; acceptanceOutput "answer truncated"; previousDiff null'
              when: "built"
              then: 'instruction is exactly "Write c.\n\n<acceptance_output>\nA previous attempt was discarded before acceptance could run:\nanswer truncated\n</acceptance_output>\nProduce the complete file again, from the context given above." (the acceptance command is not named, no diff block)'
            - given: 'the card of example 4; attempt 1; acceptanceOutput "red\n"; previousDiff "" (the acceptance ran on an attempt that changed nothing)'
              when: "built"
              then: 'instruction is exactly "Write c.\n\n<acceptance_output>\nA previous attempt failed its acceptance check (`grep -q MARK src/c.ts`):\nred\n\n</acceptance_output>\nPlease fix the issues and produce the complete corrected file." (no diff block)'
        - name: Run Deck
          description: Generations in order (layerGenerations), budget checked at each generation boundary (maxCards, maxRetryBatches, deadline), the Run Report produced at the end.
          behavior: >
            runDeck(input, deps) runs input.deck generation by generation in the order of
            layerGenerations(input.deck). At each generation boundary it checks the budget:
            deps.now() >= input.budget.deadline → every not-yet-done card of this and the
            later generations becomes {status: "budget-exceeded", reason "deadline"};
            cardsProcessed >= input.budget.maxCards → reason "maxCards <maxCards>". Otherwise
            it resolves the runnable cards (resolveRunnable with the statuses so far),
            records the skipped outcomes, runs processGeneration on the runnable cards,
            accumulates their usage and request rows, keeps the Retry Context of every failed
            card (by its original id; a later round's context replaces an earlier one), and
            adds the runnable count to cardsProcessed. A card that failed is retried: for
            the failed cards of a round, while retryBatches < input.budget.maxRetryBatches
            and the card has been retried fewer than 2 times, a retry batch runs
            (retryBatches += 1): buildRetry(original card, retryNumber, the card's latest
            Retry Context acceptanceOutput, its previousDiff) for each — so the retry
            carries the output and the diff of the same failed attempt — processGeneration
            on the retries, and a retry that is written updates the card's outcome (status
            "written", its commit, attempts = the retry number + 1) while every attempt's
            log is appended to earlierFailures. At the end it builds the Run Report: runId,
            completedAt = deps.now(), branch = input.branch, processor = deps.config.id,
            generations = the generation count, outcomes in deck order, usageTotals
            {inputTokens, outputTokens summed; cost the sum of the reported costs or null
            when none was reported; requests = the number of usage rows}, requests = every
            Request Usage row of every processGeneration call of the run, in send order.
            Returns {report, outcomes}. It writes and commits nothing: the archive is P6
            git's.
          steps:
            - calls: Resolve Runnable
            - calls: Process Generation
            - calls: Build Retry
            - reads: Retry Context
            - produces: Run Report
          examples:
            - given: 'a two-generation deck [a, then b dependsOn a] on the stub (answers that satisfy each acceptance); budget wide; now constant'
              when: "run"
              then: 'report.generations 2; outcomes a and b both "written" with a commit each; usageTotals.requests 2; the commit hook fired for a then b'
            - given: 'a one-card deck on the stub whose acceptance fails the first attempt and passes the second (a marker file the rollback keeps); budget maxRetryBatches 1'
              when: "run"
              then: 'the card ends "written", attempts 2, earlierFailures length 1; retryBatches reached 1'
            - given: 'a two-generation deck [a, then b dependsOn a] on the stub; deps.now returns a value below the deadline at the first boundary and a value at or past it at the second'
              when: "run"
              then: 'a "written"; b "budget-exceeded", reason "deadline"; report.generations 2'
            - given: 'an openrouter config {id "glm", model "z-ai/glm-5.3", apiKey "k", baseUrl "https://openrouter.ai/api/v1", concurrency 1, maxRetries 0} over a fakeFetch whose route "https://openrouter.ai/api/v1/chat/completions" always answers {id: "gen-1", provider: "Novita", choices: [{message: {role: "assistant", content: a fenced ts block holding ''export const x = "MARK";\n''}, finish_reason: "stop"}], usage: {prompt_tokens: 100, completion_tokens: 20, cost: 0.001}}; a one-card deck a → out/a.ts (absent), variants 1, acceptance ''if [ -f seen ]; then grep -q MARK out/a.ts; else touch seen; echo first-red; exit 1; fi''; budget maxRetryBatches 1'
              when: "run"
              then: 'a "written", attempts 2, earlierFailures ["first-red\n"]; two fetch calls; the last message of the second call''s body contains "A previous attempt failed its acceptance check (`if [ -f seen ]; then grep -q MARK out/a.ts; else touch seen; echo first-red; exit 1; fi`):\nfirst-red\n\n</acceptance_output>" and "<previous_attempt_diff>\nYour previous attempt changed the file like this (unified diff):\n--- /dev/null\n+++ b/out/a.ts\n@@ -0,0 +1,1 @@\n+export const x = \"MARK\";\n\n</previous_attempt_diff>", the first call''s holds no "<acceptance_output>"; report.requests [{customId: "a.v1", model: "z-ai/glm-5.3", provider: "Novita", generationId: "gen-1", inputTokens: 100, outputTokens: 20, cost: 0.001, finishReason: "stop", error: null}, the same row with customId "a.r1.v1"]; usageTotals {inputTokens: 200, outputTokens: 40, cost: 0.002, requests: 2}'
            - given: 'a two-generation deck [a, then b dependsOn a] on the stub, both accepted at once'
              when: "run"
              then: 'report.requests [{customId: "a.v1", model: "stub", provider: "stub", generationId: "stub-a.v1", inputTokens: 0, outputTokens: 0, cost: 0, finishReason: "stop", error: null}, the same with customId "b.v1" and generationId "stub-b.v1"] (rows of both generations, in send order)'
      dataObjects:
        - name: Card Outcome
          description: How one card ended in a run.
          schema: "{ customId: string, status: 'written'|'failed'|'skipped'|'budget-exceeded', reason: string | null, attempts: number, winningVariant: string | null, acceptanceLog: string, earlierFailures: string[], commit: string | null, diffstat: { files: number, insertions: number, deletions: number } | null }"
        - name: Run Report
          description: The summary of one run (its schema and archive layout are runloop's; the file write and commit are P6 git's).
          schema: "{ runId: string, completedAt: number, branch: string, processor: string, generations: number, outcomes: CardOutcome[], usageTotals: { inputTokens: number, outputTokens: number, cost: number | null, requests: number }, requests?: RequestUsage[] } — requests is always set by Run Deck; it is optional in the type so a report literal built elsewhere stays valid"
        - name: Request Usage
          description: One request a run sent, as the processor answered it (one row per variant, retries included).
          schema: "{ customId: string, model: string, provider: string | null, generationId: string | null, inputTokens: number, outputTokens: number, cost: number | null, finishReason: string | null, error: string | null }"
        - name: Retry Context
          description: What the retry of a failed card is told — the acceptance output and the diff of the same failed attempt.
          schema: "{ acceptanceOutput: string, previousDiff: string | null } — previousDiff is the diff of an attempt whose acceptance ran (\"\" when it changed nothing), null when no acceptance ran"

    # ---------------------------------------------------------------- P6
    - name: git
      description: >
        The run's git side: src/git/*.ts over the git CLI. Opens the run branch, commits one
        accepted card's targets with Morph trailers and returns its sha and diffstat (the
        commit hook runloop fires), and writes and commits the run archive
        .morph/runs/<runId>/{deck.json, report.json}. Every git call is a synchronous child
        process with cwd = the repo root and an environment given whole as a parameter
        (never process.env), so a test pins the author, the committer, HOME and the locale
        and never depends on the host's git config. Expected refusals (a dirty tree, an
        existing branch or archive) are results; a failing git command is a thrown Error
        naming the subcommand, its exit and git's first stderr line.
      language: typescript
      requirements: [Deterministic Core]
      guardrails: [No Shell Outside Acceptance]
      functions:
        - name: Run Git
          description: One synchronous git call with an explicit environment; the only spawner of the Component.
          behavior: >
            runGit(root, args, env) spawns `git` with args, cwd = root, env = the given env with
            LC_ALL=C and GIT_TERMINAL_PROMPT=0 laid over it (nothing of the parent process is
            inherited), synchronously, stdout and stderr captured as UTF-8 text. Returns Git
            Result {code: the exit status (null when killed or not started), stdout, stderr};
            a spawn failure gives code null and stderr "git could not start: <message>". It
            never throws. gitOk(root, args, env) runs runGit and returns stdout when code is 0;
            otherwise it throws Error("git <args[0]> failed (exit <code>): <first line of the
            trimmed stderr>").
          steps:
            - produces: Git Result
          examples:
            - given: 'a fresh repo (tmpRepo, branch main); env {PATH, HOME: the repo root, GIT_CONFIG_NOSYSTEM: "1", GIT_AUTHOR_NAME: "Ada", GIT_AUTHOR_EMAIL: "ada@example.invalid", GIT_COMMITTER_NAME: "Ada", GIT_COMMITTER_EMAIL: "ada@example.invalid"}; args ["rev-parse", "--abbrev-ref", "HEAD"]'
              when: "runGit"
              then: '{code: 0, stdout: "main\n", stderr: ""}'
            - given: 'the same repo and env plus FOO "bar" and LC_ALL "de_DE.UTF-8"; args ["-c", "alias.envs=!echo \"$LC_ALL $GIT_TERMINAL_PROMPT $FOO ${USER-unset}\"", "envs"]'
              when: "runGit"
              then: '{code: 0, stdout: "C 0 bar unset\n", stderr: ""} — LC_ALL and GIT_TERMINAL_PROMPT forced, the given env passed, nothing of the parent environment (USER) leaks'
            - given: 'the same repo and env; args ["checkout", "nope"]'
              when: "runGit, then gitOk"
              then: 'runGit gives code 1, stdout "", stderr beginning "error: pathspec ''nope'' did not match"; gitOk throws an Error whose message begins "git checkout failed (exit 1): error: pathspec ''nope'' did not match"'
        - name: Open Run Branch
          description: morph/<runId> from HEAD; refuses a dirty tree outside .morph/ and an existing branch.
          behavior: >
            openRunBranch(root, runId, env): runId must match ^[A-Za-z0-9._-]+$, else
            {ok: false, error: "invalid runId: <runId>"} and no git call. Then `git status
            --porcelain --untracked-files=all`: every entry's path (the text after the
            two status letters and a space; for a rename the path after " -> ") that does
            not start with ".morph/" is dirty; any dirty path → {ok: false, error: "dirty tree
            outside .morph/: <dirty paths sorted, joined by ", ">"}. Then base = `git rev-parse
            HEAD` (trimmed); a branch refs/heads/morph/<runId> that already exists → {ok: false,
            error: "branch morph/<runId> already exists"}; else `git checkout -q -b
            morph/<runId>` and {ok: true, branch: "morph/<runId>", base}. A refusal leaves the
            checkout and the refs as they were.
          steps:
            - calls: Run Git
            - produces: Branch Result
          examples:
            - given: 'a fresh repo on main whose HEAD is <h>; runId "r1"'
              when: "opened"
              then: '{ok: true, branch: "morph/r1", base: <h>} (40 hex chars); `git rev-parse --abbrev-ref HEAD` now reads "morph/r1"'
            - given: 'a fresh repo with the untracked files .morph/deck.json and .morph/runs/x/report.json; runId "r2"'
              when: "opened"
              then: '{ok: true, branch: "morph/r2", base: <h>} — files under .morph/ do not make the tree dirty'
            - given: 'a repo with README.md committed and then modified, and an untracked src/a.ts; runId "r3"'
              when: "opened"
              then: '{ok: false, error: "dirty tree outside .morph/: README.md, src/a.ts"}; the checkout is still main and no branch morph/r3 exists'
            - given: 'a fresh repo where the branch morph/r4 already exists (git branch morph/r4); runId "r4"; then runId "a b"'
              when: "opened"
              then: '{ok: false, error: "branch morph/r4 already exists"}, the checkout still main; then {ok: false, error: "invalid runId: a b"}'
        - name: Commit Paths
          description: Stages exactly the given paths and commits them with a subject and trailers; null when nothing changed.
          behavior: >
            commitPaths(root, paths, subject, trailers, env): `git add -A -- <paths>`; `git diff
            --cached --name-only -- <paths>` empty → null, no commit. Else `git commit -q -m
            <subject> -m <trailer block> -- <paths>`, the trailer block being one "<key>: <value>"
            line per trailer in the given order joined by "\n" (hooks run; nothing is bypassed),
            so the message is "<subject>\n\n<trailer lines>". Only the paths are committed: a
            file staged by hand or modified outside them stays as it was. Then commit = `git
            rev-parse HEAD` (trimmed) and the diffstat from `git show --numstat --format=
            <commit>`: files = the number of non-empty lines, insertions and deletions the sums
            of the first two columns ("-" for a binary file counts 0). Returns Commit Info.
          steps:
            - calls: Run Git
            - produces: Commit Info
          examples:
            - given: 'a fresh repo; other.txt written and staged by hand (git add other.txt); notes.txt untracked; src/a.ts written "export const a = 1;\n"; paths ["src/a.ts"], subject "s", trailers [["K", "v"]]'
              when: "committed"
              then: 'Commit Info {commit: HEAD (40 hex), diffstat {files: 1, insertions: 1, deletions: 0}}; the HEAD message is "s\n\nK: v"; `git show --name-only --format= HEAD` lists only src/a.ts; other.txt is still staged (`git diff --cached --name-only` reads "other.txt") and notes.txt still untracked'
            - given: 'a repo where src/a.ts is committed with "export const a = 1;\n" and is unchanged; paths ["src/a.ts"]'
              when: "committed"
              then: 'null; HEAD is the commit it was before'
        - name: Commit Card
          description: >
            Stages exactly the card's targets; subject 'morph <id>: <targets>'; trailers Morph-Card, Morph-Model, Morph-Variant (if given), Morph-Acceptance-Exit; returns sha and diffstat, or null when nothing changed. makeCommitHook binds it into runloop's commit hook.
          behavior: >
            commitCard(root, {customId, targets, model, variant, acceptanceExit}, env) is
            Commit Paths over targets with subject "morph <customId>: <targets joined by ",
            ">" and trailers Morph-Card <customId>, Morph-Model <model>, Morph-Variant
            <variant> only when variant is not null, Morph-Acceptance-Exit <acceptanceExit>, in
            that order. makeCommitHook(root, model, env) returns (customId, targets) =>
            commitCard(root, {customId, targets, model, variant: null, acceptanceExit: 0}, env):
            runloop fires its hook only for an accepted card (exit 0) and does not pass the
            winning variant, so the hook writes no Morph-Variant.
          steps:
            - calls: Commit Paths
            - produces: Commit Info
          examples:
            - given: 'a repo on morph/r1; src/a.ts written "export const a = 1;\n" (new) and src/b.ts written "export const b = 2;\nexport const c = 3;\n" (new); customId "a", targets ["src/a.ts", "src/b.ts"], model "glm53", variant null, acceptanceExit 0'
              when: "committed"
              then: '{commit: HEAD (40 hex), diffstat {files: 2, insertions: 3, deletions: 0}}; the HEAD message is "morph a: src/a.ts, src/b.ts\n\nMorph-Card: a\nMorph-Model: glm53\nMorph-Acceptance-Exit: 0"; `git log -1 --format=%(trailers:key=Morph-Card,valueonly)` reads "a"'
            - given: 'a repo where src/a.ts is committed with "export const a = 1;\n"; then src/a.ts rewritten "export const a = 2;\nexport const z = 0;\n"; customId "c", targets ["src/a.ts"], model "glm53", variant "c.v2", acceptanceExit 0'
              when: "committed"
              then: 'diffstat {files: 1, insertions: 2, deletions: 1}; the HEAD message is "morph c: src/a.ts\n\nMorph-Card: c\nMorph-Model: glm53\nMorph-Variant: c.v2\nMorph-Acceptance-Exit: 0"'
            - given: 'a fresh repo; hook = makeCommitHook(root, "stub", env); out/h.ts written "x\n"; then the hook called again with nothing changed'
              when: 'hook("h", ["out/h.ts"]), then hook("h", ["out/h.ts"])'
              then: 'first {commit: HEAD, diffstat {files: 1, insertions: 1, deletions: 0}} with the HEAD message "morph h: out/h.ts\n\nMorph-Card: h\nMorph-Model: stub\nMorph-Acceptance-Exit: 0"; second null and HEAD unchanged'
        - name: Archive Run
          description: Writes .morph/runs/<runId>/{deck.json, report.json} and commits them with Morph-Run trailers; append-only.
          behavior: >
            archiveRun(root, {runId, deck, report}, env): runId must match ^[A-Za-z0-9._-]+$,
            else {ok: false, error: "invalid runId: <runId>"}. dir = ".morph/runs/<runId>"; an
            existing root/dir → {ok: false, error: "archive <dir> already exists"}, nothing
            written (a run id names one run forever). Else mkdir -p, write <dir>/deck.json =
            JSON.stringify(deck.cards, null, 2) + "\n" (the Deck File form, a JSON array of
            cards) and <dir>/report.json = JSON.stringify(report, null, 2) + "\n", then Commit
            Paths over [<dir>/deck.json, <dir>/report.json] with subject "morph run <runId>:
            deck and report" and trailers Morph-Run <runId>, Morph-Cards <deck.cards.length>,
            Morph-Written, Morph-Failed, Morph-Skipped, Morph-Budget-Exceeded (the number of
            report.outcomes with that status). → {ok: true, dir, commit: the sha, or null when
            Commit Paths returned null}. A git failure of the commit (an ignored .morph/ makes
            git add refuse) → {ok: false, error: "archive <dir> written but not committed: <the
            Error's message>"}; the files stay on disk.
          steps:
            - reads: Deck
            - reads: Run Report
            - calls: Commit Paths
            - produces: Archive Result
          examples:
            - given: 'a repo on morph/r1; deck {cards: [card a, card b], externalDependsOn: []}; report {runId: "r1", …, outcomes: [a written, b failed]}; runId "r1"'
              when: "archived"
              then: '{ok: true, dir: ".morph/runs/r1", commit: HEAD}; deck.json reads JSON.stringify([a, b], null, 2) + "\n"; report.json reads JSON.stringify(report, null, 2) + "\n"; the HEAD message is "morph run r1: deck and report\n\nMorph-Run: r1\nMorph-Cards: 2\nMorph-Written: 1\nMorph-Failed: 1\nMorph-Skipped: 0\nMorph-Budget-Exceeded: 0"; the commit lists exactly .morph/runs/r1/deck.json and .morph/runs/r1/report.json'
            - given: 'the repo after example 1; the same input again'
              when: "archived"
              then: '{ok: false, error: "archive .morph/runs/r1 already exists"}; HEAD unchanged; deck.json unchanged'
            - given: 'a repo whose committed .gitignore holds ".morph/"; runId "r2"'
              when: "archived"
              then: '{ok: false, error beginning "archive .morph/runs/r2 written but not committed: git add failed (exit 1): "}; .morph/runs/r2/deck.json and report.json exist on disk; HEAD unchanged'
      dataObjects:
        - name: Git Result
          description: What one git call returned.
          schema: "{ code: number | null, stdout: string, stderr: string }"
        - name: Branch Result
          description: The run branch opened, or the refusal.
          schema: "{ ok: true, branch: string, base: string } | { ok: false, error: string }"
        - name: Commit Info
          description: One commit and what it changed; structurally runloop's CommitInfo, so makeCommitHook is a CommitHook.
          schema: "{ commit: string, diffstat: { files: number, insertions: number, deletions: number } }"
        - name: Archive Result
          description: The archive written and committed, or the refusal.
          schema: "{ ok: true, dir: string, commit: string | null } | { ok: false, error: string }"

    # ---------------------------------------------------------------- P7
    - name: cli
      description: >
        The `morph` binary: src/cli/*.ts plus the entry src/cli.ts (package.json bin
        dist/cli.js). Parses argv, dispatches, prints exactly one JSON document on stdout
        and one log line on stderr, maps every outcome to an exit code. Only the entry
        touches the process: it hands main() the environment, the working directory, the
        clock and the two output streams as parameters, so every command is testable in
        process and the processor registry (Read Registry) is the only reader of the
        environment it was given. Three commands exist now, those whose modules exist:
        `deck check` (cards), `run` (runloop + processor + git: open the run branch, run
        the deck with git's commit hook, archive the run) and `plan` (contour + planner: the
        record and the map cut into a deck file, P10a). The commands of later phases
        (scout, primer, review, report, deck add|status|reset|clear) answer a fixed
        NotYetError. The milestone is an end-to-end run of the built binary on the stub
        processor inside vitest, in a tmp repo, with no network.
      language: typescript
      requirements: [One Document Out]
      functions:
        - name: Parse Command
          description: argv into one Command or a usage error; global --root and --pretty anywhere.
          behavior: >
            parseCommand(argv) scans argv left to right. A token starting with "--" is a
            flag: --pretty and --judge take no value; --root, --deck, --processor, --run-id,
            --deadline, --max-cards, --max-retry-batches, --slice-cap-bytes, --spec,
            --component, --map, --out take the next token whatever it is; any other flag
            (also --x=y) → "unknown flag: <t>"; a value flag as the last token → "flag <t>
            needs a value"; a flag seen twice → "flag <t> given twice", except --component,
            which repeats and keeps every value in argv order (the first such error in argv
            order wins). Every other token is a word. Then the command from the words: none
            → "no command (commands: deck check, plan, run)"; "run" → run; "plan" → plan;
            "deck" "check" → deck check; a first word scout, primer, review or report →
            NotYetError "command <word> is not available yet";
            "deck" followed by add, status, reset or clear → NotYetError "command deck <w>
            is not available yet"; anything else → "unknown command: <words joined by a
            space>". More words than the command takes → "unexpected argument: <first
            extra>". Then, in this order: a flag the command does not take → "flag <f> does
            not apply to <command>" (deck check takes --root, --pretty, --deck,
            --slice-cap-bytes; run takes --root, --pretty, --deck, --processor, --run-id,
            --deadline, --max-cards, --max-retry-batches; plan takes --root, --pretty,
            --spec, --component, --map, --judge, --out), in argv order; plan without --spec →
            "missing --spec", else plan is done: {name: "plan", root, pretty, spec,
            components: the --component values ([] when none), map: the value or null, judge:
            --judge given, out: the value or null}; no --deck → "missing --deck"; run without
            --processor → "missing --processor"; for run a
            --run-id not matching ^[A-Za-z0-9._-]+$ → "--run-id must match
            ^[A-Za-z0-9._-]+$ (got '<v>')"; numbers in the order --slice-cap-bytes (deck
            check), --deadline, --max-cards, --max-retry-batches (run): digits only, ≥ 1
            ("<f> must be a positive integer (got '<v>')"), --max-retry-batches ≥ 0 ("must
            be a non-negative integer"). Every failure is {ok: false, error: {error: {code:
            4, kind: "UsageError" | "NotYetError", message}}}. Defaults: root ".", pretty
            false, sliceCapBytes 500000, runId null, deadlineSeconds 2400, maxCards null
            (= the deck's card count), maxRetryBatches 2.
          steps:
            - produces: Command
          examples:
            - given: 'argv ["deck", "check", "--deck", "d.json"]'
              when: "parsed"
              then: '{ok: true, command: {name: "deck check", root: ".", pretty: false, deck: "d.json", sliceCapBytes: 500000}}'
            - given: 'argv ["--pretty", "run", "--deck", "d.json", "--processor", "s", "--root", "/r", "--run-id", "r1", "--deadline", "60", "--max-cards", "3", "--max-retry-batches", "0"]'
              when: "parsed"
              then: '{ok: true, command: {name: "run", root: "/r", pretty: true, deck: "d.json", processor: "s", runId: "r1", deadlineSeconds: 60, maxCards: 3, maxRetryBatches: 0}}'
            - given: 'argv ["frobnicate"]'
              when: "parsed"
              then: '{ok: false, error: {error: {code: 4, kind: "UsageError", message: "unknown command: frobnicate"}}}'
            - given: 'argv ["scout"], then ["deck", "status"]'
              when: "parsed"
              then: 'NotYetError (code 4) "command scout is not available yet", then NotYetError "command deck status is not available yet"'
            - given: 'argv ["run", "--deck", "d.json"]'
              when: "parsed"
              then: 'UsageError "missing --processor"'
            - given: 'argv ["deck", "check", "--deck", "d.json", "--processor", "s"]'
              when: "parsed"
              then: 'UsageError "flag --processor does not apply to deck check"'
            - given: 'argv ["run", "--deck", "d", "--processor", "s", "--deadline", "0"]'
              when: "parsed"
              then: 'UsageError "--deadline must be a positive integer (got ''0'')"'
            - given: 'argv ["--root"], then []'
              when: "parsed"
              then: 'UsageError "flag --root needs a value", then UsageError "no command (commands: deck check, plan, run)"'
            - given: 'argv ["plan", "--spec", "c.yaml", "--component", "a", "--map", "m.json", "--component", "b", "--judge", "--out", "d.json", "--pretty"]'
              when: "parsed"
              then: '{ok: true, command: {name: "plan", root: ".", pretty: true, spec: "c.yaml", components: ["a", "b"], map: "m.json", judge: true, out: "d.json"}}'
            - given: 'argv ["plan", "--root", "/r", "--spec", "c.yaml"]'
              when: "parsed"
              then: '{ok: true, command: {name: "plan", root: "/r", pretty: false, spec: "c.yaml", components: [], map: null, judge: false, out: null}}'
            - given: 'argv ["plan", "--component", "a"]; then ["plan", "--spec", "c", "--judge", "--judge"]; then ["run", "--deck", "d", "--processor", "s", "--judge"]'
              when: "parsed"
              then: 'UsageError "missing --spec"; then "flag --judge given twice"; then "flag --judge does not apply to run"'
        - name: Emit Document
          description: One JSON document + newline on stdout; --pretty indents by 2.
          behavior: >
            renderDocument(doc, pretty) = JSON.stringify(doc, null, 2 when pretty) + "\n".
            errorDocument(code, kind, message) = {error: {code, kind, message}}, keys in that
            order. main writes exactly one rendered document to stdout per invocation and
            nothing else; the human log goes to stderr.
          steps:
            - produces: Error Document
          examples:
            - given: 'doc {a: 1, b: [true, null]}, pretty false'
              when: "rendered"
              then: '"{\"a\":1,\"b\":[true,null]}\n"'
            - given: 'the same doc, pretty true'
              when: "rendered"
              then: '"{\n  \"a\": 1,\n  \"b\": [\n    true,\n    null\n  ]\n}\n"'
            - given: 'errorDocument(4, "UsageError", "unknown command: x")'
              when: "rendered compact"
              then: '"{\"error\":{\"code\":4,\"kind\":\"UsageError\",\"message\":\"unknown command: x\"}}\n"'
        - name: Classify Error
          description: >
            Exit codes: 0 ok; 1 a run with any card not written; 2 a refusal before any
            spend (invalid deck, hazard errors, dirty tree, existing branch); 3 a fault
            thrown once a command is under way (a failing git command, an archive not
            committed, I/O); 4 a usage error (bad flag, unknown or not-yet command, missing
            file, unconfigured processor). Error document {"error": {"code", "kind", "message"}}.
          behavior: >
            classifyThrown(e) → {code: 3, document: errorDocument(3, "RuntimeError", e's
            message when e is an Error, else String(e))}. runExitCode(report, archive) → 3
            when the archive is not ok; else 1 when any outcome's status is not "written";
            else 0. Kinds: UsageError and NotYetError (4), DeckError and RefusalError (2),
            RuntimeError (3).
          steps:
            - produces: Command Result
          examples:
            - given: 'new Error("git add failed (exit 1): fatal: x")'
              when: "classifyThrown"
              then: '{code: 3, document: {error: {code: 3, kind: "RuntimeError", message: "git add failed (exit 1): fatal: x"}}}'
            - given: 'the string "boom"'
              when: "classifyThrown"
              then: '{code: 3, document: {error: {code: 3, kind: "RuntimeError", message: "boom"}}}'
            - given: 'reports with outcomes [written, written] and [written, skipped], archive ok; then [written] with archive {ok: false}'
              when: "runExitCode"
              then: '0, 1, 3'
        - name: Read Deck File
          description: The deck file a command names, resolved against the root, loaded by Load Deck.
          behavior: >
            readDeckFile(root, deckPath): abs = path.resolve(root, deckPath) (an absolute
            deckPath ignores root). Not a regular file → {ok: false, result: {code: 4,
            document: errorDocument(4, "UsageError", "deck file not found: <deckPath as
            given>")}}. Else Load Deck on its UTF-8 text; faults → {ok: false, result:
            {code: 2, document: errorDocument(2, "DeckError", "invalid deck: " + each fault
            as "<key>: <message>" joined by "; ")}}. Else {ok: true, deck}.
          steps:
            - reads: Deck
            - produces: Command Result
          examples:
            - given: 'a tmp root with d.json = the deck of the tiny fixture'
              ref: "tests/fixtures/decks/tiny.json (one card a → src/a.ts)"
              when: 'readDeckFile(root, "d.json")'
              then: '{ok: true, deck: {cards: [card a with every default filled], externalDependsOn: []}}'
            - given: 'a tmp root without nope.json'
              when: 'readDeckFile(root, "nope.json")'
              then: '{ok: false, result: {code: 4, document: {error: {code: 4, kind: "UsageError", message: "deck file not found: nope.json"}}}}'
            - given: 'c.json = the cycle fixture; dup.json = the duplicate fixture'
              ref: "tests/fixtures/decks/cycle.json, tests/fixtures/decks/duplicate.json"
              when: "read"
              then: 'code 2, kind "DeckError", message "invalid deck: dependsOn: dependsOn cycle a -> b -> a"; then "invalid deck: cards[2].customId: duplicate customId b"'
        - name: Deck Check
          description: "`morph deck check`: generations, hazards and slice weights of a deck file; exit 2 on any error hazard."
          behavior: >
            deckCheckCommand(root, deckPath, sliceCapBytes): Read Deck File (its failure is
            the result); weighing = Weigh Slices(deck, root, sliceCapBytes); hazards = Find
            Hazards(deck) followed by the weighing's hazards; document {deck: deckPath as
            given, cards: the card count, generations: Layer Generations(deck), errors and
            warnings: the hazards of severity error / warning counted, hazards, weights:
            the weighing's weights}, keys in that order; code 2 when errors > 0, else 0.
          steps:
            - calls: Read Deck File
            - uses: cards
            - produces: Deck Check Document
          examples:
            - given: 'a tmp root holding only d.json = the write-write fixture (a and b both write src/x.ts)'
              ref: "tests/fixtures/decks/hazardsWriteWrite.json"
              when: 'deckCheckCommand(root, "d.json", 500000)'
              then: 'code 2; document {deck: "d.json", cards: 2, generations: [["a", "b"]], errors: 1, warnings: 0, hazards: [{kind: "write-write", severity: "error", cards: ["a", "b"], path: "src/x.ts", repair: null}], weights: [{card: "a", bytes: 0, missing: ["docs/a.md", "src/x.ts"]}, {card: "b", bytes: 0, missing: ["docs/b.md", "src/x.ts"]}]}'
            - given: 'd.json = the tiny fixture and src/a.ts = "export const a = 1;\n" (20 bytes)'
              ref: "tests/fixtures/decks/tiny.json"
              when: 'deckCheckCommand(root, "d.json", 500000)'
              then: 'code 0; errors 0, warnings 1, hazards [{kind: "implicit-read", severity: "warning", cards: ["a"], path: null, repair: null}], weights [{card: "a", bytes: 20, missing: []}]'
            - given: 'the same tree, sliceCapBytes 10'
              when: "checked"
              then: 'code 0; warnings 2; hazards [the implicit-read, then {kind: "oversized-slice", severity: "warning", cards: ["a"], path: null, repair: null, bytes: 20, cap: 10}]'
        - name: Run Command
          description: "`morph run`: processor, deck, hazards, run branch, Run Deck with git's commit hook, archive; one Run Document."
          behavior: >
            runCommand(root, args, deps), every check before any git call or spend, in this
            order. 1. readRegistry(deps.env); no config with id args.processor → code 4
            UsageError "processor <id> is not configured", plus ": " and the messages of the
            registry faults whose key starts with "MORPH_PROCESSOR_<id>_" joined by "; " when
            there are any. 2. Read Deck File (its failure is the result). 3. Find Hazards
            errors → code 2 RefusalError "deck has <n> hazard error(s): " + each as "<kind>
            <cards joined by ",">[ <path>]" joined by "; ". 4. start = deps.now() (the only
            call of runCommand itself); runId = args.runId, or mintRunId(start) = the UTC
            time of start as "YYYYMMDD-HHMMSS". 5. Open Run Branch(root, runId, deps.env);
            a refusal → code 2 RefusalError with its error. 6. Run Deck with input {root,
            runId, branch, deck, budget {maxCards: args.maxCards or the card count,
            maxRetryBatches, deadline: start + deadlineSeconds × 1000}} and deps {config,
            transport: deps.transport or realTransport(config.timeoutMs), commit:
            makeCommitHook(root, config.model, deps.env), now: deps.now, env: deps.env}.
            7. Archive Run(root, {runId, deck, report}, deps.env). → {code: runExitCode(report,
            archive), document: {runId, branch, base, report, archive}}. A thrown Error (a git
            command failing, I/O) propagates to main. The checkout stays on the run branch.
          steps:
            - uses: processor
            - calls: Read Deck File
            - uses: git
            - uses: runloop
            - produces: Run Document
          examples:
            - given: 'a tmpRepo; env with an explicit git identity and MORPH_PROCESSOR_s_TYPE stub, MORPH_PROCESSOR_s_ANSWERS_DIR a side tmp root holding a.md and b.md (fenced ts blocks); a deck file in the side root: a → out/a.ts (acceptance "test -f out/a.ts"), b → out/b.ts dependsOn [a]; runId "r1"'
              when: "run"
              then: 'code 0; document runId "r1", branch "morph/r1", base = the HEAD before; outcomes a and b "written", generations 2, processor "s", usageTotals.requests 2; archive {ok: true, dir: ".morph/runs/r1", commit: HEAD}; the subjects since base, newest first: "morph run r1: deck and report", "morph b: out/b.ts", "morph a: out/a.ts"; HEAD on morph/r1; status clean'
            - given: 'the same setup, one card a with acceptance "exit 1", maxRetryBatches 0'
              when: "run"
              then: 'code 1; outcome a "failed", reason "acceptance failed"; archive ok with the trailer Morph-Failed: 1; out/a.ts absent'
            - given: 'the same setup, processor "nope"; then processor "bad" with MORPH_PROCESSOR_bad_TYPE "x" added to env'
              when: "run"
              then: 'code 4 UsageError "processor nope is not configured"; then "processor bad is not configured: MORPH_PROCESSOR_bad_TYPE must be one of openrouter, stub (got ''x'')"; no morph/* branch'
            - given: 'the same setup with an untracked notes.txt in the repo'
              when: "run"
              then: 'code 2 RefusalError "dirty tree outside .morph/: notes.txt"; the checkout still main; no archive'
            - given: 'a deck of a and b both targeting out/x.ts'
              when: "run"
              then: 'code 2 RefusalError "deck has 1 hazard error(s): write-write a,b out/x.ts"; no morph/* branch'
            - given: 'one card a; runId null; deps.now always 1791310149000'
              when: "run"
              then: 'mintRunId(1791310149000) is "20261006-180909"; code 0; runId, report.runId "20261006-180909", branch "morph/20261006-180909"; .morph/runs/20261006-180909/report.json exists'
        - name: Plan Command
          description: "`morph plan --spec`: the record and the map read under the root, cut by Plan Spec, the deck written to --out; one Plan Document."
          behavior: >
            planCommand(root, args), in this order. The spec file path.resolve(root, args.spec)
            not a regular file → code 4 UsageError "spec file not found: <spec as given>"; a map
            given and not a regular file → code 4 UsageError "map file not found: <map as
            given>". Load Spec: loadContour(the spec's UTF-8 text, args.spec), then loadMap(the
            map's text, args.map) when a map is given (none → the empty map {version: 1, package:
            null, language: null, docs: [], groups: [], cards: [], extraCards: []}); an error →
            code 2 DeckError with that error as the message. Plan Spec({record, map, spec:
            args.spec, components: args.components, judge: args.judge, hasFile: a path is a
            regular file under root}); an error → code 2 DeckError with it. When args.out is not
            null the cards are written to path.resolve(root, args.out) as JSON.stringify(cards,
            null, 2) + "\n", parent directories created; that file is a deck `morph run --deck`
            and `morph deck check` read. → {code: 0, document: {spec, components, cards,
            generations, externalDependsOn, out: args.out}}. Nothing else is written; nothing is
            written on an error.
          steps:
            - uses: contour
            - uses: planner
            - produces: Plan Document
          examples:
            - given: 'a tmp root holding ledger.yaml and ledger.map.json (the planner fixtures'' texts) and a tests/helpers.ts; args spec "ledger.yaml", components ["ledger", "store"], map "ledger.map.json", judge true, out "decks/p.json"'
              ref: "tests/fixtures/planner/ledger.yaml, tests/fixtures/planner/ledger.map.json, tests/fixtures/planner/ledger.plan.json"
              when: "planCommand"
              then: 'code 0; document equal to ledger.plan.json plus out "decks/p.json"; the file decks/p.json is exactly JSON.stringify(document.cards, null, 2) + "\n"; Read Deck File of it is ok with 17 cards and externalDependsOn ["outside"]'
            - given: 'the same root; spec "nope.yaml"; then spec "ledger.yaml" with map "m.json"'
              when: "planCommand"
              then: '{code: 4, document: {error: {code: 4, kind: "UsageError", message: "spec file not found: nope.yaml"}}}; then the same with "map file not found: m.json"'
            - given: 'bad.yaml = "System: {}\n" as the spec; then spec ledger.yaml with m.json = "{\"docs\": \"x\"}" as the map'
              when: "planCommand"
              then: 'code 2 DeckError "bad.yaml is not a valid record (3 problems):\nSystem.name: required\nSystem.description: required\nSystem.groups: required"; then code 2 DeckError "m.json is not a valid map (1 problem):\ndocs: must be a list"'
            - given: 'the same root, components ["nope"], out "decks/q.json"'
              when: "planCommand"
              then: "code 2 DeckError \"no Component 'nope' in the record (have: ledger, store)\"; decks/q.json not written"
            - given: 'main(["plan", "--root", <the root>, "--spec", "ledger.yaml", "--component", "store", "--map", "ledger.map.json"]) in process, deps {env: {}, now: () => 0, cwd: "/", transport: null}'
              when: "main"
              then: '0; one stdout chunk, a document with components ["store"], 4 cards, out null; stderr ["morph plan: exit 0\n"]; nothing written under the root'
        - name: Main
          description: Dispatch, one document out, one log line, the exit code; the entry src/cli.ts wires the process.
          behavior: >
            main(argv, deps, io) → Promise<ExitCode>. Parse Command; a failure → io.stdout(
            renderDocument(the error document, pretty = argv holds "--pretty")),
            io.stderr("morph: <message>\n"), return 4. Else root = path.resolve(deps.cwd,
            command.root); result = Deck Check (deck check), Plan Command (plan) or await Run
            Command (run) inside try/catch, a thrown value → classifyThrown. Then exactly one io.stdout(
            renderDocument(result.document, command.pretty)), one io.stderr("morph <command
            name>: exit <code>\n"), return result.code. The entry src/cli.ts (shebang `#!/usr/bin/env
            node`) builds env from process.env without undefined values and calls main(
            process.argv.slice(2), {env, now: Date.now, cwd: process.cwd(), transport: null},
            {stdout, stderr: process streams' write}), then sets process.exitCode to the
            result; it never calls process.exit (a piped stdout would be cut).
          steps:
            - calls: Parse Command
            - calls: Deck Check
            - calls: Plan Command
            - calls: Run Command
            - calls: Emit Document
            - calls: Classify Error
          examples:
            - given: 'argv ["frobnicate"], in process'
              when: "main"
              then: '4; stdout exactly ["{\"error\":{\"code\":4,\"kind\":\"UsageError\",\"message\":\"unknown command: frobnicate\"}}\n"]; stderr ["morph: unknown command: frobnicate\n"]'
            - given: 'a tmp root with d.json = the write-write fixture; argv ["deck", "check", "--deck", "d.json", "--root", <root>, "--pretty"]'
              ref: "tests/fixtures/decks/hazardsWriteWrite.json"
              when: "main"
              then: '2; one stdout chunk beginning "{\n  \"deck\": \"d.json\",\n  \"cards\": 2,"; stderr ["morph deck check: exit 2\n"]'
            - given: 'a run with a valid stub env and deck, --run-id r1, --root and cwd both a tmp root that is not a git repository'
              when: "main"
              then: '3; one document {error: {code: 3, kind: "RuntimeError", message beginning "git status failed (exit 128): "}}; stderr ["morph run: exit 3\n"]'
            - given: 'the binary built by tsc -p tsconfig.build.json into a tmp out dir (with {"type":"module"} and a node_modules link to the repository''s own: the binary imports the package yaml since P10a); a tmpRepo, a side root with answers a.md, b.md and the deck a, then b dependsOn a; `node <out>/cli.js run --root <repo> --deck <deck> --processor s --run-id e2e` with the stub env'
              when: "spawned"
              then: 'exit 0; stdout one line of JSON: runId "e2e", branch "morph/e2e", outcomes written, written, archive ok; the last three subjects "morph run e2e: deck and report", "morph b: out/b.ts", "morph a: out/a.ts"; stderr "morph run: exit 0\n"'
            - given: 'the built binary, argv ["frobnicate"]'
              when: "spawned"
              then: 'exit 4; stdout exactly "{\"error\":{\"code\":4,\"kind\":\"UsageError\",\"message\":\"unknown command: frobnicate\"}}\n"'
      dataObjects:
        - name: Command
          description: One parsed invocation.
          schema: "{ name: 'deck check', root, pretty, deck, sliceCapBytes } | { name: 'run', root, pretty, deck, processor, runId: string | null, deadlineSeconds, maxCards: number | null, maxRetryBatches } | { name: 'plan', root, pretty, spec, components: string[], map: string | null, judge: boolean, out: string | null }"
        - name: Error Document
          description: The document of every non-result exit.
          schema: "{ error: { code: 0|1|2|3|4, kind: 'UsageError'|'NotYetError'|'DeckError'|'RefusalError'|'RuntimeError', message: string } }"
        - name: Command Result
          description: What a command returns to main.
          schema: "{ code: 0|1|2|3|4, document: unknown }"
        - name: Deck Check Document
          description: stdout of deck check.
          schema: "{ deck: string, cards: number, generations: string[][], errors: number, warnings: number, hazards: Hazard[], weights: SliceWeight[] }"
        - name: Plan Document
          description: stdout of plan; the Plan of the planner plus the deck file written.
          schema: "{ spec: string, components: string[], cards: Card[], generations: string[][], externalDependsOn: Record<string, string[]>, out: string | null }"
        - name: Run Document
          description: stdout of run.
          schema: "{ runId: string, branch: string, base: string, report: RunReport, archive: ArchiveResult }"
      interfaces:
        - name: morph CLI
          description: The only entry point.
          exposes: [Parse Command]

    # ---------------------------------------------------------------- P8
    - name: language
      description: >
        Language profiles: src/language/*.ts, pure data and pure functions. A profile says
        what counts as code and as a test in one language, how a Function's name becomes the
        card's file names, and which shell lines check a card (parse, lint, own test, full
        run) — as text, never run here. Two profiles, typescript (the default) and python;
        the python lines (py_compile, ruff, pytest) are data only and nothing in this
        Component needs python installed. The consumers are the planner (P10: a Component's
        profile, its card ids and targets, its judge instruction and acceptance) and later
        primer and scout (which file is a test). Nothing is wired into the cli or the run
        loop in this phase. No clock, no environment, no file system, no child process: the
        only Node module used is node:path (posix).
      language: typescript
      requirements: [Deterministic Core]
      functions:
        - name: Resolve Profile
          description: The profile of a Component — its own language, else the map's, else typescript.
          behavior: >
            resolveProfile(componentLanguage, mapLanguage), both string | null. The choice is
            the component's value unless it is null or "", then the map's unless null or "",
            then "typescript". The key is the choice trimmed and lower-cased; the profile is
            the PROFILES entry whose id equals the key → {ok: true, profile} (the registry
            object itself). No entry → {ok: false, error: "unknown language '<the choice as
            given>' (known: typescript, python)"}, the known ids in PROFILES order. PROFILES
            is the registry, typescript first then python, each profile exactly the content of
            its fixture.
          steps:
            - produces: Profile Result
          examples:
            - given: 'componentLanguage null, mapLanguage null'
              ref: "tests/fixtures/language/typescript.json (the whole typescript profile)"
              when: "resolved"
              then: '{ok: true, profile: the typescript profile, equal to the fixture}'
            - given: 'componentLanguage " Python ", mapLanguage "typescript"'
              ref: "tests/fixtures/language/python.json (the whole python profile)"
              when: "resolved"
              then: '{ok: true, profile: the python profile, equal to the fixture} — the component wins, trimmed and lower-cased'
            - given: 'componentLanguage "", mapLanguage "python"'
              when: "resolved"
              then: '{ok: true, profile} with profile.id "python" — an empty component value falls through to the map'
            - given: 'componentLanguage "go", mapLanguage "python"'
              when: "resolved"
              then: "{ok: false, error: \"unknown language 'go' (known: typescript, python)\"}"
        - name: Fill Template
          description: Replaces every {key} of a profile template with its value, literally, in one pass.
          behavior: >
            fillTemplate(template, values: Record<string, string>) replaces every occurrence of
            "{<key>}" (key = letters only) whose key is an own property of values with that
            value, taken literally ("$&", "$1" are not replacement patterns), in a single pass
            (a value that itself holds "{x}" is not expanded again). A placeholder whose key is
            not in values stays as it is.
          steps:
            - produces: string
          examples:
            - given: 'template "tests/{component}/{name}.test.ts", values {component: "cli", name: "parseCommand"}'
              when: "filled"
              then: '"tests/cli/parseCommand.test.ts"'
            - given: 'template "{a}-{a}-{c}", values {a: "$&"}'
              when: "filled"
              then: '"$&-$&-{c}" — every occurrence, the value literal, an unknown key kept'
            - given: 'template "{a}{b}", values {a: "{b}", b: "x"}'
              when: "filled"
              then: '"{b}x" — one pass, a value is not expanded again'
        - name: Classify Path
          description: Which of a card's paths are code and which is its test, by one profile's rule.
          behavior: >
            A path is normalised first: every "\" becomes "/", then leading "./" prefixes are
            removed. Its extension is path.posix.extname of the normalised path, lower-cased
            (".ts" alone, "Makefile" and "src/.ts" have none). hasExtension(profile, path): the
            extension is one of profile.extensions. isTest(profile, path): a directory part of
            the normalised path (not the base name) is one of profile.testDirs, or the base name
            matches new RegExp(profile.testFilePattern). codeTargets(profile, targets): the
            targets with the extension that are not tests, as given, order kept.
            testTarget(profile, targets): the first target with the extension that is a test,
            as given, else null.
          steps:
            - reads: Language Profile
          examples:
            - given: 'the typescript profile; paths "tests/cli/parse.examples.test.ts", "src/cli/parse.ts", "src/__tests__/x.ts", "src/a.spec.tsx", "src/tests.ts"'
              when: "isTest"
              then: 'true, false, true, true, false — a directory named tests counts, a base name tests.ts does not'
            - given: 'the python profile; paths "tests/conftest.py", "pkg/test_a.py", "pkg/a_test.py", "pkg/testing.py", "tests\a.py"'
              when: "isTest"
              then: 'true, true, true, false, true — the backslash path is normalised'
            - given: 'the typescript profile; targets ["src/a.ts", "tests/a.test.ts", "README.md", "src/b.TSX", "./src/c.ts"]'
              when: "codeTargets, then testTarget"
              then: '["src/a.ts", "src/b.TSX", "./src/c.ts"] (as given, order kept); then "tests/a.test.ts"'
            - given: 'the python profile; targets ["a/b.py", "docs/x.md"]'
              when: "testTarget, then codeTargets"
              then: 'null; then ["a/b.py"]'
        - name: Detect Profile
          description: The profile that claims a path by its extension, or null.
          behavior: >
            profileForPath(path): the first profile in PROFILES order whose extensions hold the
            path's extension (as Classify Path computes it), else null.
          steps:
            - reads: Language Profile
          examples:
            - given: 'paths "src/a.ts", "x/y.PYI", "web/App.tsx"'
              when: "profileForPath"
              then: 'ids "typescript", "python", "typescript"'
            - given: 'paths "README.md", "Makefile", ".ts"'
              when: "profileForPath"
              then: 'null, null, null'
        - name: Name Targets
          description: A Function's card id and its three default file names (code, own test, judge test) by profile.
          behavior: >
            The words of a name: the name lower-cased, split on every run of characters other
            than a-z and 0-9, empty pieces dropped. slugName(name) = the words joined by "-"
            (the card id). caseName(name, nameCase): "camel" = the first word, then every
            further word with its first character upper-cased, joined with nothing; "snake" =
            the words joined by "_". cutTargets(profile, component, functionName): a component
            with no words → {ok: false, error: "no letters or digits in name '<component>'"},
            then the same for the function name; else component and name are cased by
            profile.nameCase and → {ok: true, slug: slugName(functionName), targets: {code,
            test, judge}}, each = Fill Template of profile.codeTarget, testTarget, judgeTarget
            with {component, name}.
          steps:
            - calls: Fill Template
            - produces: Targets Result
          examples:
            - given: 'the typescript profile; component "cli", function "Parse Command"'
              when: "cutTargets"
              then: '{ok: true, slug: "parse-command", targets: {code: "src/cli/parseCommand.ts", test: "tests/cli/parseCommand.test.ts", judge: "tests/cli/parseCommand.examples.test.ts"}}'
            - given: 'the python profile; component "Run Loop", function "Process Generation"'
              when: "cutTargets"
              then: '{ok: true, slug: "process-generation", targets: {code: "run_loop/process_generation.py", test: "tests/test_process_generation.py", judge: "tests/test_process_generation_examples.py"}}'
            - given: 'the typescript profile; component "planner", function "Build HTTP Request (v2)"'
              when: "cutTargets"
              then: '{ok: true, slug: "build-http-request-v2", targets: {code: "src/planner/buildHttpRequestV2.ts", test: "tests/planner/buildHttpRequestV2.test.ts", judge: "tests/planner/buildHttpRequestV2.examples.test.ts"}}'
            - given: 'the typescript profile; component "cli", function "--"; then component " ", function "Parse Command"'
              when: "cutTargets"
              then: "{ok: false, error: \"no letters or digits in name '--'\"}; then {ok: false, error: \"no letters or digits in name ' '\"}"
        - name: Acceptance Lines
          description: The check lines of a card's acceptance by profile — parse, lint, own test, full run.
          behavior: >
            acceptanceLines(profile, targets): own = the targets with the profile's extension
            (code and tests), as given, order kept. When own is not empty: the parse line
            (profile.parseLine, followed by " " + own joined by " " when parseTakesFiles), then
            Fill Template of profile.lintLine with {files: own joined by " "}. When testTarget
            gives a test: Fill Template of profile.ownTestLine with {test}. Always last:
            profile.fullRunLine. The lines are text; nothing is run.
          steps:
            - calls: Classify Path
            - calls: Fill Template
          examples:
            - given: 'the typescript profile; targets ["src/cli/parse.ts"]'
              when: "acceptanceLines"
              then: '["node_modules/.bin/tsc --noEmit", "node_modules/.bin/eslint src/cli/parse.ts", "node_modules/.bin/vitest run --reporter=dot"]'
            - given: 'the typescript profile; targets ["src/a.ts", "tests/a.test.ts"]'
              when: "acceptanceLines"
              then: '["node_modules/.bin/tsc --noEmit", "node_modules/.bin/eslint src/a.ts tests/a.test.ts", "node_modules/.bin/vitest run tests/a.test.ts --reporter=dot", "node_modules/.bin/vitest run --reporter=dot"]'
            - given: 'the python profile; targets ["pkg/a.py", "tests/test_a.py", "README.md"]'
              when: "acceptanceLines"
              then: '["python3 -m py_compile pkg/a.py tests/test_a.py", "ruff check pkg/a.py tests/test_a.py", "python3 -m pytest tests/test_a.py -q --tb=short", "python3 -m pytest -q --tb=short"]'
            - given: 'the typescript profile; targets ["docs/x.md"]'
              when: "acceptanceLines"
              then: '["node_modules/.bin/vitest run --reporter=dot"] — no own target: no parse, no lint'
        - name: Acceptance Script
          description: The whole acceptance shell script of a card — snapshot of the targets, the lines in a set -e subshell, the log printed.
          behavior: >
            acceptanceScript(profile, customId, targets): the lines, each ending "\n": first
            "D=/tmp/morph/<customId>; mkdir -p $D; S=$(date +%s)-$$; L=$D/acc-$S.log"; for the i-th
            target (from 0) "cp <target> $D/<i>-$S<ext> 2>/dev/null", ext = path.posix.extname
            of the target as given ("" when none, case kept); "("; " set -e"; one line " " +
            each Acceptance Lines line; ") > $L 2>&1; rc=$?; cat $L; exit $rc". Paths are
            written as given, unquoted.
          steps:
            - calls: Acceptance Lines
            - produces: string
          examples:
            - given: 'the typescript profile; customId "parse-command"; targets ["src/cli/parse.ts", "tests/cli/parse.test.ts"]'
              ref: "tests/fixtures/language/scriptTs.txt (the whole script)"
              when: "acceptanceScript"
              then: 'exactly the fixture text (10 lines, ending "exit $rc\n")'
            - given: 'the python profile; customId "a"; targets ["pkg/a.py", "Makefile"]'
              ref: "tests/fixtures/language/scriptPy.txt (the whole script)"
              when: "acceptanceScript"
              then: 'exactly the fixture text; the Makefile line is "cp Makefile $D/1-$S 2>/dev/null"'
        - name: Judge Instruction
          description: The profile's judge instruction filled for one judge card.
          behavior: >
            judgeInstruction(profile, {test, module, docs}) = Fill Template of
            profile.judgeInstruction with {test, module, docs: [...docs, "this instruction"]
            joined by ", "} — the examples are rendered into the judge's instruction, so it is
            always a true place to point at.
          steps:
            - calls: Fill Template
            - produces: string
          examples:
            - given: 'the typescript profile; test "tests/cli/parse.examples.test.ts", module "src/cli/parse.ts", docs ["docs/TASK_P7_cli.md", "docs/CONVENTIONS.md"]'
              when: "judgeInstruction"
              then: 'begins "Write ONLY the test file `tests/cli/parse.examples.test.ts`: one test per example of `src/cli/parse.ts` taken from docs/TASK_P7_cli.md, docs/CONVENTIONS.md, this instruction, in example order"; holds no "{"'
            - given: 'the python profile; test "tests/test_a_examples.py", module "pkg/a.py", docs []'
              when: "judgeInstruction"
              then: 'begins "Write ONLY the test file `tests/test_a_examples.py`: one test per example of `pkg/a.py` taken from this instruction, in example order"; holds "Do not write or modify `pkg/a.py`"'
      dataObjects:
        - name: Language Profile
          description: Everything the planner and the acceptance need to know about one language; templates hold {component}, {name}, {files}, {test}, {module}, {docs}.
          schema: "{ id: \"typescript\" | \"python\", extensions: string[], testDirs: string[], testFilePattern: string, nameCase: \"camel\" | \"snake\", codeTarget: string, testTarget: string, judgeTarget: string, parseLine: string, parseTakesFiles: boolean, lintLine: string, ownTestLine: string, fullRunLine: string, finale: string, judgeInstruction: string, helpersModule: string }"
        - name: Profile Result
          description: A resolved profile, or the unknown language.
          schema: "{ ok: true, profile: LanguageProfile } | { ok: false, error: string }"
        - name: Targets Result
          description: A Function's card id and default targets, or the name without words.
          schema: "{ ok: true, slug: string, targets: { code: string, test: string, judge: string } } | { ok: false, error: string }"

    # ---------------------------------------------------------------- P9
    - name: contour
      description: >
        Reading and validating the Contour record and the map: src/contour/*.ts, pure
        functions over text and plain objects. A record (contour.yaml) and a map
        (morph-map.json) are parsed from text the caller has read, checked against the schema
        this repository's own record and map use (the old Morph's `plan --spec` accepts the same
        documents), and returned as typed values the planner (P10) cuts into cards: Functions
        with behaviour, steps, preconditions and counted examples, Data Objects with their
        schema text, Components selected by `--component`, the calls graph and the Data
        Objects each Function touches. Every problem of a document is named at once, one
        "<path>: <message>" line each, in a pinned order. Unknown keys are rejected at every
        level. No file is read here (the caller passes the text), no clock, no environment;
        the package yaml is imported in Parse Document alone. Not wired into the cli: the
        planner is the first consumer.
      language: typescript
      requirements: [Deterministic Core]
      functions:
        - name: Validate Record
          description: Turns a parsed record document into a typed Contour Record, or every problem it has.
          behavior: >
            validateRecord(doc: unknown). A doc that is not a plain object (null, an array, a
            scalar) → {ok: false, problems: ["(root): a record must be an object"]}. Otherwise
            every object is checked against its key table (root: version, System, Actor,
            Requirement, Guardrail; System: name, description, requirements, guardrails,
            groups; Component: name, description, language, requirements, guardrails,
            functions, dataObjects, interfaces; Function: name, description, behavior,
            requirements, guardrails, preconditions, steps, examples; example: given, when,
            then, ref; Data Object: name, description, schema; Interface: name, description,
            exposes; Actor: name, description, uses; Requirement and Guardrail: name,
            description). Per object, in this order: each required key that is missing
            ("<path>.<key>: required"), each key not in the table in the object's own order
            ("<path>: unknown key '<k>' (known: <the table joined by ', '>)"), then the
            present keys' values in the table's order, depth first. Required: the root's
            System; every name and description; System.groups; a Function's behavior and
            examples; an example's given, when, then; an Interface's exposes. version, when
            present, must be 1 ("version: must be 1"); absent means 1. Texts must be non-empty
            strings and are stored trimmed; lists must be lists; list items that are elements
            must be objects; examples and exposes must not be empty; a step is an object with
            exactly one key, a verb of calls, reads, modifies, produces, uses, whose value is a
            non-empty string. A schema is a string, or a mapping of non-empty strings stored as
            JSON.stringify(mapping, null, 2). A Component name repeated in the record, a
            Function name repeated in its Component and a Data Object name repeated anywhere in
            the record is a problem at the repeat's name. Absent lists become [], absent
            language, ref and schema become null. Any problem → {ok: false, problems} (all of
            them, document order); none → {ok: true, record}. The paths read
            System.groups[0].functions[3].examples[0].then; the root is "(root)".
          steps:
            - reads: Contour Record
            - produces: Record Result
          examples:
            - given: 'the parsed mini record: 2 Components (tally, store), 4 Functions, 2 Data Objects, 1 Interface, 1 Actor, 1 Requirement, 1 Guardrail'
              ref: "tests/fixtures/contour/mini.json (the document), tests/fixtures/contour/mini.typed.json (the whole typed record)"
              when: "validated"
              then: '{ok: true, record} with record equal to mini.typed.json: texts trimmed, absent lists [], absent ref/language/schema null, steps as {verb, target}, the mapping schema of Count Record as JSON text'
            - given: 'the bad record: an unknown root key, version 2, a missing System description, a duplicate Function and Component, bad steps, an empty examples list, an example without then, a non-object group, a non-list Actor'
              ref: "tests/fixtures/contour/badRecord.json (the document), tests/fixtures/contour/badRecord.problems.json (the 19 problems in order)"
              when: "validated"
              then: "{ok: false, problems} equal to the 19 lines of badRecord.problems.json, first \"(root): unknown key 'Extra' (known: version, System, Actor, Requirement, Guardrail)\", last \"Requirement[0].description: required\""
            - given: 'the documents [], null and "x"'
              when: "validated"
              then: '{ok: false, problems: ["(root): a record must be an object"]} for each'
            - given: 'the document {}'
              when: "validated"
              then: '{ok: false, problems: ["System: required"]}'
            - given: 'the document {System: {name: " s ", description: "d", groups: []}}'
              when: "validated"
              then: '{ok: true, record: {version: 1, system: {name: "s", description: "d", requirements: [], guardrails: [], groups: []}, actors: [], requirements: [], guardrails: []}} — no version means 1, texts trimmed, no Component is allowed'
            - given: 'the document {version: "1", System: {name: "s", description: "d", groups: [{name: "c", description: "C.", functions: [{name: "f", description: "F.", behavior: "B."}]}]}}'
              when: "validated"
              then: '{ok: false, problems: ["version: must be 1", "System.groups[0].functions[0].examples: required"]}'
        - name: Validate Map
          description: Turns a parsed map document into a typed Contour Map, or every problem it has.
          behavior: >
            validateMap(doc: unknown). Not a plain object → {ok: false, problems: ["(root): a
            map must be an object"]}. Root keys: version, package, language, docs, groups,
            cards, extra_cards, none required; first each unknown root key in the document's
            order ("(root): unknown key '<k>' (known: …)"), then the keys in that order. version
            must be 1 when present. package and language: non-empty strings. docs: a list of
            non-empty strings. groups: an object, each value a non-empty list of Function names
            ("groups.<g>: must be a non-empty list of Function names"); a name already in an
            earlier group → "groups.<g>[<i>]: Function '<name>' is already in group '<first>'".
            cards: an object of card overrides keyed by card id, each an object with the keys
            custom_id, intent, targets, context_slice, depends_on, instruction, acceptance,
            model, max_tokens, reasoning_max_tokens, variants (unknown keys first, then the
            keys in that order): custom_id must match ^[A-Za-z0-9._-]+$, intent must be
            generate or patch, targets/context_slice/depends_on are lists of non-empty strings
            (targets not empty: "must hold at least one path"), instruction, acceptance and
            model non-empty strings, max_tokens, reasoning_max_tokens and variants positive
            integers. extra_cards: a list of objects with the same keys plus component; each
            first reports a missing custom_id, targets, instruction ("required"), then unknown
            keys, then component, then the card keys. Values are kept verbatim (an acceptance
            is a shell script: never trimmed). The typed map has camelCase fields, a key the map
            does not set is null, groups and cards become lists in the document's order.
          steps:
            - reads: Contour Map
            - produces: Map Result
          examples:
            - given: 'the mini map: package, language, docs, two groups, two card overrides, one extra card'
              ref: "tests/fixtures/contour/mini.map.json (the document), tests/fixtures/contour/mini.map.typed.json (the whole typed map)"
              when: "validated"
              then: '{ok: true, map} with map equal to mini.map.typed.json; the acceptance "  exit 0\n" kept verbatim'
            - given: 'the bad map: an unknown root key, version 2, an empty package, docs as a string, a Function in two groups, an empty group, a card with five bad values and an unknown key, a card that is a string, an extra card without custom_id and instruction'
              ref: "tests/fixtures/contour/badMap.json (the document), tests/fixtures/contour/badMap.problems.json (the 15 problems in order)"
              when: "validated"
              then: "{ok: false, problems} equal to the 15 lines of badMap.problems.json, among them \"groups.b[0]: Function 'G' is already in group 'a'\" and \"cards.x.custom_id: must match ^[A-Za-z0-9._-]+$\""
            - given: 'the documents {} and []'
              when: "validated"
              then: '{ok: true, map: {version: 1, package: null, language: null, docs: [], groups: [], cards: [], extraCards: []}}; then {ok: false, problems: ["(root): a map must be an object"]}'
            - given: 'the document {groups: {g: ["A"]}, cards: {g: {depends_on: [], context_slice: [""]}}}'
              when: "validated"
              then: '{ok: false, problems: ["cards.g.context_slice[0]: must be a non-empty string"]} — an empty depends_on is allowed'
        - name: Parse Document
          description: Parses the text of a record or a map, YAML or JSON by the name's extension, into a plain object.
          behavior: >
            parseDocument(text, name). A name ending in .yaml or .yml (case-insensitive) is
            parsed with parse of the package yaml, any other name with JSON.parse. A parser
            error → {ok: false, error: "cannot parse <name>: <the first line of the parser's
            message>"}. A result that is not a plain object (null for empty text, an array, a
            scalar) → {ok: false, error: "<name> is not a mapping at the top level"}. Else {ok:
            true, doc}. Nothing is validated here.
          steps:
            - produces: Parsed Document
          examples:
            - given: 'text "a: 1\nb: [x, y]\n" named "r.yaml"; text "{\"a\": [1, \"2\"]}" named "m.JSON"'
              when: "parsed"
              then: '{ok: true, doc: {a: 1, b: ["x", "y"]}}; {ok: true, doc: {a: [1, "2"]}}'
            - given: 'text "a: 1\n" named "m.json"; text "a: 1\na: 2\n" named "d.yml"'
              when: "parsed"
              then: '{ok: false} with error beginning "cannot parse m.json: "; {ok: false} with error beginning "cannot parse d.yml: " — one line each, the parser''s own words after the prefix'
            - given: 'text "- a\n- b\n" named "r.yaml"; text "" named "e.yaml"; text "null" named "n.json"'
              when: "parsed"
              then: '{ok: false, error: "r.yaml is not a mapping at the top level"}; the same for "e.yaml" and "n.json"'
        - name: Load Spec
          description: The text of a record or a map in, its typed value or one error message out.
          behavior: >
            loadContour(text, name) = Parse Document, then Validate Record; loadMap(text,
            name) = Parse Document, then Validate Map. A parse error is returned as it is.
            Problems → {ok: false, error: "<name> is not a valid record (<n> problem[s]):\n"
            followed by the first 20 problems joined by "\n" and, when there are more, a last
            line "… and <n - 20> more"} ("map" for loadMap; "problem" when n is 1). Else {ok:
            true, record} or {ok: true, map}. This repository's own contour.yaml and
            morph-map.json load without a problem.
          steps:
            - calls: Parse Document
            - calls: Validate Record
            - calls: Validate Map
          examples:
            - given: 'the text of the mini record in YAML, named "mini.yaml"'
              ref: "tests/fixtures/contour/mini.yaml (the text), tests/fixtures/contour/mini.typed.json (the typed record)"
              when: "loadContour"
              then: '{ok: true, record} with record equal to mini.typed.json — the YAML and its JSON twin give one record'
            - given: 'the text of badRecord.json named "badRecord.json"; the text of badMap.json named "badMap.json"'
              ref: "tests/fixtures/contour/badRecord.problems.json, tests/fixtures/contour/badMap.problems.json"
              when: "loadContour; loadMap"
              then: '{ok: false, error: "badRecord.json is not a valid record (19 problems):\n" + the 19 problems joined by "\n"}; {ok: false, error: "badMap.json is not a valid map (15 problems):\n" + the 15 problems joined by "\n"}'
            - given: 'the JSON text of {System: {name: "s", description: "d", groups: [eleven empty objects]}} named "many.json"; the text "{\"System\": {\"name\": \"s\", \"description\": \"d\"}}" named "one.json"; the text "a: [" named "m.yaml"'
              when: "loadContour; loadContour; loadMap"
              then: 'error "many.json is not a valid record (22 problems):\n" + 20 lines + "\n… and 2 more" (22 lines in all); error "one.json is not a valid record (1 problem):\nSystem.groups: required"; an error beginning "cannot parse m.yaml: "'
            - given: "this repository's own contour.yaml and morph-map.json, read as text"
              when: "loadContour; loadMap"
              then: '{ok: true} for both: system.name "MorphV2", a Component named "contour", every Function with at least one example; map package "src" and a card with id "validate-record"'
        - name: Select Components
          description: The Components a plan cuts, by the names given with --component.
          behavior: >
            selectComponents(record, names). No names: the record's only Component → {ok:
            true, components: [it]}; more than one → {ok: false, error: "the record has <n>
            Components (<names joined by ', '>): pass --component"}. Else, for each name in the
            given order, the first Component whose name equals it or whose slug equals its
            slug (the slug: lower-cased, split on every run of characters other than a-z and
            0-9, empty pieces dropped, joined by "-"); a name with no match → {ok: false,
            error: "no Component '<name as given>' in the record (have: <names joined by ',
            '>)"}. A Component selected twice is listed once, at its first place. The
            components are the record's own objects, not copies.
          steps:
            - reads: Contour Record
          examples:
            - given: 'the mini typed record, no names; then the same record with only its Component tally, no names'
              when: "selectComponents"
              then: '{ok: false, error: "the record has 2 Components (tally, store): pass --component"}; then {ok: true, components: [the tally Component]}'
            - given: 'the mini typed record, names ["Store", "tally", "store"]'
              when: "selectComponents"
              then: '{ok: true, components: [store, tally]} — matched by slug, given order, a repeat listed once'
            - given: 'the mini typed record, names ["tally", "nope"]'
              when: "selectComponents"
              then: "{ok: false, error: \"no Component 'nope' in the record (have: tally, store)\"}"
        - name: Function Links
          description: The calls graph and the Data Objects of each Function of one Component.
          behavior: >
            functionLinks(record, component) → for each Function of the component, in record
            order, {function: its name, calls, dataObjects, uses}, each list distinct in step
            order: calls = the targets of calls steps, each a Function of the same Component;
            dataObjects = the targets of reads, modifies and produces steps that name a Data
            Object of any Component of the record (other targets, like "string", are left out);
            uses = the targets of uses steps as given. A calls target that is the Function
            itself → "Function '<f>' calls itself"; one that is no Function of the component →
            "Function '<f>' calls unknown Function '<t>' of Component '<c>'". Any such error →
            {ok: false, errors} (Function order, step order); else {ok: true, links}.
          steps:
            - reads: Contour Record
            - produces: Function Link
          examples:
            - given: 'the mini typed record, Component tally'
              when: "functionLinks"
              then: '{ok: true, links: [{function: "Count Words", calls: [], dataObjects: [], uses: []}, {function: "Report Count", calls: ["Count Words"], dataObjects: ["Text File"], uses: ["node:fs"]}]} — two calls steps of one Function listed once, "number" is no Data Object'
            - given: 'the mini typed record, Component store'
              when: "functionLinks"
              then: '{ok: true, links: [{function: "Save Count", calls: [], dataObjects: ["Count Record"], uses: ["tally"]}, {function: "Load Counts", calls: [], dataObjects: ["Count Record", "Text File"], uses: []}]} — a Data Object of another Component counts'
            - given: 'the record of badCalls.json (valid in shape), Component loop'
              ref: "tests/fixtures/contour/badCalls.json"
              when: "functionLinks"
              then: "{ok: false, errors: [\"Function 'A' calls unknown Function 'B' of Component 'loop'\", \"Function 'C' calls itself\"]}"
      dataObjects:
        - name: Contour Record
          description: The typed record (src/contour/types.ts); every list present, every optional text null when absent, texts trimmed.
          schema: "{ version: 1, system: { name, description, requirements: string[], guardrails: string[], groups: Component[] }, actors: { name, description, uses: string[] }[], requirements: { name, description }[], guardrails: { name, description }[] }; Component = { name, description, language: string | null, requirements, guardrails, functions: { name, description, behavior, requirements, guardrails, preconditions: string[], steps: { verb: 'calls'|'reads'|'modifies'|'produces'|'uses', target }[], examples: { given, when, then, ref: string | null }[] }[], dataObjects: { name, description, schema: string | null }[], interfaces: { name, description, exposes: string[] }[] }"
        - name: Contour Map
          description: The typed map; snake_case keys of the document become camelCase fields, a key the map does not set is null.
          schema: "{ version: 1, package: string | null, language: string | null, docs: string[], groups: { name, functions: string[] }[], cards: ({ id } & CardFields)[], extraCards: ({ component: string | null } & CardFields)[] }; CardFields = { customId, intent: 'generate'|'patch', targets, contextSlice, dependsOn, instruction, acceptance, model, maxTokens, reasoningMaxTokens, variants }, each | null"
        - name: Record Result
          description: A typed record, or every problem.
          schema: "{ ok: true, record: ContourRecord } | { ok: false, problems: string[] }"
        - name: Map Result
          description: A typed map, or every problem.
          schema: "{ ok: true, map: ContourMap } | { ok: false, problems: string[] }"
        - name: Parsed Document
          description: A parsed plain object, or one error line.
          schema: "{ ok: true, doc: Record<string, unknown> } | { ok: false, error: string }"
        - name: Function Link
          description: What one Function calls and touches, for the planner's depends_on and slices.
          schema: "{ function: string, calls: string[], dataObjects: string[], uses: string[] }"

    # ---------------------------------------------------------------- P10a
    - name: planner
      description: >
        `morph plan --spec`: a typed Contour record and map (P9) cut into a deck of cards in the
        V2 schema (src/cards/types.ts Card), pure functions in src/planner/*.ts. A Function is a
        card, a map group is one card, calls are depends_on, an Interface exposing one Function
        folds into its card and one exposing several is a card of its own; ids, targets, the
        judge instruction and the default acceptance come from the Component's language profile
        (P8); the map overrides any key (its instruction becomes the card's opening, the
        record's text follows), adds extra cards, and may name cards of other cuts (external
        depends_on). A judge card per code card carries the examples and the contracts a test's
        setup needs: the Data Objects, the callees and the preconditions of the Functions it
        calls and the Components it uses (issue #3). Budgets come from a formula: code by steps,
        members and examples, judges by examples. The record itself never goes into a slice.
        Cards come back in generation order, by id inside a generation. No file is read here:
        the cli reads the record and the map and tells the planner which files exist.
      language: typescript
      requirements: [Deterministic Core]
      functions:
        - name: Render Examples
          description: A Function's examples as one numbered line each.
          behavior: >
            renderExamples(examples) → the lines "<n>. given <given>; when <when>; then <then>",
            n from 1, plus " (ref: <ref>)" when ref is not null, joined by "\n"; every clause
            has each run of whitespace collapsed to one space and is trimmed; [] → "".
          steps:
            - produces: string
          examples:
            - given: 'the examples {given: "the line \"rent 1200\"", when: "parsed", then: "{name: \"rent\", cents: 1200}", ref: null} and {given: "a  b\n c", when: " w ", then: "t", ref: "R  1"}'
              when: "rendered"
              then: '"1. given the line \"rent 1200\"; when parsed; then {name: \"rent\", cents: 1200}\n2. given a b c; when w; then t (ref: R 1)"'
            - given: 'no examples'
              when: "rendered"
              then: '""'
        - name: Render Function
          description: The instruction section of one Function, and the Data blocks of the Data Objects Functions touch.
          behavior: >
            dataBlocks(record, functions): for each reads, modifies or produces step of the
            functions (function order, step order) whose target names a Data Object of any
            Component and was not taken yet, the block "Data <name>: <description>" followed by
            "\nSchema:\n<schema>" when the schema is not null; other targets ("number",
            "string") are skipped. functionSection(record, fn): the blocks "## Function <name>",
            the description, "Behaviour: <behavior>", when there are preconditions
            "Preconditions:" and one "- <p>" line each, when there are steps "Steps:" and one
            "- <verb>: <target>" line each, the examples heading "Examples (the tests must prove
            each one):" with Render Examples on the next line, the Data blocks of [fn], when
            there are requirements "Requirements:" and one line per name, when there are
            guardrails "Guardrails:" and one line per name; blocks joined by "\n\n", lines of a
            block by "\n". A requirement or guardrail line is "- <name>: <description>" from the
            record's Requirement / Guardrail list, or "- <name> (definition not found in the
            record)".
          steps:
            - calls: Render Examples
            - reads: Contour Record
            - produces: string
          examples:
            - given: 'the ledger record, Function Sum Entries (a precondition, three steps, one example with a ref, Data Object Entry)'
              ref: "tests/fixtures/planner/ledger.yaml (the record), tests/fixtures/planner/sumEntries.section.txt (the whole section)"
              when: "functionSection"
              then: 'exactly the text of sumEntries.section.txt'
            - given: 'the ledger record, Function Check Ledger (no Data step, requirements Exact Sums and Unknown Rule)'
              ref: "tests/fixtures/planner/checkLedger.section.txt (the whole section)"
              when: "functionSection"
              then: 'exactly the text of checkLedger.section.txt; its last line "- Unknown Rule (definition not found in the record)"'
            - given: 'the ledger record, Functions Save Ledger and Load Ledger of Component store'
              when: "dataBlocks"
              then: '["Data Ledger File: A text file of entries.\nSchema:\n{\n  \"path\": \"string\",\n  \"text\": \"string\"\n}", "Data Entry: One ledger entry.\nSchema:\n{ name: string, cents: number }"] — Ledger File once, Entry of Component ledger counts'
        - name: Render Context
          description: The preamble, the inherited requirements and guardrails, and an Interface section.
          behavior: >
            preamble(docs, spec): docs not empty → "Read <docs joined by ', '> FIRST (in your
            context). Every name you need is in them or below; do not invent names, keys or
            files."; else "Every name you need is below -- the record `<spec>` is cut into this
            instruction; do not invent names, keys or files." inheritedSection(record,
            component): requirements = the System's then the Component's names, distinct, first
            place kept; guardrails the same; both empty → ""; else the blocks "## Component
            requirements / guardrails", then "Requirements:" with its lines when any, then
            "Guardrails:" with its lines when any (lines as in Render Function), joined by
            "\n\n". interfaceSection(iface, modules): the blocks "## Interface <name>", the
            description, "Exposes:" with one line "- <name> (`<modules[i]>`)" per exposed
            Function, joined by "\n\n".
          steps:
            - reads: Contour Record
            - produces: string
          examples:
            - given: 'docs ["docs/A.md", "docs/B.md"], spec "c.yaml"; then docs [], spec "c.yaml"'
              when: "preamble"
              then: '"Read docs/A.md, docs/B.md FIRST (in your context). Every name you need is in them or below; do not invent names, keys or files."; then "Every name you need is below -- the record `c.yaml` is cut into this instruction; do not invent names, keys or files."'
            - given: 'the ledger record, Component ledger (System: Exact Sums, No Network; Component: Exact Sums, Pure Core)'
              when: "inheritedSection"
              then: '"## Component requirements / guardrails\n\nRequirements:\n- Exact Sums: Sums are integers of cents, never floats.\n\nGuardrails:\n- No Network: Nothing opens a socket.\n- Pure Core: No clock and no file system in the core."'
            - given: 'the ledger record with the System''s requirements and guardrails emptied, Component store (none of its own)'
              when: "inheritedSection"
              then: '""'
            - given: 'the Interface ledger CLI (exposes Format Report, Check Ledger), modules ["src/a.ts", "src/b.ts"]'
              when: "interfaceSection"
              then: '"## Interface ledger CLI\n\nThe command line.\n\nExposes:\n- Format Report (`src/a.ts`)\n- Check Ledger (`src/b.ts`)"'
        - name: Card Budget
          description: The output budget of a code card and of a judge card.
          behavior: >
            codeBudget(steps, members, isGroup, examples) → {maxTokens: min(32000, 12000 + 2000
            × steps + 4000 × (members − 1) + 500 × examples), reasoningMaxTokens: 2500,
            variants: 2 when steps ≥ 3 or isGroup, else 1}. judgeBudget(examples) →
            {maxTokens: min(32000, 16000 + 1000 × examples), reasoningMaxTokens: 2500, variants:
            1} — the judge's answer grows with its examples (four examples 20 000, twelve
            28 000). Exported constants MAX_TOKENS_CAP = 32000, REASONING_MAX_TOKENS = 2500.
          steps:
            - produces: Budget
          examples:
            - given: 'codeBudget(6, 2, true, 3); codeBudget(1, 1, false, 2); codeBudget(3, 1, false, 0)'
              when: "budgeted"
              then: '{maxTokens: 29500, reasoningMaxTokens: 2500, variants: 2}; {maxTokens: 15000, reasoningMaxTokens: 2500, variants: 1}; {maxTokens: 18000, reasoningMaxTokens: 2500, variants: 2}'
            - given: 'codeBudget(20, 3, true, 10); judgeBudget(4); judgeBudget(12); judgeBudget(20)'
              when: "budgeted"
              then: 'maxTokens 32000 (capped); {maxTokens: 20000, reasoningMaxTokens: 2500, variants: 1}; maxTokens 28000; maxTokens 32000 (capped)'
        - name: Cut Units
          description: The Functions and map groups of one Component as card units, in record order.
          behavior: >
            cutUnits(component, groups). A group none of whose Functions belongs to the
            Component is skipped (it is another Component's); a group naming some of its
            Functions and some it does not have → {ok: false, error: "group '<g>' names unknown
            Function '<first unknown>' next to '<first known>' of Component '<c>': a group names
            the Functions of one Component"}. Then, per Function in record order: not in a group
            → {id: slugName(its name), name: its name, functions: [it], isGroup: false}; in a
            group not placed yet → {id: slugName(the group's name), name: the group's name,
            functions: the group's Functions in record order, isGroup: true}, placed where its
            first Function stands. → {ok: true, units}.
          steps:
            - reads: Contour Map
            - produces: Unit
          examples:
            - given: 'Component ledger of the ledger record, groups [{name: "checks", functions: ["Sum Entries", "Check Ledger"]}]'
              when: "cutUnits"
              then: '{ok: true, units: [{id: "parse-entry", name: "Parse Entry", functions: [Parse Entry], isGroup: false}, {id: "checks", name: "checks", functions: [Sum Entries, Check Ledger], isGroup: true}, {id: "format-report", name: "Format Report", functions: [Format Report], isGroup: false}]} — the record''s own Function objects'
            - given: 'Component ledger, groups [{name: "Other", functions: ["Count Words"]}, {name: "Mixed Up", functions: ["Check Ledger", "Sum Entries"]}]'
              when: "cutUnits"
              then: 'ids ["parse-entry", "mixed-up", "format-report"]; the group''s functions [Sum Entries, Check Ledger] in record order; the group of another Component skipped'
            - given: 'Component ledger, groups [{name: "bad", functions: ["Parse Entry", "Nope"]}]'
              when: "cutUnits"
              then: "{ok: false, error: \"group 'bad' names unknown Function 'Nope' next to 'Parse Entry' of Component 'ledger': a group names the Functions of one Component\"}"
        - name: Cut Component
          description: The code cards of one Component, overrides applied, with what its judges need.
          behavior: >
            cutComponent({record, component, map, docs, spec}). Faults, each the result as soon
            as found, in this order: the profile = Resolve Profile(component.language,
            map.language), unknown → "Component '<name>': <its error>"; Function Links errors →
            the first one; Cut Units(component, map.groups) error; a unit name without words →
            Name Targets' error; an Interface exposing a name no Function of the Component has →
            "Interface '<i>' exposes unknown Function '<f>'"; two base cards with one id →
            "duplicate customId '<id>'". Base cards: one per unit, targets [code, test] of Name
            Targets(profile, component.name, unit.name), deps = for each Function of the unit and
            each of its calls steps in order, the unit owning the callee when it is another unit,
            distinct; budget Card Budget codeBudget(the units' steps counted, its Functions
            counted, isGroup, its examples counted). Then per Interface in record order: exposing
            one Function → folded into that Function's card (its section follows the Function
            sections); exposing several → a base card of its own after the units, id
            slugName(its name), targets of Name Targets(profile, component.name, its name), deps
            the owners of the exposed Functions in exposes order, distinct, budget codeBudget(0, 1,
            false, 0), no Functions. Overrides: the map card whose id is the base id. Final id =
            its customId or the base id; targets = its targets or the base targets. dependsOn =
            its dependsOn, else the deps, each base id replaced by its final id (a name of no card
            of this cut kept as given). contextSlice = its contextSlice, else docs followed by the
            first target of every dependsOn entry that is a card of this cut (not yet present),
            and when that is empty the card's first target. instruction = the blocks preamble(docs,
            spec), Function sections, Interface sections (modules = the first final target of the
            card owning each exposed Function), the inherited section unless "", "Write the files:
            `<t1>`, `<t2>`." (each target in backticks, joined by ", "), the profile's finale,
            joined by "\n\n"; an override's instruction replaces the first block. Card = {customId,
            intent: override or "patch", targets, contextSlice, instruction, acceptance: override
            or Acceptance Script(profile, customId, targets), model: override or null, maxTokens:
            override or the budget's, reasoning: {maxTokens: override reasoningMaxTokens or 2500},
            variants: override or the budget's, dependsOn}. → {ok: true, cuts}, one Cut Card per
            card in base order: {card, component, profile, functions: the unit's Functions ([] for
            an Interface card), slicedByMap: the override set contextSlice}.
          steps:
            - calls: Cut Units
            - calls: Render Function
            - calls: Render Context
            - calls: Card Budget
            - uses: language
            - uses: contour
            - reads: Contour Map
            - produces: Cut Card
          examples:
            - given: 'the ledger record and map, Component ledger, docs ["docs/TASK.md"], spec "ledger.yaml"'
              ref: "tests/fixtures/planner/ledger.yaml, tests/fixtures/planner/ledger.map.json, tests/fixtures/planner/ledger.cut.json (the four cards)"
              when: "cutComponent"
              then: 'ok; the cards equal ledger.cut.json: parse (renamed, targets and max_tokens overridden), checks (the group, Interface check API folded, deps ["parse"], variants 2), format-report (opening "Write the report formatter.", dependsOn ["checks", "outside"]), ledger-cli (the Interface card, dependsOn ["format-report", "checks"], slice ["docs/TASK.md", "src/ledger/formatReport.ts", "src/ledger/checks.ts"]); functions per card [Parse Entry], [Sum Entries, Check Ledger], [Format Report], []; slicedByMap false for all; profile the typescript profile'
            - given: 'the same, Component store (python)'
              ref: "tests/fixtures/planner/store.cut.json (the two cards)"
              when: "cutComponent"
              then: 'ok; the cards equal store.cut.json: save-ledger (targets ["store/save_ledger.py", "tests/test_save_ledger.py"], dependsOn ["format-report"] kept as given, slice ["docs/TASK.md"], variants 3, a python acceptance), load-ledger; profile the python profile'
            - given: 'the ledger record, Component ledger, the empty map, docs [], spec "ledger.yaml"'
              when: "cutComponent"
              then: 'ids ["parse-entry", "sum-entries", "check-ledger", "format-report", "ledger-cli"]; dependsOn [], ["parse-entry"], ["parse-entry", "sum-entries"], ["sum-entries"], ["format-report", "check-ledger"]; parse-entry''s slice ["src/ledger/parseEntry.ts"] (its own first target), sum-entries'' ["src/ledger/parseEntry.ts"]; every instruction begins "Every name you need is below -- the record `ledger.yaml` is cut"; check-ledger''s holds "## Interface check API"; maxTokens 15000, 18500, 19000, 16500, 12000'
            - given: 'Component ledger with language "go"; Component loop of badCalls.json; Component ledger with interfaces [{name: "x", description: "d", exposes: ["Nope"]}]; Component ledger with the empty map whose groups are [{name: "parse-entry", functions: ["Sum Entries"]}]'
              ref: "tests/fixtures/contour/badCalls.json"
              when: "cutComponent"
              then: "errors \"Component 'ledger': unknown language 'go' (known: typescript, python)\"; \"Function 'A' calls unknown Function 'B' of Component 'loop'\"; \"Interface 'x' exposes unknown Function 'Nope'\"; \"duplicate customId 'parse-entry'\""
        - name: Cut Judges
          description: One judge card per card with a code target; examples, Data blocks, callee contracts and preconditions in its instruction.
          behavior: >
            cutJudges({record, cuts, map, docs, defaultProfile, hasFile}) → Card[], in cut order.
            Per Cut Card: profile = its profile, else Detect Profile of its first target, else
            defaultProfile; code = codeTargets(profile, targets); none → no judge. Built id =
            "<customId>-judge"; the map card with that id overrides as for a code card. Default
            target: the profile's judgeTarget filled with {component: the base name of code[0]'s
            directory, name: code[0]'s base name without its extension}. dependsOn = [the card's
            id] then the override's dependsOn not yet present. test = testTarget(profile,
            targets) or targets[0]. Blocks: Judge Instruction(profile, {test, module: code[0],
            docs}); when the card has Functions: "The examples below are the criterion, and you
            are its independent author: write one test per example (no fewer, no merging), each
            named after the Function and the example number, e.g. \"<first Function> example
            1\".", one block "Examples of Function <name>:\n" + Render Examples per Function,
            dataBlocks(record, functions), one block "Callee <name>: <description>\nBehaviour:
            <behavior>" per callee (a calls target of the Functions that is none of them, a
            Function of the Component, distinct, step order), and when any line exists the
            block "Preconditions a test's setup depends on:" with lines "- <Component> ·
            <Function> · <precondition>", distinct, from the card's Functions, then the callees,
            then every Function (record order) of each Component other than its own (by name) that a
            uses step names (by name or slug, distinct, step order); blocks joined by "\n\n", the
            override's instruction replacing the first. contextSlice = the override's, else
            docs, code[0] when absent, the profile's helpersModule when hasFile(it) and absent.
            budget judgeBudget(the examples of its Functions counted). Card = {customId, intent:
            override or "patch", targets, contextSlice, instruction, acceptance: override or
            Acceptance Script(profile, customId, targets), model: override or null, maxTokens:
            override or the budget's, reasoning {maxTokens: override or 2500}, variants: override
            or 1, dependsOn}.
          preconditions:
            - Cut Component made the cuts; an extra card is a Cut Card with component and profile null, functions [] and slicedByMap true
          steps:
            - calls: Render Examples
            - calls: Render Function
            - calls: Card Budget
            - uses: language
            - reads: Cut Card
          examples:
            - given: 'the Cut Cards of Components ledger then store (the map, docs ["docs/TASK.md"]); defaultProfile typescript; hasFile true only for "tests/helpers.ts"'
              ref: "tests/fixtures/planner/ledger.judges.json (the six judges)"
              when: "cutJudges"
              then: 'the cards equal ledger.judges.json: parse-judge, checks-judge, format-report-judge, ledger-cli-judge, save-ledger-judge, load-ledger-judge'
            - given: 'the same; the judge checks-judge'
              when: "cutJudges"
              then: 'contextSlice ["docs/TASK.md", "src/ledger/checks.ts", "tests/helpers.ts"]; maxTokens 19000 (3 examples); its instruction holds "Callee Parse Entry: One line of text into an Entry.\nBehaviour: Splits \"<name> <cents>\" at the last space; the cents are digits." and ends "Preconditions a test''s setup depends on:\n- ledger · Sum Entries · every line is parsed first, else Parse Entry faults before the sum\n- store · Save Ledger · the directory exists, else the write faults"'
            - given: 'the same; the judges parse-judge and ledger-cli-judge (both overridden) and save-ledger-judge (python)'
              when: "cutJudges"
              then: 'parse-judge dependsOn ["parse", "checks"], contextSlice ["docs/TASK.md"], maxTokens 30000, target "tests/ledger/parse.examples.test.ts"; ledger-cli-judge instruction exactly "Write the CLI tests." (an Interface card has no examples); save-ledger-judge target "tests/test_save_ledger_examples.py", contextSlice ["docs/TASK.md", "store/save_ledger.py"] (no tests/conftest.py)'
            - given: 'the three extra cards of the map as Cut Cards (store-schema → store/schema.py, notes → docs/NOTES.md, ledger-types → src/ledger/types.ts); hasFile always false'
              ref: "tests/fixtures/planner/extras.cards.json (the cards), tests/fixtures/planner/extras.judges.json (the two judges)"
              when: "cutJudges"
              then: 'the cards equal extras.judges.json: store-schema-judge (python by extension, target "tests/test_schema_examples.py", maxTokens 16000) and ledger-types-judge; notes has no code target and no judge'
        - name: Order Deck
          description: Kahn layers over dependsOn, the deck sorted by them, and the external dependencies.
          behavior: >
            orderDeck(cards). An id of dependsOn that no card carries is external and counts as
            done. Layer after layer: the cards not placed whose in-deck dependencies are all
            placed, ids sorted (JavaScript's default string order); a layer that would be empty
            while cards remain → {ok: false, error: "dependency cycle among <the ids not placed,
            sorted, joined by ', '>"}. → {ok: true, cards: sorted by (layer, id), generations: the
            layers, externalDependsOn: per card in that order with at least one external id, its
            external ids in dependsOn order}.
          steps:
            - reads: Card
            - produces: Card
          examples:
            - given: 'the cards of the layered deck fixture in reverse order (d, c, b, a)'
              ref: "tests/fixtures/decks/layered.json"
              when: "orderDeck"
              then: '{ok: true} with card ids ["a", "b", "c", "d"], generations [["a"], ["b", "c"], ["d"]], externalDependsOn {}'
            - given: 'cards z (dependsOn ["y", "ext"]), y (none), x (dependsOn ["ext2", "y"])'
              when: "orderDeck"
              then: 'ids ["y", "x", "z"]; generations [["y"], ["x", "z"]]; externalDependsOn {x: ["ext2"], z: ["ext"]}, x first'
            - given: 'cards a (dependsOn ["b"]), b (dependsOn ["a"]), c (none)'
              when: "orderDeck"
              then: '{ok: false, error: "dependency cycle among a, b"}'
        - name: Plan Spec
          description: The whole plan of `morph plan --spec`, the old Morph's cut kept card for card.
          behavior: >
            planSpec({record, map, spec, components, judge, hasFile}). Faults in this order: the
            map's language → Resolve Profile(null, map.language), unknown → "the map: <its
            error>"; Select Components(record, components) error. docs = map.docs without the
            spec path. Cut Component per selected Component in order (its error is the result).
            Across cuts: a card whose slice the map did not set gets the first target of every
            dependsOn entry naming a cut card of another Component appended (when absent). Extra
            cards in map order: component null → kept; a component no Component of the record has
            by name or slug → "extra card '<customId>' names Component '<component>' the record
            does not have (have: <the record's Component names joined by ', '>)"; kept when it
            names a selected Component, else skipped; as Card {customId, intent or "patch",
            targets, contextSlice or [], instruction, acceptance, model, maxTokens (null when
            unset), reasoning: {maxTokens: reasoningMaxTokens} or null, variants or 1, dependsOn
            or []}, Cut Card {component null, profile null, functions [], slicedByMap true}. When
            judge: Cut Judges over every Cut Card (defaultProfile = the map's profile, typescript
            when unset), appended. Every card's contextSlice loses every entry equal to spec (the
            record never rides in a slice). The first customId repeated in card order →
            "duplicate customId '<id>'". Order Deck (its error is the result). → {ok: true, plan:
            {spec, components: the selected names, cards, generations, externalDependsOn}}. On the
            same record and map the old `mrph plan --spec --judge` gives the same ids, dependsOn
            and generations (golden cross-check; texts and targets differ by design).
          steps:
            - calls: Cut Component
            - calls: Cut Judges
            - calls: Order Deck
            - uses: contour
            - produces: Plan
          examples:
            - given: 'the ledger record and map, spec "ledger.yaml", components ["ledger", "store"], judge true, hasFile true only for "tests/helpers.ts"'
              ref: "tests/fixtures/planner/ledger.golden.json (the old mrph's ids, dependsOn, generations, external), tests/fixtures/planner/ledger.plan.json (the whole plan)"
              when: "planSpec"
              then: 'ok; card ids with their dependsOn, generations and externalDependsOn equal ledger.golden.json''s (17 cards, 5 generations, {"format-report": ["outside"]}); the whole plan equals ledger.plan.json; no slice holds "ledger.yaml"'
            - given: 'the same, components ["store"], judge false'
              when: "planSpec"
              then: 'card ids ["load-ledger", "notes", "save-ledger", "store-schema"], generations [["load-ledger", "notes", "save-ledger", "store-schema"]], externalDependsOn {notes: ["parse"], "save-ledger": ["format-report"]}; save-ledger''s slice ["docs/TASK.md"]; ledger-types (Component Ledger) skipped'
            - given: 'the ledger map with the parse-entry override''s contextSlice ["ledger.yaml", "docs/A.md"]; components ["ledger"], judge false'
              when: "planSpec"
              then: 'the card parse has contextSlice ["docs/A.md"]'
            - given: 'the map with language "cobol"; components ["nope"]; an extra card store-schema with component "Nowhere"; an extra card ledger-types renamed "parse"; the parse-entry override with dependsOn ["checks"] (components ["ledger"], judge false)'
              when: "planSpec"
              then: "errors \"the map: unknown language 'cobol' (known: typescript, python)\"; \"no Component 'nope' in the record (have: ledger, store)\"; \"extra card 'store-schema' names Component 'Nowhere' the record does not have (have: ledger, store)\"; \"duplicate customId 'parse'\"; \"dependency cycle among checks, format-report, ledger-cli, notes, parse\""
            - given: "this repository's own contour.yaml and morph-map.json, spec \"contour.yaml\", components [\"contour\"], judge true"
              when: "planSpec"
              then: 'generations [["validate-record"], ["select-components", "validate-map", "validate-record-judge"], ["load-spec", "select-components-judge", "validate-map-judge"], ["load-spec-judge"]] — the P9 deck old mrph cut; each card''s acceptance is the map''s for its id'
      dataObjects:
        - name: Budget
          description: The output budget of one card.
          schema: "{ maxTokens: number, reasoningMaxTokens: number, variants: number }"
        - name: Unit
          description: One code card's worth of Functions, before overrides.
          schema: "{ id: string, name: string, functions: ContourFunction[], isGroup: boolean }"
        - name: Cut Card
          description: A card and what its judge needs.
          schema: "{ card: Card, component: Component | null, profile: LanguageProfile | null, functions: ContourFunction[], slicedByMap: boolean }"
        - name: Plan
          description: The result of planSpec and the body of the plan document.
          schema: "{ spec: string, components: string[], cards: Card[], generations: string[][], externalDependsOn: Record<string, string[]> }"

    # ---------------------------------------------------------------- P10b
    - name: builder
      description: >
        The acceptance builder: src/builder/*.ts, pure functions that write every card's acceptance
        shell script — the job decks/tools/build.py does today (issue #3, A1–A10 and B1–B2). Input:
        the deck's cards, a phase's checks document (the knobs: phase, frozen paths, full-suite
        excludes, own-git, per card a smoke cap, an extra step or a judge's test files with their
        bounds, literals and kept names), the language profile (its parse, lint and test lines) and
        the texts the caller has read (the guard, the first-difference locator, one probe per code
        card). Output: the same cards with each named card's acceptance set: snapshot of the targets
        outside the tree, a set -e subshell with NO_COLOR=1 CI=1 and the log printed whole, a probe
        directory with a per-card tsconfig that leaves out the same generation's other targets, then
        the stages in a fixed order, each announced by an "== <stage>" line: tsc, eslint (verdict held
        until after the probe and the own test), guard, probe or the judge's files, own test, full
        suite, own git, frozen, untracked; every failed vitest step prints its whole failure section
        and the first difference. The scripts equal build.py's P10a form byte for byte. Only the
        typescript profile has a builder. No file read, no clock, no environment; node:path is the
        only Node module. Not wired into the cli in this phase (P10b2).
      language: typescript
      requirements: [Deterministic Core]
      functions:
        - name: Wrap Script
          description: The frame of every acceptance — the attempt snapshot, the subshell, the log.
          behavior: >
            heredoc(path, body, tag) = "cat > <path> <<'<tag>'\n" + body with its trailing whitespace
            removed (trimEnd) + "\n" + tag + "\n". snapshotLines(id, phase, targets) = "D=/tmp/morph/<id>-<phase>;
            mkdir -p $D; S=$(date +%s)-$$; L=$D/acc-$S.log\n", then for the i-th target (from 0) "cp
            <target> $D/<i>-$S<ext> 2>/dev/null\n", ext = path.posix.extname of the target, ".txt" when
            that is "". wrapScript(id, phase, targets, body) = snapshotLines + "(\n set -e\n export
            NO_COLOR=1 CI=1\n" + body + ") > $L 2>&1; rc=$?; cat $L; exit $rc" (no final newline).
          steps:
            - produces: string
          examples:
            - given: 'heredoc("$P/x.json", "[1]\n\n", "MORPH_X_EOF")'
              when: "written"
              then: '"cat > $P/x.json <<''MORPH_X_EOF''\n[1]\nMORPH_X_EOF\n" — the trailing blank lines dropped, one newline before the tag'
            - given: 'wrapScript("c", "p1", ["src/a.ts", "Makefile"], "echo hi\n")'
              ref: "tests/fixtures/builder/wrap.txt (the whole script, no final newline)"
              when: "written"
              then: 'exactly the fixture text: 7 lines, "cp Makefile $D/1-$S.txt 2>/dev/null" for the target without an extension, the last line ") > $L 2>&1; rc=$?; cat $L; exit $rc"'
        - name: Check Steps
          description: The tsc, eslint and vitest lines of a stage, from the language profile.
          behavior: >
            tscStep(profile) = "echo '== tsc'; " + profile.parseLine + " -p $P/tsconfig.card.json\n".
            eslintStep(profile, files) = "echo '== eslint'; E=0; " + Fill Template of profile.lintLine
            with {files: files joined by " "} + " || E=1\n"; ESLINT_VERDICT = '[ "$E" = 0 ] || { echo
            "== eslint failed (see above); every step between it and here passed"; exit 1; }' + "\n" — a
            red eslint is reported after the probe and the own test, never before them.
            vitestStep(profile, args) = Fill Template of profile.ownTestLine with {test: args} + " >
            $P/vt.log 2>&1 || { " + the failure report + "; node $P/firstdiff.mjs $P/vt.log; exit 1;
            }\n", the failure report printing from the first "^ FAIL " line to the end without the
            "Start at" and "Duration" lines, at most 200 lines, else the last 60 lines of the log.
            fullArgs(exclude) = "--passWithNoTests" followed by " --exclude <path>" per path, in order.
          steps:
            - reads: Language Profile
            - produces: string
          examples:
            - given: 'the typescript profile; tscStep; eslintStep with ["src/a.ts", "tests/a.test.ts"]'
              when: "written"
              then: '"echo ''== tsc''; node_modules/.bin/tsc --noEmit -p $P/tsconfig.card.json\n"; "echo ''== eslint''; E=0; node_modules/.bin/eslint src/a.ts tests/a.test.ts || E=1\n"'
            - given: 'fullArgs([]); fullArgs(["tests/x.test.ts", "tests/y.test.ts"])'
              when: "written"
              then: '"--passWithNoTests"; "--passWithNoTests --exclude tests/x.test.ts --exclude tests/y.test.ts"'
            - given: 'the typescript profile; vitestStep with "tests/a.test.ts"'
              ref: "tests/fixtures/builder/vitestStep.txt (one line with its newline)"
              when: "written"
              then: 'exactly the fixture text, beginning "node_modules/.bin/vitest run tests/a.test.ts --reporter=dot > $P/vt.log 2>&1 || { if grep -q ''^ FAIL '' $P/vt.log;" and ending "node $P/firstdiff.mjs $P/vt.log; exit 1; }\n"'
        - name: Tree Steps
          description: The checks on the repository around the stages — own git, frozen paths, untracked files, kept test names.
          behavior: >
            frozenStep(paths) = "echo '== frozen'; git diff --quiet HEAD -- <P> || { echo \"changed
            outside the targets: $(git diff --name-only HEAD -- <P> | tr \"\\n\" \" \")\"; exit 1; }\n",
            P = paths joined by " ". untrackedStep(targets) = "X=$(git ls-files --others
            --exclude-standard | grep -vxF " + "-e <target>" per target joined by " " + " || true); [ -z
            \"$X\" ] || { echo \"files left in the tree: $X\"; exit 1; }\n". OWN_GIT_BEFORE stores HEAD's
            symbolic ref, HEAD and every ref in G0; OWN_GIT_AFTER ("== own git") reads them again into
            G1 and fails with both when they differ. namesKept(file, drop): "echo '== names <file>'",
            the test names of the file at HEAD (git show, every test("…" or it("…")) minus each dropped
            name (" | grep -vxF " + JSON.stringify of the name in double quotes), then every name must
            still be in the file, else "test removed: <name>".
          steps:
            - produces: string
          examples:
            - given: 'frozenStep(["docs", "decks"]); untrackedStep(["src/a.ts", "src/b.ts"])'
              ref: "tests/fixtures/builder/frozen.txt, tests/fixtures/builder/untracked.txt"
              when: "written"
              then: 'exactly the two fixture texts, one line each with its newline'
            - given: 'namesKept("tests/a.examples.test.ts", ["A example 4: old"]) + namesKept("tests/b.examples.test.ts", [])'
              ref: "tests/fixtures/builder/names.txt (the two lines)"
              when: "written"
              then: 'exactly the fixture text; the first line holds | grep -vxF "\"A example 4: old\"", the second none'
            - given: 'OWN_GIT_BEFORE + OWN_GIT_AFTER'
              ref: "tests/fixtures/builder/ownGit.txt (the two lines)"
              when: "joined"
              then: 'exactly the fixture text, the first line beginning "G0=$( (git symbolic-ref -q HEAD || true;", the second "echo ''== own git''; G1=$("'
        - name: Probe Dir
          description: The card's own directory probe/<id>/ with the guard, a vitest config, the per-card tsconfig, the locator and the probe.
          behavior: >
            cardTsconfig(exclude) = JSON.stringify of {extends: "../../tsconfig.json", include:
            ["../../src", "../../tests", "./*.probe.ts"]} plus, when exclude is not empty, exclude: each
            path prefixed "../../", with indent 2, + "\n" — a sibling's broken file cannot redden this
            card. vitestConfig(id) = the seven-line vitest config rooted two levels up, include
            ["probe/<id>/**/*.probe.ts"], setupFiles ["tests/setup.ts"], truncateThreshold 200.
            probeDir(id, guard, firstdiff, probe, exclude) = "P=$PWD/probe/<id>; rm -rf $P; mkdir -p $P;
            trap 'rm -rf $P' EXIT\n", then Wrap Script's heredocs in this order: $P/guard.mjs
            (MORPH_GUARD_EOF), $P/probe.config.mts (MORPH_CONF_EOF), $P/tsconfig.card.json
            (MORPH_TSCONF_EOF), $P/firstdiff.mjs (MORPH_FIRSTDIFF_EOF) and, when probe is not null,
            $P/<id>.probe.ts (MORPH_PROBE_EOF).
          steps:
            - calls: Wrap Script
            - produces: string
          examples:
            - given: 'cardTsconfig([]); cardTsconfig(["src/b.ts"])'
              when: "written"
              then: 'JSON.stringify({extends: "../../tsconfig.json", include: ["../../src", "../../tests", "./*.probe.ts"]}, null, 2) + "\n"; the same with a last key exclude: ["../../src/b.ts"]'
            - given: 'probeDir("c", "// guard\n", "// firstdiff\n", "// probe\n", ["src/b.ts", "tests/b.examples.test.ts"])'
              ref: "tests/fixtures/builder/probeDir.txt (the whole text with its final newline)"
              when: "written"
              then: 'exactly the fixture text: 33 lines, the vitest config with include ["probe/c/**/*.probe.ts"]'
            - given: 'the same with probe null'
              ref: "tests/fixtures/builder/probeDir.txt"
              when: "written"
              then: 'the fixture text without its last 3 lines (no probe heredoc)'
        - name: Code Acceptance
          description: The acceptance of a code card — a probe tests it, an optional smoke test of its own.
          behavior: >
            codeAcceptance(ctx, probe, smoke, extra), ctx a Card Context. code = codeTargets of the
            profile, test = testTarget when smoke is not null, else none. The body, in order: Probe Dir
            with the probe and ctx.siblings; OWN_GIT_BEFORE when ctx.ownGit; tscStep; eslintStep over
            ctx.targets; "echo '== guard'; node $P/guard.mjs src <code joined by ','>" plus "; node
            $P/guard.mjs tests <test> 1 <smoke>" with a test, then "\n"; "echo '== probe'; " + vitestStep
            with "--config $P/probe.config.mts"; with a test "echo '== own'; " + vitestStep with the test;
            ESLINT_VERDICT; extra when not null; "echo '== full'; " + vitestStep with fullArgs of
            ctx.fullExclude; OWN_GIT_AFTER when ctx.ownGit; frozenStep of ctx.frozen; untrackedStep of
            ctx.targets. The result is wrapScript(ctx.id, ctx.phase, ctx.targets, body).
          steps:
            - calls: Wrap Script
            - calls: Check Steps
            - calls: Tree Steps
            - calls: Probe Dir
            - reads: Card Context
            - produces: string
          examples:
            - given: 'ctx {id "a", phase "p1", targets ["src/x/a.ts"], siblings ["src/x/b.ts"], frozen DEFAULT_FROZEN, fullExclude [], ownGit false, the typescript profile, guard "// guard\n", firstdiff "// firstdiff\n"}; probe "// probe\n", smoke null, extra null'
              ref: "tests/fixtures/builder/code1.txt (the whole script)"
              when: "codeAcceptance"
              then: 'exactly the fixture text: stages tsc, eslint, guard, probe, the verdict, full, frozen, untracked'
            - given: 'ctx {id "a", phase "p2", targets ["src/x/a.ts", "tests/x/a.test.ts"], siblings [], frozen DEFAULT_FROZEN, fullExclude ["tests/x/old.test.ts"], ownGit true, the same profile and texts}; probe "// probe\n", smoke 5, extra "echo ''== bin''; true\n"'
              ref: "tests/fixtures/builder/code2.txt (the whole script)"
              when: "codeAcceptance"
              then: 'exactly the fixture text: own git around the stages, "node $P/guard.mjs tests tests/x/a.test.ts 1 5", an own step, the extra line after the verdict, the full step with --exclude tests/x/old.test.ts'
        - name: Judge Acceptance
          description: The acceptance of a judge card — per test file its bounds, literals and kept names, then the files run together.
          behavior: >
            judgeAcceptance(ctx, files), files the card's Judge Files in target order. litsJson(lits) =
            "[" + each literal as JSON.stringify joined by ", " + "]". The body, in order: Probe Dir
            without a probe; OWN_GIT_BEFORE when ctx.ownGit; tscStep; eslintStep over ctx.targets; for
            the n-th file (from 0) the heredoc $P/lits<n>.json (MORPH_LITS_EOF) of litsJson and "echo '==
            guard <file>'; node $P/guard.mjs tests <file> <min> <max> $P/lits<n>.json\n"; namesKept for
            every file that is not new, with its drop list; "echo '== own'; " + vitestStep with the
            targets joined by " "; ESLINT_VERDICT; the full step, OWN_GIT_AFTER, frozen and untracked as a
            code card. The result is wrapScript(ctx.id, ctx.phase, ctx.targets, body).
          steps:
            - calls: Wrap Script
            - calls: Check Steps
            - calls: Tree Steps
            - calls: Probe Dir
            - reads: Judge File
            - produces: string
          examples:
            - given: 'ctx {id "a-judge", phase "p1", targets ["tests/x/a.examples.test.ts"], siblings ["src/x/b.ts"], frozen DEFAULT_FROZEN, fullExclude [], ownGit false, typescript, "// guard\n", "// firstdiff\n"}; files [{file "tests/x/a.examples.test.ts", min 2, max 10, lits ["x \"y\"", "z"], drop [], new true}]'
              ref: "tests/fixtures/builder/judge1.txt (the whole script)"
              when: "judgeAcceptance"
              then: 'exactly the fixture text: the lits file ["x \"y\"", "z"], the guard line with 2 10, no names step'
            - given: 'ctx {id "ab-judge", phase "p3", targets ["tests/x/a.examples.test.ts", "tests/x/b.examples.test.ts"], siblings [], frozen DEFAULT_FROZEN, fullExclude ["tests/x/b.examples.test.ts"], ownGit true, the same profile and texts}; files [{a, min 3, max 11, lits ["a"], drop [], new true}, {b, min 4, max 4, lits [], drop ["B example 2: old"], new false}]'
              ref: "tests/fixtures/builder/judge2.txt (the whole script)"
              when: "judgeAcceptance"
              then: 'exactly the fixture text: lits0 and lits1 ("[]"), a names step for the b file only, the own step running both files'
            - given: 'litsJson(["a", "é"]); litsJson([])'
              when: "written"
              then: '"[\"a\", \"é\"]" (not escaped to \u00e9); "[]"'
        - name: Read Checks
          description: Turns a parsed checks document into typed Checks, or every problem it has.
          behavior: >
            validateChecks(doc: unknown). Not a plain object → {ok: false, problems: ["(root): checks
            must be an object"]}. Every object is checked against its key table — root: version, phase,
            parts, frozen, fullExclude, ownGit, cards; card: id, smoke, extra, files; file: file, min,
            max, lits, drop, new — first its unknown keys in the object's order ("<path>: unknown key
            '<k>' (known: <table joined by ', '>)"), then its keys in table order. Required: phase,
            cards, a card's id, a file's file, min, max ("<path>.<key>: required"). version must be 1
            ("version: must be 1"); phase and id must match ^[A-Za-z0-9._-]+$; a repeated id →
            "cards[<i>].id: duplicate id '<id>'"; parts, extra, file non-empty strings; frozen,
            fullExclude, lits, drop lists ("must be a list") of non-empty strings ("<path>[<j>]: must be a
            non-empty string"); ownGit and new true or false ("must be true or false"); smoke a positive
            integer; min and max non-negative integers; cards and files non-empty lists ("must be a
            non-empty list"), each item an object ("cards[<i>]: must be an object"). After a card's
            keys: files with smoke or extra → "cards[<i>]: a judge card (files) takes no smoke or
            extra"; after a file's keys: min > max → "<path>: min <min> exceeds max <max>". Defaults:
            version 1, parts "decks/<phase>/parts", frozen DEFAULT_FROZEN = ["contour.yaml",
            "morph-map.json", "docs", "decks", "tests/fixtures"], fullExclude [], ownGit false, smoke,
            extra and files null, lits and drop [], new false. Any problem → {ok: false, problems}
            (document order); none → {ok: true, checks}.
          steps:
            - reads: Checks
            - produces: Checks Result
          examples:
            - given: 'the document {phase: "p9", cards: [{id: "a"}, {id: "a-judge", files: [{file: "tests/a.examples.test.ts", min: 1, max: 9}]}]}'
              when: "validated"
              then: '{ok: true, checks: {version: 1, phase: "p9", parts: "decks/p9/parts", frozen: ["contour.yaml", "morph-map.json", "docs", "decks", "tests/fixtures"], fullExclude: [], ownGit: false, cards: [{id: "a", smoke: null, extra: null, files: null}, {id: "a-judge", smoke: null, extra: null, files: [{file: "tests/a.examples.test.ts", min: 1, max: 9, lits: [], drop: [], new: false}]}]}}'
            - given: 'the P10a checks document: phase p10, two full-suite excludes, 12 cards in the map''s order, six of them judges by files'
              ref: "tests/fixtures/builder/p10.checks.json (the document), tests/fixtures/builder/p10.checks.typed.json (the whole typed Checks)"
              when: "validated"
              then: '{ok: true, checks} with checks equal to p10.checks.typed.json'
            - given: 'the bad checks document: an unknown root key, version 2, a bad phase, frozen as a string, an empty exclude, a non-boolean ownGit, five bad cards'
              ref: "tests/fixtures/builder/badChecks.json (the document), tests/fixtures/builder/badChecks.problems.json (the 21 problems in order)"
              when: "validated"
              then: "{ok: false, problems} equal to the 21 lines of badChecks.problems.json, first \"(root): unknown key 'extra' (known: version, phase, parts, frozen, fullExclude, ownGit, cards)\", last \"cards[4].files[1]: must be an object\""
            - given: 'the documents [], null and "x"; then {}'
              when: "validated"
              then: '{ok: false, problems: ["(root): checks must be an object"]} for each; then {ok: false, problems: ["phase: required", "cards: required"]}'
        - name: Build Acceptances
          description: Sets the acceptance of every card the checks name, from its generation's siblings and the texts read.
          behavior: >
            buildAcceptances({cards, checks, profile, texts}). A profile other than typescript →
            {ok: false, errors: ["no acceptance builder for language '<id>' (only typescript)"]}.
            Else the errors, in this order: the guard, then the locator, holding any of the six heredoc
            tags (HEREDOC_TAGS: MORPH_GUARD_EOF, MORPH_CONF_EOF, MORPH_TSCONF_EOF, MORPH_FIRSTDIFF_EOF,
            MORPH_PROBE_EOF, MORPH_LITS_EOF) → "the guard holds the heredoc tag <tag>" / "the
            first-difference locator holds …", one per tag; then per checks card in order: no card of
            that id → "checks card '<id>' is not in the deck"; a judge (files not null) whose file paths
            are not exactly its targets → "judge '<id>': files <JSON of the paths> are not its targets
            <JSON of the targets>"; a code card without texts.probes[id] → "code card '<id>' has no
            probe", a probe holding a tag → "the probe of <id> holds the heredoc tag <tag>"; smoke null
            with a test target → "code card '<id>' targets the test <test> but has no smoke cap"; smoke
            with no test target → "code card '<id>' has a smoke cap but no test target". Any error →
            {ok: false, errors}. The members are the named cards in the checks' order; their generations
            are Layer Generations of the members alone (a dependency outside them is ignored); a
            member's siblings are the targets of the other members of its generation, in the checks'
            order. Each member gets Code Acceptance or Judge Acceptance with ctx {id, phase, targets,
            siblings, frozen, fullExclude, ownGit, profile, guard, firstdiff}. → {ok: true, cards}: the
            input cards in their order, each member a copy with its acceptance, every other card as
            given.
          steps:
            - calls: Code Acceptance
            - calls: Judge Acceptance
            - reads: Checks
            - uses: cards
            - produces: Build Result
          examples:
            - given: 'the P10a deck file decks/p10/v2deck.json (12 cards) with every acceptance set to null; checks p10.checks.typed.json; the typescript profile; texts guard.p10.txt, firstdiff.p10.txt and probes {<id>: decks/p10/parts/<id>.probe.ts} for the six code cards'
              ref: "tests/fixtures/builder/guard.p10.txt, tests/fixtures/builder/firstdiff.p10.txt, tests/fixtures/builder/p10.checks.typed.json"
              when: "buildAcceptances"
              then: '{ok: true, cards} equal to the cards of decks/p10/v2deck.json — the 12 acceptances byte for byte as build.py p10 wrote them (the golden check)'
            - given: 'cards a (targets ["src/x/a.ts"]), b (["src/x/b.ts"]), c (["src/x/c.ts"]), d (["src/x/d.ts"], dependsOn ["a"]), every acceptance null; checks phase "p1" with cards b, a, d; probes for a, b, d "// probe\n"; guard "// guard\n", firstdiff "// firstdiff\n"'
              when: "buildAcceptances"
              then: 'ok; a''s acceptance = codeAcceptance with siblings ["src/x/b.ts"], b''s with ["src/x/a.ts"], d''s with [] (generation 1 alone); c''s acceptance stays null'
            - given: 'cards a (["src/x/a.ts", "tests/x/a.test.ts"]), j (["tests/x/j.examples.test.ts"]); checks cards a, j (files [tests/x/k.examples.test.ts]), z; probes {}; guard "x MORPH_PROBE_EOF"'
              when: "buildAcceptances"
              then: "{ok: false, errors: [\"the guard holds the heredoc tag MORPH_PROBE_EOF\", \"code card 'a' has no probe\", \"code card 'a' targets the test tests/x/a.test.ts but has no smoke cap\", \"judge 'j': files [\\\"tests/x/k.examples.test.ts\\\"] are not its targets [\\\"tests/x/j.examples.test.ts\\\"]\", \"checks card 'z' is not in the deck\"]}"
            - given: 'any input with the python profile'
              when: "buildAcceptances"
              then: "{ok: false, errors: [\"no acceptance builder for language 'python' (only typescript)\"]}"
      dataObjects:
        - name: Checks
          description: A phase's acceptance knobs, read from its checks document (decks/<phase>/checks.json).
          schema: "{ version: 1, phase: string, parts: string, frozen: string[], fullExclude: string[], ownGit: boolean, cards: { id: string, smoke: number | null, extra: string | null, files: JudgeFile[] | null }[] }"
        - name: Judge File
          description: One test file a judge writes or patches, with the guard's bounds and literals and the HEAD names it may drop.
          schema: "{ file: string, min: number, max: number, lits: string[], drop: string[], new: boolean }"
        - name: Checks Result
          description: Typed checks, or every problem.
          schema: "{ ok: true, checks: Checks } | { ok: false, problems: string[] }"
        - name: Card Context
          description: What one card's acceptance is built from.
          schema: "{ id: string, phase: string, targets: string[], siblings: string[], frozen: string[], fullExclude: string[], ownGit: boolean, profile: LanguageProfile, guard: string, firstdiff: string }"
        - name: Build Result
          description: The cards with their acceptances, or every error.
          schema: "{ ok: true, cards: Card[] } | { ok: false, errors: string[] }"

    # ---------------------------------------------------------------- later epics (skeleton)
    - name: primer
      description: Digest of the tree, git history (Morph-Card trailers) and the run archive for a fresh session; every owned path, most recent first; markdown under a cap with explicit "… N more" lines.
      language: typescript
    - name: scout
      description: Recon session with a cheap model and read-only tools under call/read/char/round budgets; seed from the primer's ownership head; one final answer-only turn after the budget closes; scout.json with provenance and spend.
      language: typescript
    - name: reviewer
      description: >
        `morph review <base> <head>`: obligations from the record, scope table from a scout report, ownership and envelope from the primer, mutation of new tests, a findings document with EXPECTED/GOT and a source tag.
      language: typescript

Actor:
  - name: Operator
    description: A human or an agent session driving Morph from a shell.
    uses: [morph CLI]

Requirement:
  - name: Strict TypeScript
    description: tsconfig strict, ESM, no `any`; every module compiles with tsc --noEmit.
  - name: One Document Out
    description: Every command prints exactly one JSON document on stdout and nothing else; the human log goes to stderr.
  - name: Deterministic Core
    description: >
      cards and compiler give byte-identical results for the same inputs: no clock, no
      randomness, no environment reads. acceptance is bound only in its pure parts (Snapshot
      Targets, Build Attempt Diff): Run Acceptance spawns a shell and its only timer is the
      child's timeout; env and the timeout are parameters, never process.env (06.10, P3).
      processor reads the environment only in Read Registry; Assemble Request, Read Response
      and Stub Answer are pure of clock and network; the transport and its sleep are
      parameters of Send Generation (P4).
      git spawns only in Run Git, synchronously, with the child's environment given whole as
      a parameter; it reads no process.env and no clock of its own (P6).
      cli touches the process only in its entry src/cli.ts: the environment, the working
      directory, the clock and the output streams reach main() as parameters, and the
      environment reaches the processor only through Read Registry (P7).
      language is pure data and pure functions: no clock, no environment, no file system,
      no child process; node:path is its only Node module; its shell lines are text (P8).
      contour reads no file, no clock and no environment: it parses the text it is given;
      the package yaml is imported in Parse Document alone (P9).
      planner reads no file, no clock and no environment: the cli reads the record and the
      map and passes which files exist as a function; node:path is its only Node module (P10a).
      builder reads no file, no clock and no environment: the caller passes the checks, the cards,
      the profile and the texts of the guard, the locator and the probes; node:path is its only Node
      module (P10b).
  - name: Node Only
    description: >
      Runtime dependencies: Node 20 built-ins and the package `yaml` (the record reader), nothing
      else; dev dependencies pinned exactly, no ^ or ~.

Guardrail:
  - name: No Network In Tests
    description: tests/setup.ts makes fetch, XMLHttpRequest, WebSocket and net.connect throw "network blocked in tests"; only the processor's own transport is mocked.
  - name: No Shell Outside Acceptance
    description: child processes are spawned only by Run Acceptance, the git module (in Run Git alone, P6) and the processor's none; everything else is pure.
  - name: Frozen Tree During Run
    description: while a run is in flight no file outside the cards' targets and .morph/ changes; a changed declared input discards the answer unread.
