            "\n\n" + PATCH_CONTRACT, acceptance patchAcceptance(targets), model null, maxTokens max(16000, ceil(targetBytes /
            3) × 2), reasoning null, variants 1, dependsOn []}. PATCH_CONTRACT = "Change the target files of this card to do
            the task above. Return each target file COMPLETE, not a diff. Keep the public names the files already declare:
