version: 1
System:
  name: Ledger
  description: A fixture project for the record section of the primer.
  groups:
    - name: units
      description: Money in cents.
      owner: ledger team
      language: typescript
      functions:
        - name: Add Cents
          description: The sum of two amounts.
          behavior: addCents(a, b) → a + b.
          steps: [{reads: Amount}, {produces: Amount}]
          examples:
            - {given: '1 and 2', when: addCents, then: '3'}
        - name: Format Total
          description: An amount as text.
          behavior: formatTotal(cents) → the amount in units with two decimals.
          steps: [{reads: Amount}, {produces: Total Text}]
          examples:
            - {given: '150', when: formatTotal, then: '"1.50"'}
        - name: Parse Line
          description: One amount read from a line.
          behavior: parseLine(line) → the integer the line holds.
          steps: [{reads: Line}, {produces: Amount}]
      dataObjects:
        - name: Amount
          description: An amount in cents.
          schema: "number"

    # ---- the report
    - name: report
      description: The report of a ledger.
      functions:
        - name: Render Report
          description: The report text.
          behavior: renderReport(amounts) → one line per amount.
          steps: [{reads: Amount}, {uses: units}, {produces: Report Text}]
          examples:
            - {given: '[1, 2]', when: renderReport, then: '"1, 2"'}
      dataObjects:
        - name: Report Text
          description: The rendered report.
          schema: "string"
