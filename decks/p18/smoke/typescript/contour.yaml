version: 1
System:
  name: slugs
  description: >
    Turns titles into URL slugs and counts their words. One Component, text (src/text/), pure functions.
  requirements: []
  guardrails: []
  groups:
    - name: text
      description: Pure string helpers in src/text/; no I/O, no clock, no environment.
      language: typescript
      functions:
        - name: Slugify
          description: A title as a URL slug.
          behavior: >
            Exported as `slugify(title: string): string` from src/text/slugify.ts. Lower-cases the title, replaces every
            run of characters outside a-z and 0-9 by one "-", and strips "-" from both ends.
          steps:
            - produces: string
          examples:
            - {given: '"Hello, World!"', when: slugified, then: '"hello-world"'}
            - {given: '"  Morph -- Cards 2  "', when: slugified, then: '"morph-cards-2"'}
            - {given: '"!!!"', when: slugified, then: '""'}
        - name: Word Count
          description: The number of words of a text.
          behavior: >
            Exported as `wordCount(text: string): number` from src/text/wordCount.ts. A word is a maximal run of
            non-white-space characters; an empty or white-space-only text has 0 words.
          steps:
            - produces: number
          examples:
            - {given: '"one two  three"', when: counted, then: "3"}
            - {given: '"  \\t\\n "', when: counted, then: "0"}
            - {given: '"a-b c"', when: counted, then: "2"}
