version: 1
System:
  name: numbers
  description: >
    Two independent number helpers: a number kept inside a range, and the sign of a number.
  groups:
    - name: calc
      description: Pure arithmetic helpers, no I/O.
      language: typescript
      functions:
        - name: Clamp Value
          description: A number kept inside the closed range [lo, hi].
          behavior: >
            Exported as `clampValue(x: number, lo: number, hi: number): number`. Returns lo when x < lo,
            hi when x > hi, else x. Assumes lo <= hi.
          steps:
            - produces: number
          examples:
            - given: x 5, lo 0, hi 10
              when: clamped
              then: "5"
            - given: x -3, lo 0, hi 10
              when: clamped
              then: "0"
            - given: x 42, lo 0, hi 10
              when: clamped
              then: "10"
        - name: Sign Of
          description: The sign of a number as -1, 0 or 1.
          behavior: >
            Exported as `signOf(x: number): number`. Returns -1 when x < 0, 1 when x > 0, else 0.
            Imports nothing.
          steps:
            - produces: number
          examples:
            - given: x -7.5
              when: signed
              then: "-1"
            - given: x 0
              when: signed
              then: "0"
            - given: x 42
              when: signed
              then: "1"
